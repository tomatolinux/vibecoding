<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사회복지조사론 워크북 연습문제</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --primary: #1a5276;
    --primary-light: #2e86c1;
    --accent: #e74c3c;
    --accent2: #f39c12;
    --bg: #f0f4f8;
    --card: #ffffff;
    --sidebar: #1a3a5c;
    --sidebar-text: #cfe2f3;
    --correct: #1e8449;
    --wrong: #c0392b;
    --bookmark: #e67e22;
    --border: #d5e8f0;
    --text: #1a252f;
    --muted: #7f8c8d;
    --header-h: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  #header {
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: var(--header-h);
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    z-index: 100;
  }
  #header .title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  #header .title span { font-weight: 300; font-size: 14px; margin-left: 8px; opacity: 0.8; }
  #header .right-info { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  #header .right-info .tag { background: rgba(255,255,255,0.15); border-radius: 4px; padding: 3px 9px; font-size: 12px; }

  /* 헤더 우상단 채점/처음으로 버튼 */
  .header-action-btn {
    padding: 6px 13px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    transition: opacity .15s;
    display: none;
  }
  .header-action-btn:hover { opacity: .85; }
  #btn-header-grade { background: #e74c3c; color: #fff; }
  #btn-header-retry { background: #e67e22; color: #fff; }
  #btn-header-home  { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); }

  /* ── TAB BAR ── */
  #tabbar {
    background: #eaf2f8;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: flex-end;
    padding: 0 20px;
    gap: 4px;
    flex-shrink: 0;
  }
  .tab-btn {
    padding: 8px 20px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    background: #dce9f5;
    color: var(--primary);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: background .15s;
  }
  .tab-btn.active { background: var(--card); color: var(--primary); font-weight: 700; }

  /* ── BODY LAYOUT ── */
  #body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── MAIN AREA ── */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    position: relative;
  }

  /* ── START SCREEN ── */
  #start-screen {
    max-width: 560px;
    margin: 60px auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 48px 40px;
    text-align: center;
  }
  #start-screen h2 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
  #start-screen p { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
  .start-options { display: flex; flex-direction: column; gap: 14px; }
  .start-btn {
    padding: 18px 24px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #f7fbff;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    transition: all .2s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .start-btn:hover { border-color: var(--primary-light); background: #eaf3fb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .start-btn .icon { font-size: 26px; }
  .start-btn small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }

  /* ── QUESTION CARD ── */
  .q-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; }
  .q-text {
    font-size: 15px;
    line-height: 1.75;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--text);
  }
  .q-box {
    background: #f8fbfd;
    border-left: 3px solid var(--primary-light);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.8;
    color: #1c2e3e;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: var(--card);
    transition: all .15s;
    font-size: 14px;
    line-height: 1.6;
  }
  .option:hover { border-color: var(--primary-light); background: #eaf3fb; }
  /* 사용자가 선택한 답: 파란 배경으로 문제번호와 명확히 구분 */
  .option.selected { border-color: var(--primary); background: #d6eaf8; color: var(--primary); font-weight: 600; }
  .option.correct { border-color: var(--correct); background: #eafaf1; color: var(--correct); }
  .option.wrong { border-color: var(--wrong); background: #fdedec; color: var(--wrong); }
  .option.show-correct { border-color: var(--correct); background: #eafaf1; color: var(--correct); }
  .option .num { font-weight: 700; min-width: 20px; }

  /* explanation */
  .explanation {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    background: #fdfaf0;
    border-left: 3px solid var(--accent2);
    border-radius: 4px;
    font-size: 13.5px;
    line-height: 1.75;
    color: #5d4037;
  }
  .explanation.show { display: block; }
  #exp-text, .explanation > div:last-child { white-space: pre-line; }
  .exp-label { font-weight: 700; color: var(--accent2); margin-bottom: 4px; }

  /* bottom nav */
  .q-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    padding: 9px 22px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    transition: all .15s;
  }
  .nav-btn:hover { background: #eaf3fb; border-color: var(--primary-light); }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
  .nav-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .nav-btn.primary:hover { background: var(--primary-light); }

  .bm-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: all .15s;
  }
  .bm-btn.bookmarked { color: var(--bookmark); border-color: var(--bookmark); background: #fef5e7; }
  .bm-btn:hover { border-color: var(--bookmark); color: var(--bookmark); }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 220px;
    background: var(--sidebar);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 16px 12px;
  }
  #sidebar h4 { color: var(--sidebar-text); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.7; }
  #q-grid { display: flex; flex-direction: column; gap: 4px; }
  .q-dot {
    width: 100%;
    border-radius: 5px;
    background: rgba(255,255,255,0.1);
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all .15s;
    border: 1.5px solid transparent;
  }
  .q-dot:hover { background: rgba(255,255,255,0.2); }
  .q-dot.current { border-color: #7fb3d3; color: #fff; background: rgba(255,255,255,0.15); }
  .q-dot.answered { background: rgba(255,255,255,0.15); color: #aed6f1; }
  .q-dot.bookmarked-dot { background: rgba(230,126,34,0.35); border-color: var(--bookmark); color: #f0a500; }
  .q-dot.correct-dot { background: rgba(30,132,73,0.4); color: #82e0aa; }
  .q-dot.wrong-dot { background: rgba(192,57,43,0.45); color: #f1948a; }

  .q-dot .dot-num {
    min-width: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
  }
  /* 선택된 답 표시: 흰 배경 뱃지 - 문제번호와 배경 명확히 구분 */
  .q-dot .dot-ans {
    font-size: 12px;
    margin-left: 4px;
    background: rgba(255,255,255,0.88);
    color: var(--sidebar);
    border-radius: 3px;
    padding: 1px 5px;
    font-weight: 700;
  }

  .sidebar-score {
    margin-top: 18px;
    padding: 12px;
    background: rgba(255,255,255,0.07);
    border-radius: 8px;
    color: var(--sidebar-text);
    font-size: 12px;
    line-height: 1.8;
  }
  .sidebar-score strong { font-size: 20px; color: #fff; }

  .score-actions { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .score-actions button {
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
  }
  .btn-grade { background: var(--accent); color: #fff; }
  .btn-retry { background: var(--bookmark); color: #fff; }
  .btn-home { background: rgba(255,255,255,0.15); color: #fff; }

  /* result screen */
  #result-screen {
    max-width: 580px;
    margin: 40px auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 40px 36px;
    text-align: center;
  }
  #result-screen h2 { font-size: 24px; color: var(--primary); margin-bottom: 6px; }
  .score-big { font-size: 64px; font-weight: 700; color: var(--primary); line-height: 1; margin: 20px 0 8px; }
  .score-sub { font-size: 15px; color: var(--muted); margin-bottom: 24px; }
  .result-grid { display: flex; gap: 16px; justify-content: center; margin-bottom: 28px; }
  .result-stat { flex: 1; padding: 16px; border-radius: 10px; }
  .result-stat.c { background: #eafaf1; color: var(--correct); }
  .result-stat.w { background: #fdedec; color: var(--wrong); }
  .result-stat.b { background: #fef5e7; color: var(--bookmark); }
  .result-stat .label { font-size: 12px; margin-bottom: 4px; }
  .result-stat .val { font-size: 28px; font-weight: 700; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .result-actions button {
    padding: 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    transition: opacity .15s;
  }
  .result-actions button:hover { opacity: .85; }
  .btn-a { background: var(--accent); color: #fff; }
  .btn-b { background: var(--bookmark); color: #fff; }
  .btn-c { background: var(--primary); color: #fff; }
  .btn-d { background: #ecf0f1; color: var(--text); }

  .hidden { display: none !important; }

  /* ── EXPAND ALL VIEW ── */
  #expand-all-screen { display: none; padding: 24px 28px; }
  #expand-all-screen.active { display: block; }
  .all-q-card {
    background: var(--card);
    border-radius: 10px;
    border: 1.5px solid var(--border);
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .all-q-card .q-num { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .all-q-card .q-text { font-size: 14px; font-weight: 600; margin-bottom: 14px; line-height: 1.7; }
  .all-q-card .options { gap: 7px; }
  .all-q-card .option { padding: 9px 13px; font-size: 13px; }

  #timer-box { display: none; }

  .timer-danger { color: #ff6b6b !important; animation: blink .8s step-end infinite; }
  @keyframes blink { 50% { opacity: .4; } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #b0c4d8; border-radius: 3px; }

  /* 답을 고른 문제는 바로 채점되므로 더 이상 바꿀 수 없음 */
  .option.locked { cursor: default; }
  .option.locked:hover { border-color: inherit; }
  .option.correct.locked:hover, .option.show-correct.locked:hover { border-color: var(--correct); background: #eafaf1; }
  .option.wrong.locked:hover { border-color: var(--wrong); background: #fdedec; }
  .option.locked:not(.correct):not(.wrong):hover { border-color: var(--border); background: var(--card); }
  .feedback { font-weight: 700; margin-bottom: 4px; }
  .feedback.ok { color: var(--correct); }
  .feedback.ng { color: var(--wrong); }

  /* 사이드바 상단 버튼 묶음 (폰 모드에서만 표시) */
  #side-actions { display: none; }
  #btn-phone { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); display: inline-block; }

  /* ── PHONE MODE ── */
  body.phone { height: 100dvh; }
  body.phone #header { height: 40px; padding: 0 10px; }
  body.phone #header .title { font-size: 14px; }
  body.phone #header .title span { display: none; }
  body.phone.quiz-on #header { display: none; }
  body.phone #main { padding: 10px 12px; }
  body.phone #start-screen { margin: 12px auto; padding: 22px 16px; }
  body.phone #start-screen h2 { font-size: 18px; }
  body.phone #start-screen p { margin-bottom: 16px; }
  body.phone .start-options { gap: 8px; }
  body.phone .start-btn { padding: 11px 14px; font-size: 14px; }
  body.phone .start-btn .icon { font-size: 20px; }

  body.phone .q-num { font-size: 11px; margin-bottom: 4px; }
  body.phone .q-text { font-size: 14.5px; line-height: 1.55; margin-bottom: 10px; }
  body.phone .q-box { padding: 8px 10px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; }
  body.phone .options { gap: 5px; }
  body.phone .option { padding: 8px 10px; gap: 8px; font-size: 13.5px; line-height: 1.45; border-radius: 6px; }
  body.phone .explanation { margin-top: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.55; }
  body.phone .q-nav { margin-top: 12px; padding-top: 10px; }
  body.phone .nav-btn { padding: 8px 14px; }
  body.phone .bm-btn { padding: 7px 11px; }
  body.phone #expand-all-screen { padding: 0; }
  body.phone .all-q-card { padding: 10px 12px; margin-bottom: 10px; }
  body.phone .all-q-card .q-text { margin-bottom: 8px; }
  body.phone .all-q-card .options { gap: 5px; }
  body.phone .all-q-card .option { padding: 7px 10px; }
  body.phone #result-screen { margin: 12px auto; padding: 20px 16px; }
  body.phone .score-big { font-size: 44px; margin: 10px 0 6px; }
  body.phone .result-grid { gap: 8px; margin-bottom: 14px; }
  body.phone .result-stat { padding: 10px 6px; }
  body.phone .result-actions button { padding: 10px; }

  body.phone #side-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  body.phone #side-actions button {
    flex: 1 1 auto; padding: 7px 6px; border-radius: 6px; border: none; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  #sa-grade { background: #e74c3c; color: #fff; }
  #sa-retry { background: #e67e22; color: #fff; }
  #sa-home, #sa-expand, #sa-phone { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3) !important; }
  #sa-timer { flex-basis: 100%; text-align: center; color: #fff; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

  /* 폰 가로모드: 오른쪽 좁은 사이드바 */
  @media (orientation: landscape) {
    body.phone #sidebar { width: 150px; padding: 8px 8px; }
    body.phone .q-dot { padding: 5px 8px; }
  }
  /* 폰 세로모드: 위쪽 가로 막대 (버튼 + 문제번호 가로 스크롤) */
  @media (orientation: portrait) {
    body.phone #body { flex-direction: column-reverse; }
    body.phone #sidebar { width: 100%; min-width: 0; padding: 6px 8px 4px; overflow: hidden; }
    body.phone #main { min-width: 0; width: 100%; }
    body.phone #sidebar h4 { display: none; }
    body.phone #side-actions { margin-bottom: 6px; }
    body.phone #side-actions { flex-wrap: nowrap; }
    body.phone #side-actions button { flex: 1 1 0; min-width: 0; padding: 6px 2px; font-size: 11.5px; }
    body.phone #sa-expand, body.phone #sa-phone { flex: 0 0 34px !important; }
    body.phone #sa-timer { flex: 0 0 auto; font-size: 13px; align-self: center; }
    body.phone #q-grid { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    body.phone .q-dot { width: auto; flex: 0 0 auto; padding: 5px 7px; }
    body.phone .sidebar-score { display: none; }
  }
</style>
</head>
<body>

<div id="header">
  <div class="title">사회복지조사론 <span>워크북 연습문제</span></div>
  <div class="right-info">
    <span class="tag" id="mode-tag">모드 선택 중</span>
    <span id="progress-text" style="font-size:13px;opacity:.85"></span>
    <div id="timer-box" style="display:none;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border-radius:6px;padding:4px 12px;">
      <span style="font-size:11px;opacity:.8;line-height:1.3;">남은<br>시간</span>
      <span id="timer-display" style="font-size:20px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;">20:00</span>
    </div>
    <button id="btn-header-grade" class="header-action-btn" onclick="gradeQuiz()">📊 채점하기</button>
    <button id="btn-header-retry" class="header-action-btn" onclick="retryQuiz()">🔄 다시하기</button>
    <button id="btn-header-home"  class="header-action-btn" onclick="showStart()">🏠 처음으로</button>
    <button id="btn-phone" class="header-action-btn" onclick="togglePhoneMode()">📱 폰 모드</button>
    <button id="expand-btn" onclick="toggleExpandView()" title="전체보기/한문제씩" style="display:none;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.3);border-radius:6px;color:#fff;width:38px;height:38px;font-size:20px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;">⇅</button>
  </div>
</div>


<div id="body">
  <div id="main">
    <!-- Start Screen -->
    <div id="start-screen">
      <h2>📚 사회복지조사론</h2>
      <p>1강~15강 워크북 연습문제 · 총 75문항</p>
      <div class="start-options">
        <button class="start-btn" onclick="startQuiz('random')">
          <span class="icon">🎲</span>
          <div>
            랜덤 30문제
            <small>전체 문제 중 무작위로 30문항 출제 · ⏱ 20분 제한</small>
          </div>
        </button>
        <button class="start-btn" onclick="startQuiz('all')">
          <span class="icon">📋</span>
          <div>
            전체 문제 풀기
            <small>1강부터 15강까지 전체 75문항 · 시간 제한 없음</small>
          </div>
        </button>
        <button class="start-btn" onclick="startQuiz('bookmark')">
          <span class="icon">🔖</span>
          <div>
            책갈피 문제만 풀기
            <small>저장된 책갈피 문제만 출제</small>
          </div>
        </button>
        <button class="start-btn" onclick="startQuiz('wrong')">
          <span class="icon">❌</span>
          <div>
            틀린 문제만 다시 풀기
            <small>이전 채점에서 틀린 문제만 출제</small>
          </div>
        </button>
      </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hidden">

// ==============================
// STATE
// ==============================
let questions = [];
let currentIdx = 0;
let answers = {};       // idx → chosen option (0-based)
let bookmarks = new Set(JSON.parse(localStorage.getItem('swr_bm') || '[]'));
let wrongSet = new Set(JSON.parse(localStorage.getItem('swr_wrong') || '[]'));
let graded = false;
let currentMode = '';
let expandView = false;

// ── TIMER ──
let timerInterval = null;
let timerSeconds = 20 * 60;

function startTimer() {
  clearInterval(timerInterval);
  timerSeconds = 20 * 60;
  updateTimerDisplay();
  const box = document.getElementById('timer-box');
  box.style.display = 'flex';
  document.getElementById('sa-timer').classList.remove('hidden');
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      alert('⏰ 시험 시간이 종료되었습니다!');
      gradeQuiz();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer-box').style.display = 'none';
  document.getElementById('sa-timer').classList.add('hidden');
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const txt = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el = document.getElementById('timer-display');
  el.textContent = txt;
  el.className = timerSeconds <= 60 ? 'timer-danger' : '';
  const st = document.getElementById('sa-timer');
  st.textContent = '⏱ ' + txt;
  st.classList.toggle('timer-danger', timerSeconds <= 60);
}

// ── EXPAND / COLLAPSE VIEW ──
function toggleExpandView() {
  expandView = !expandView;
  const btn = document.getElementById('expand-btn');
  const quizScreen = document.getElementById('quiz-screen');
  const expandScreen = document.getElementById('expand-all-screen');

  if (expandView) {
    btn.textContent = '⊟';
    btn.title = '한 문제씩 보기';
    quizScreen.classList.add('hidden');
    expandScreen.style.display = 'block';
    renderExpandAll();
  } else {
    btn.textContent = '⇅';
    btn.title = '전체 문제 보기';
    expandScreen.style.display = 'none';
    quizScreen.classList.remove('hidden');
    renderQuestion();
  }
}

function renderExpandAll() {
  const screen = document.getElementById('expand-all-screen');
  screen.innerHTML = '';
  const nums = ['①','②','③','④','⑤'];
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'all-q-card';
    card.id = `all-q-${i}`;

    const numDiv = document.createElement('div');
    numDiv.className = 'q-num';
    numDiv.textContent = `${i + 1} / ${questions.length} 번 문제 · ${q.lec}강`;
    card.appendChild(numDiv);

    const textDiv = document.createElement('div');
    textDiv.className = 'q-text';
    textDiv.textContent = q.q;
    card.appendChild(textDiv);

    if (q.box && q.box.length) {
      const boxDiv = document.createElement('div');
      boxDiv.className = 'q-box';
      q.box.forEach(t => { const d = document.createElement('div'); d.textContent = t; boxDiv.appendChild(d); });
      card.appendChild(boxDiv);
    }

    const optsDiv = document.createElement('div');
    optsDiv.className = 'options';
    q.opts.forEach((opt, oi) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<span class="num">${nums[oi]}</span><span>${opt}</span>`;
      if (graded || answers[i] !== undefined) {
        markOption(div, oi, q.ans, answers[i]);
      } else {
        div.onclick = () => {
          answers[i] = oi;
          const y = card.getBoundingClientRect().top;
          renderExpandAll(); renderGrid(); updateProgress();
          // 다시 그린 뒤에도 보던 위치 유지
          const nc = document.getElementById(`all-q-${i}`);
          if (nc) document.getElementById('main').scrollTop += nc.getBoundingClientRect().top - y;
        };
      }
      optsDiv.appendChild(div);
    });
    card.appendChild(optsDiv);

    if (graded || answers[i] !== undefined) {
      const expDiv = document.createElement('div');
      expDiv.className = 'explanation show';
      expDiv.innerHTML = feedbackHtml(q, answers[i]) + `<div class="exp-label">💡 해설</div><div>${q.exp}</div>`;
      card.appendChild(expDiv);
    }

    screen.appendChild(card);
  });
}

function saveBookmarks() {
  localStorage.setItem('swr_bm', JSON.stringify([...bookmarks]));
}
function saveWrong() {
  localStorage.setItem('swr_wrong', JSON.stringify([...wrongSet]));
}

// ==============================
// NAVIGATION
// ==============================
function showStart() {
  document.body.classList.remove('quiz-on');
  document.getElementById('start-screen').classList.remove('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('expand-all-screen').style.display = 'none';
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('mode-tag').textContent = '모드 선택 중';
  document.getElementById('progress-text').textContent = '';
  document.getElementById('expand-btn').style.display = 'none';
  setHeaderBtns(false, false, false);
  stopTimer();
  graded = false;
  answers = {};
  questions = [];
  currentIdx = 0;
  expandView = false;
}

function setHeaderBtns(grade, retry, home) {
  document.getElementById('btn-header-grade').style.display = grade ? 'inline-block' : 'none';
  document.getElementById('btn-header-retry').style.display = retry ? 'inline-block' : 'none';
  document.getElementById('btn-header-home').style.display = home ? 'inline-block' : 'none';
  document.getElementById('sa-grade').style.display = grade ? '' : 'none';
  document.getElementById('sa-retry').style.display = retry ? '' : 'none';
  document.getElementById('sa-home').style.display = home ? '' : 'none';
  document.getElementById('sa-expand').style.display = grade ? '' : 'none';
}

function retryQuiz() {
  if (!confirm('다시 풀기 하면 현재 답이 초기화됩니다. 계속하시겠습니까?')) return;
  startQuiz(currentMode);
}

function startQuiz(mode) {
  currentMode = mode;
  graded = false;
  answers = {};
  currentIdx = 0;
  expandView = false;
  let useTimer = false;

  if (mode === 'random') {
    questions = shuffle([...ALL_QUESTIONS]).slice(0, 30);
    document.getElementById('mode-tag').textContent = '랜덤 30문제';
    useTimer = true;  // 랜덤만 20분 타이머
  } else if (mode === 'all') {
    questions = [...ALL_QUESTIONS];
    document.getElementById('mode-tag').textContent = `전체 ${questions.length}문제`;
    useTimer = false; // 전체 문제는 시간제한 없음
  } else if (mode === 'bookmark') {
    const bmIds = [...bookmarks];
    questions = ALL_QUESTIONS.filter((_, i) => bmIds.includes(i));
    if (questions.length === 0) { alert('📌 책갈피된 문제가 없습니다.'); return; }
    document.getElementById('mode-tag').textContent = `책갈피 ${questions.length}문제`;
    useTimer = false;
  } else if (mode === 'wrong') {
    questions = [...wrongSet].map(i => ALL_QUESTIONS[i]).filter(Boolean);
    if (questions.length === 0) { alert('✅ 틀린 문제가 없습니다!'); return; }
    document.getElementById('mode-tag').textContent = `오답 ${questions.length}문제`;
    useTimer = false;
  }

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('expand-all-screen').style.display = 'none';
  document.getElementById('quiz-screen').classList.remove('hidden');
  document.getElementById('sidebar').classList.remove('hidden');
  document.body.classList.add('quiz-on');
  document.getElementById('expand-btn').style.display = 'flex';
  document.getElementById('expand-btn').textContent = '⇅';
  setHeaderBtns(true, true, true);

  if (useTimer) {
    startTimer();
  } else {
    stopTimer();
  }

  renderQuestion();
  renderGrid();
}

function navigate(dir) {
  const newIdx = currentIdx + dir;
  if (newIdx < 0 || newIdx >= questions.length) return;
  currentIdx = newIdx;
  renderQuestion();
  renderGrid();
}

function goToQuestion(i) {
  if (expandView) {
    const card = document.getElementById(`all-q-${i}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    currentIdx = i;
    renderGrid();
    return;
  }
  currentIdx = i;
  renderQuestion();
  renderGrid();
}

// ==============================
// RENDER QUESTION
// ==============================
function renderQuestion() {
  const q = questions[currentIdx];
  if (!q) return;

  const origIdx = ALL_QUESTIONS.indexOf(q);
  const label = document.getElementById('q-num-label');
  label.textContent = `${currentIdx + 1} / ${questions.length} 번 문제 · ${q.lec}강`;

  document.getElementById('q-text').textContent = q.q;
  const boxEl = document.getElementById('q-box');
  if (q.box && q.box.length) {
    boxEl.innerHTML = '';
    q.box.forEach(t => { const d = document.createElement('div'); d.textContent = t; boxEl.appendChild(d); });
    boxEl.classList.remove('hidden');
  } else {
    boxEl.classList.add('hidden');
  }
  document.getElementById('q-text').style.fontWeight = '600';

  const optsCont = document.getElementById('options');
  optsCont.innerHTML = '';

  const nums = ['①','②','③','④','⑤'];
  q.opts.forEach((opt, oi) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="num">${nums[oi]}</span><span>${opt}</span>`;

    if (graded || answers[currentIdx] !== undefined) {
      markOption(div, oi, q.ans, answers[currentIdx]);
    } else {
      div.onclick = () => selectOption(oi);
    }
    optsCont.appendChild(div);
  });

  // Explanation
  const expEl = document.getElementById('explanation');
  const expText = document.getElementById('exp-text');
  if (graded || answers[currentIdx] !== undefined) {
    expEl.classList.remove('hidden');
    expEl.classList.add('show');
    document.getElementById('exp-feedback').innerHTML = feedbackHtml(q, answers[currentIdx]);
    expText.textContent = q.exp;
  } else {
    expEl.classList.remove('show');
  }

  // Bookmark btn
  const bmBtn = document.getElementById('bm-btn');
  if (bookmarks.has(origIdx)) {
    bmBtn.classList.add('bookmarked');
    bmBtn.textContent = '🔖 책갈피됨';
  } else {
    bmBtn.classList.remove('bookmarked');
    bmBtn.textContent = '🔖 책갈피';
  }

  // prev/next
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').textContent = currentIdx === questions.length - 1 ? '완료' : '다음 ▶';

  // progress
  updateProgress();

}

function selectOption(oi) {
  if (graded || answers[currentIdx] !== undefined) return;   // 한 번 고르면 바로 채점, 변경 불가
  answers[currentIdx] = oi;
  renderQuestion();
  renderGrid();
}

// 정답/오답 표시 (고른 답이 틀리면 빨강, 정답은 항상 초록)
function markOption(div, oi, ans, chosen) {
  div.classList.add('locked');
  if (oi === ans) div.classList.add('correct');
  else if (chosen === oi) div.classList.add('wrong');
}

function feedbackHtml(q, chosen) {
  const nums = ['①','②','③','④','⑤'];
  if (chosen === undefined) return `<div class="feedback ng">미응답 · 정답 ${nums[q.ans]}</div>`;
  if (chosen === q.ans) return `<div class="feedback ok">⭕ 정답입니다</div>`;
  return `<div class="feedback ng">❌ 오답입니다 · 정답 ${nums[q.ans]}</div>`;
}

function updateProgress() {
  const answered = Object.keys(answers).length;
  const right = questions.filter((q, i) => answers[i] === q.ans).length;
  document.getElementById('progress-text').textContent =
    `${answered} / ${questions.length} 문제 응답 · 정답 ${right}`;
}

function toggleBookmark() {
  const q = questions[currentIdx];
  const origIdx = ALL_QUESTIONS.indexOf(q);
  if (bookmarks.has(origIdx)) bookmarks.delete(origIdx);
  else bookmarks.add(origIdx);
  saveBookmarks();
  renderQuestion();
  renderGrid();
}

// ==============================
// RENDER GRID
// ==============================
function renderGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  const nums = ['①','②','③','④','⑤'];
  questions.forEach((q, i) => {
    const origIdx = ALL_QUESTIONS.indexOf(q);
    const div = document.createElement('div');
    div.className = 'q-dot';

    const numEl = document.createElement('span');
    numEl.className = 'dot-num';
    numEl.textContent = i + 1;
    div.appendChild(numEl);

    if (answers[i] !== undefined) {
      const ansEl = document.createElement('span');
      ansEl.className = 'dot-ans';
      ansEl.textContent = nums[answers[i]];
      div.appendChild(ansEl);
    }

    div.onclick = () => goToQuestion(i);

    if (i === currentIdx) div.classList.add('current');
    if (bookmarks.has(origIdx)) div.classList.add('bookmarked-dot');
    if (answers[i] === q.ans) div.classList.add('correct-dot');
    else if (answers[i] !== undefined) div.classList.add('wrong-dot');
    grid.appendChild(div);
  });
}

// ==============================
// GRADE
// ==============================
function gradeQuiz() {
  graded = true;
  stopTimer();
  document.getElementById('expand-btn').style.display = 'none';
  document.getElementById('expand-all-screen').style.display = 'none';
  expandView = false;
  let correct = 0, wrong = 0;
  const newWrong = new Set();
  questions.forEach((q, i) => {
    const origIdx = ALL_QUESTIONS.indexOf(q);
    if (answers[i] === q.ans) { correct++; wrongSet.delete(origIdx); }
    else { wrong++; newWrong.add(origIdx); wrongSet.add(origIdx); }
  });
  saveWrong();

  const unanswered = questions.length - Object.keys(answers).length;
  const score = Math.round((correct / questions.length) * 100);

  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('res-score').textContent = `${score}점`;
  document.getElementById('res-sub').textContent = `총 ${questions.length}문제 중 ${correct}문제 정답`;
  document.getElementById('res-c').textContent = correct;
  // wrong 에는 이미 미응답이 포함되어 있음 (정답이 아니면 모두 오답으로 셈)
  document.getElementById('res-w').textContent = wrong;
  document.getElementById('res-b').textContent = bookmarks.size;
  setHeaderBtns(false, false, true);

  renderGrid();
  document.getElementById('main').scrollTop = 0;
}

// ==============================
// PHONE MODE
// ==============================
// 저장된 선택이 없으면 화면이 작은 기기(폰)에서 자동으로 켬
function initPhoneMode() {
  let saved = null;
  try { saved = localStorage.getItem('swr_phone'); } catch (e) {}
  const small = window.matchMedia('(max-width: 900px), (max-height: 500px)').matches;
  setPhoneMode(saved === null ? small : saved === '1');
}
function setPhoneMode(on) {
  document.body.classList.toggle('phone', on);
  document.getElementById('btn-phone').textContent = on ? '🖥 PC 모드' : '📱 폰 모드';
}
function togglePhoneMode() {
  const on = !document.body.classList.contains('phone');
  setPhoneMode(on);
  try { localStorage.setItem('swr_phone', on ? '1' : '0'); } catch (e) {}
}
initPhoneMode();

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
