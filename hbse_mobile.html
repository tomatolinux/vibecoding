<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인간행동과 사회환경 퀴즈</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --primary: #1a5276;
    --primary-light: #2e86c1;
    --accent: #e74c3c;
    --accent2: #f39c12;
    --bg: #f0f4f8;
    --card: #ffffff;
    --sidebar: #1a3a5c;
    --sidebar-text: #cfe2f3;
    --correct: #1e8449;
    --wrong: #c0392b;
    --bookmark: #e67e22;
    --border: #d5e8f0;
    --text: #1a252f;
    --muted: #7f8c8d;
    --header-h: 56px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  #header {
    background: var(--primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: var(--header-h);
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    z-index: 100;
  }
  #header .title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  #header .title span { font-weight: 300; font-size: 14px; margin-left: 8px; opacity: 0.8; }
  #header .right-info { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  #header .right-info .tag { background: rgba(255,255,255,0.15); border-radius: 4px; padding: 3px 9px; font-size: 12px; }

  /* 헤더 우상단 채점/처음으로 버튼 */
  .header-action-btn {
    padding: 6px 13px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    transition: opacity .15s;
    display: none;
  }
  .header-action-btn:hover { opacity: .85; }
  #btn-header-grade { background: #e74c3c; color: #fff; }
  #btn-header-retry { background: #e67e22; color: #fff; }
  #btn-header-home  { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); }

  /* ── TAB BAR ── */
  #tabbar {
    background: #eaf2f8;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: flex-end;
    padding: 0 20px;
    gap: 4px;
    flex-shrink: 0;
  }
  .tab-btn {
    padding: 8px 20px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    background: #dce9f5;
    color: var(--primary);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: background .15s;
  }
  .tab-btn.active { background: var(--card); color: var(--primary); font-weight: 700; }

  /* ── BODY LAYOUT ── */
  #body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── MAIN AREA ── */
  #main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    position: relative;
  }

  /* ── START SCREEN ── */
  #start-screen {
    max-width: 560px;
    margin: 60px auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 48px 40px;
    text-align: center;
  }
  #start-screen h2 { font-size: 22px; color: var(--primary); margin-bottom: 8px; }
  #start-screen p { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
  .start-options { display: flex; flex-direction: column; gap: 14px; }
  .start-btn {
    padding: 18px 24px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #f7fbff;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    transition: all .2s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .start-btn:hover { border-color: var(--primary-light); background: #eaf3fb; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }
  .start-btn .icon { font-size: 26px; }
  .start-btn small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }

  /* ── QUESTION CARD ── */
  .q-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; }
  .q-text {
    font-size: 15px;
    line-height: 1.75;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--text);
  }
  .q-box {
    background: #f8fbfd;
    border-left: 3px solid var(--primary-light);
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.8;
    color: #1c2e3e;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    background: var(--card);
    transition: all .15s;
    font-size: 14px;
    line-height: 1.6;
  }
  .option:hover { border-color: var(--primary-light); background: #eaf3fb; }
  /* 사용자가 선택한 답: 파란 배경으로 문제번호와 명확히 구분 */
  .option.selected { border-color: var(--primary); background: #d6eaf8; color: var(--primary); font-weight: 600; }
  .option.correct { border-color: var(--correct); background: #eafaf1; color: var(--correct); }
  .option.wrong { border-color: var(--wrong); background: #fdedec; color: var(--wrong); }
  .option.show-correct { border-color: var(--correct); background: #eafaf1; color: var(--correct); }
  .option .num { font-weight: 700; min-width: 20px; }

  /* explanation */
  .explanation {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    background: #fdfaf0;
    border-left: 3px solid var(--accent2);
    border-radius: 4px;
    font-size: 13.5px;
    line-height: 1.75;
    color: #5d4037;
  }
  .explanation.show { display: block; }
  #exp-text, .explanation > div:last-child { white-space: pre-line; }
  .exp-label { font-weight: 700; color: var(--accent2); margin-bottom: 4px; }

  /* bottom nav */
  .q-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .nav-btn {
    padding: 9px 22px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    transition: all .15s;
  }
  .nav-btn:hover { background: #eaf3fb; border-color: var(--primary-light); }
  .nav-btn:disabled { opacity: .35; cursor: not-allowed; }
  .nav-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .nav-btn.primary:hover { background: var(--primary-light); }

  .bm-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    transition: all .15s;
  }
  .bm-btn.bookmarked { color: var(--bookmark); border-color: var(--bookmark); background: #fef5e7; }
  .bm-btn:hover { border-color: var(--bookmark); color: var(--bookmark); }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 220px;
    background: var(--sidebar);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 16px 12px;
  }
  #sidebar h4 { color: var(--sidebar-text); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.7; }
  #q-grid { display: flex; flex-direction: column; gap: 4px; }
  .q-dot {
    width: 100%;
    border-radius: 5px;
    background: rgba(255,255,255,0.1);
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all .15s;
    border: 1.5px solid transparent;
  }
  .q-dot:hover { background: rgba(255,255,255,0.2); }
  .q-dot.current { border-color: #7fb3d3; color: #fff; background: rgba(255,255,255,0.15); }
  .q-dot.answered { background: rgba(255,255,255,0.15); color: #aed6f1; }
  .q-dot.bookmarked-dot { background: rgba(230,126,34,0.35); border-color: var(--bookmark); color: #f0a500; }
  .q-dot.correct-dot { background: rgba(30,132,73,0.4); color: #82e0aa; }
  .q-dot.wrong-dot { background: rgba(192,57,43,0.45); color: #f1948a; }

  .q-dot .dot-num {
    min-width: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    font-size: 11px;
  }
  /* 선택된 답 표시: 흰 배경 뱃지 - 문제번호와 배경 명확히 구분 */
  .q-dot .dot-ans {
    font-size: 12px;
    margin-left: 4px;
    background: rgba(255,255,255,0.88);
    color: var(--sidebar);
    border-radius: 3px;
    padding: 1px 5px;
    font-weight: 700;
  }

  .sidebar-score {
    margin-top: 18px;
    padding: 12px;
    background: rgba(255,255,255,0.07);
    border-radius: 8px;
    color: var(--sidebar-text);
    font-size: 12px;
    line-height: 1.8;
  }
  .sidebar-score strong { font-size: 20px; color: #fff; }

  .score-actions { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .score-actions button {
    padding: 8px 10px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
  }
  .btn-grade { background: var(--accent); color: #fff; }
  .btn-retry { background: var(--bookmark); color: #fff; }
  .btn-home { background: rgba(255,255,255,0.15); color: #fff; }

  /* result screen */
  #result-screen {
    max-width: 580px;
    margin: 40px auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    padding: 40px 36px;
    text-align: center;
  }
  #result-screen h2 { font-size: 24px; color: var(--primary); margin-bottom: 6px; }
  .score-big { font-size: 64px; font-weight: 700; color: var(--primary); line-height: 1; margin: 20px 0 8px; }
  .score-sub { font-size: 15px; color: var(--muted); margin-bottom: 24px; }
  .result-grid { display: flex; gap: 16px; justify-content: center; margin-bottom: 28px; }
  .result-stat { flex: 1; padding: 16px; border-radius: 10px; }
  .result-stat.c { background: #eafaf1; color: var(--correct); }
  .result-stat.w { background: #fdedec; color: var(--wrong); }
  .result-stat.b { background: #fef5e7; color: var(--bookmark); }
  .result-stat .label { font-size: 12px; margin-bottom: 4px; }
  .result-stat .val { font-size: 28px; font-weight: 700; }
  .result-actions { display: flex; flex-direction: column; gap: 10px; }
  .result-actions button {
    padding: 14px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    transition: opacity .15s;
  }
  .result-actions button:hover { opacity: .85; }
  .btn-a { background: var(--accent); color: #fff; }
  .btn-b { background: var(--bookmark); color: #fff; }
  .btn-c { background: var(--primary); color: #fff; }
  .btn-d { background: #ecf0f1; color: var(--text); }

  .hidden { display: none !important; }

  /* ── EXPAND ALL VIEW ── */
  #expand-all-screen { display: none; padding: 24px 28px; }
  #expand-all-screen.active { display: block; }
  .all-q-card {
    background: var(--card);
    border-radius: 10px;
    border: 1.5px solid var(--border);
    padding: 20px 22px;
    margin-bottom: 18px;
  }
  .all-q-card .q-num { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  .all-q-card .q-text { font-size: 14px; font-weight: 600; margin-bottom: 14px; line-height: 1.7; }
  .all-q-card .options { gap: 7px; }
  .all-q-card .option { padding: 9px 13px; font-size: 13px; }

  #timer-box { display: none; }

  .timer-danger { color: #ff6b6b !important; animation: blink .8s step-end infinite; }
  @keyframes blink { 50% { opacity: .4; } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #b0c4d8; border-radius: 3px; }

  /* 답을 고른 문제는 바로 채점되므로 더 이상 바꿀 수 없음 */
  .option.locked { cursor: default; }
  .option.locked:hover { border-color: inherit; }
  .option.correct.locked:hover, .option.show-correct.locked:hover { border-color: var(--correct); background: #eafaf1; }
  .option.wrong.locked:hover { border-color: var(--wrong); background: #fdedec; }
  .option.locked:not(.correct):not(.wrong):hover { border-color: var(--border); background: var(--card); }
  .feedback { font-weight: 700; margin-bottom: 4px; }
  .feedback.ok { color: var(--correct); }
  .feedback.ng { color: var(--wrong); }

  /* 사이드바 상단 버튼 묶음 (폰 모드에서만 표시) */
  #side-actions { display: none; }
  #btn-phone { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); display: inline-block; }

  /* ── PHONE MODE ── */
  body.phone { height: 100dvh; }
  body.phone #header { height: 40px; padding: 0 10px; }
  body.phone #header .title { font-size: 14px; }
  body.phone #header .title span { display: none; }
  body.phone.quiz-on #header { display: none; }
  body.phone #main { padding: 10px 12px; }
  body.phone #start-screen { margin: 12px auto; padding: 22px 16px; }
  body.phone #start-screen h2 { font-size: 18px; }
  body.phone #start-screen p { margin-bottom: 16px; }
  body.phone .start-options { gap: 8px; }
  body.phone .start-btn { padding: 11px 14px; font-size: 14px; }
  body.phone .start-btn .icon { font-size: 20px; }

  body.phone .q-num { font-size: 11px; margin-bottom: 4px; }
  body.phone .q-text { font-size: 14.5px; line-height: 1.55; margin-bottom: 10px; }
  body.phone .q-box { padding: 8px 10px; margin-bottom: 10px; font-size: 13px; line-height: 1.6; }
  body.phone .options { gap: 5px; }
  body.phone .option { padding: 8px 10px; gap: 8px; font-size: 13.5px; line-height: 1.45; border-radius: 6px; }
  body.phone .explanation { margin-top: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.55; }
  body.phone .q-nav { margin-top: 12px; padding-top: 10px; }
  body.phone .nav-btn { padding: 8px 14px; }
  body.phone .bm-btn { padding: 7px 11px; }
  body.phone #expand-all-screen { padding: 0; }
  body.phone .all-q-card { padding: 10px 12px; margin-bottom: 10px; }
  body.phone .all-q-card .q-text { margin-bottom: 8px; }
  body.phone .all-q-card .options { gap: 5px; }
  body.phone .all-q-card .option { padding: 7px 10px; }
  body.phone #result-screen { margin: 12px auto; padding: 20px 16px; }
  body.phone .score-big { font-size: 44px; margin: 10px 0 6px; }
  body.phone .result-grid { gap: 8px; margin-bottom: 14px; }
  body.phone .result-stat { padding: 10px 6px; }
  body.phone .result-actions button { padding: 10px; }

  body.phone #side-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  body.phone #side-actions button {
    flex: 1 1 auto; padding: 7px 6px; border-radius: 6px; border: none; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  #sa-grade { background: #e74c3c; color: #fff; }
  #sa-retry { background: #e67e22; color: #fff; }
  #sa-home, #sa-expand, #sa-phone { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3) !important; }
  #sa-timer { flex-basis: 100%; text-align: center; color: #fff; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

  /* 폰 가로모드: 오른쪽 좁은 사이드바 */
  @media (orientation: landscape) {
    body.phone #sidebar { width: 150px; padding: 8px 8px; }
    body.phone .q-dot { padding: 5px 8px; }
  }
  /* 폰 세로모드: 위쪽 가로 막대 (버튼 + 문제번호 가로 스크롤) */
  @media (orientation: portrait) {
    body.phone #body { flex-direction: column-reverse; }
    body.phone #sidebar { width: 100%; min-width: 0; padding: 6px 8px 4px; overflow: hidden; }
    body.phone #main { min-width: 0; width: 100%; }
    body.phone #sidebar h4 { display: none; }
    body.phone #side-actions { margin-bottom: 6px; }
    body.phone #side-actions { flex-wrap: nowrap; }
    body.phone #side-actions button { flex: 1 1 0; min-width: 0; padding: 6px 2px; font-size: 11.5px; }
    body.phone #sa-expand, body.phone #sa-phone { flex: 0 0 34px !important; }
    body.phone #sa-timer { flex: 0 0 auto; font-size: 13px; align-self: center; }
    body.phone #q-grid { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    body.phone .q-dot { width: auto; flex: 0 0 auto; padding: 5px 7px; }
    body.phone .sidebar-score { display: none; }
  }
</style>
</head>
<body>

<div id="header">
  <div class="title">인간행동과 사회환경 <span>연습문제·기출</span></div>
  <div class="right-info">
    <span class="tag" id="mode-tag">모드 선택 중</span>
    <span id="progress-text" style="font-size:13px;opacity:.85"></span>
    <div id="timer-box" style="display:none;align-items:center;gap:8px;background:rgba(255,255,255,0.12);border-radius:6px;padding:4px 12px;">
      <span style="font-size:11px;opacity:.8;line-height:1.3;">남은<br>시간</span>
      <span id="timer-display" style="font-size:20px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;">20:00</span>
    </div>
    <button id="btn-header-grade" class="header-action-btn" onclick="gradeQuiz()">📊 채점하기</button>
    <button id="btn-header-retry" class="header-action-btn" onclick="retryQuiz()">🔄 다시하기</button>
    <button id="btn-header-home"  class="header-action-btn" onclick="showStart()">🏠 처음으로</button>
    <button id="btn-phone" class="header-action-btn" onclick="togglePhoneMode()">📱 폰 모드</button>
    <button id="expand-btn" onclick="toggleExpandView()" title="전체보기/한문제씩" style="display:none;background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.3);border-radius:6px;color:#fff;width:38px;height:38px;font-size:20px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;">⇅</button>
  </div>
</div>


<div id="body">
  <div id="main">
    <!-- Start Screen -->
    <div id="start-screen">
      <h2>📚 인간행동과 사회환경</h2>
      <p>강의 연습문제 44문항 + 장별 기출문제 537문항 · 총 581문항</p>
      <div class="start-options">
        <button class="start-btn" onclick="startQuiz('random')">
          <span class="icon">🎲</span>
          <div>
            랜덤 30문제
            <small>전체 581문항 중 무작위로 30문항 출제 · ⏱ 20분 제한</small>
          </div>
        </button>
        <button class="start-btn" onclick="startQuiz('lecture')">
          <span class="icon">📝</span>
          <div>
            강의 연습문제 풀기
            <small>1강~15강 강의 內 연습문제 44문항 · 시간 제한 없음</small>
          </div>
        </button>
        <button class="start-btn" onclick="startQuiz('exam')">
          <span class="icon">🗂️</span>
          <div>
            기출문제 전체 풀기
            <small>1장~15장 장별 기출문제 537문항 · 시간 제한 없음</small>
          </div>
        </button>
        <div class="start-btn" style="cursor:default;flex-wrap:wrap;">
          <span class="icon">📖</span>
          <div style="flex:1;min-width:200px;">
            장별 기출문제 풀기
            <small>장을 고른 뒤 시작</small>

  {"set": "lec", "lec": 3, "tag": "3강 연습문제", "q": "융의 분석심리학에 대한 설명으로 가장 적절한 것은?", "opts": ["페르소나는 개인이 억압한 충동과 감정으로 이루어진 무의식의 어두운 측면이다.", "그림자는 사회적 요구에 맞추어 외부에 드러내는 개인의 모습이다.", "집단무의식은 인류가 공통으로 공유하는 보편적이고 유전된 무의식의 층이다.", "원형은 개인이 살아오면서 경험한 사건들이 기억의 형태로 저장된 것이다."], "ans": 2, "exp": "융은 무의식을 개인무의식과 집단무의식으로 구분하였다. 집단무의식은 모든 인류가 공통으로 공유하는 보편적이고 유전된 무의식이며, 그 내용은 원형을 통해 상징이나 이미지로 나타난다. 페르소나는 사회적 요구에 맞추어 외부에 보이는 모습이고, 그림자는 개인이 인정하지 않거나 억압한 내면의 측면을 의미한다."},
  {"set": "lec", "lec": 3, "tag": "3강 연습문제", "q": "아들러의 개인심리학에 대한 설명으로 가장 적절한 것은?", "opts": ["인간행동은 과거의 성적 충동에 의해서만 결정된다.", "사회적 관심은 타인과 공동체에 기여하려는 성향을 의미한다.", "열등감은 반드시 제거해야 하는 병리적 감정이다.", "생활양식은 성인이 된 이후에 형성되며 쉽게 변화한다."], "ans": 1, "exp": "아들러가 말한 사회적 관심은 개인이 공동체의 목표와 타인의 행복에 관심을 가지고 사회에 기여하려는 성향을 의미한다. 열등감은 성장과 우월성 추구의 동기가 될 수 있으며, 생활양식의 기본적 구조는 주로 생애 초기의 경험을 통해 형성된다."},

  {"set": "lec", "lec": 4, "tag": "4강 연습문제", "q": "고전적 조건형성에서 일반화에 해당하는 사례로 가장 적절한 것은?", "opts": ["큰 개에게 물린 아동이 이후 크기나 색이 다른 개를 보아도 두려워한다.", "개에게 물린 아동이 개에게는 두려움을 느끼지만 고양이에게는 두려움을 느끼지 않는다.", "종소리를 들려주어도 먹이를 계속 주지 않자 침을 흘리는 반응이 점차 감소한다.", "불안을 느끼는 상황을 약한 수준부터 단계적으로 경험하며 불안을 줄여 간다."], "ans": 0, "exp": "일반화는 조건형성에 사용된 자극과 유사한 다른 자극에도 동일하거나 유사한 조건반응이 나타나는 현상이다. ②는 변별, ③은 소거, ④는 체계적 둔감화에 해당한다."},
  {"set": "lec", "lec": 4, "tag": "4강 연습문제", "q": "다음 사례에 해당하는 강화계획은?", "opts": ["고정간격 강화계획", "변동간격 강화계획", "고정비율 강화계획", "변동비율 강화계획"], "ans": 3, "exp": "변동비율 강화계획은 일정하지 않은 반응 횟수 뒤에 강화가 제공되는 방식이다. 복권이나 도박처럼 몇 번의 시도 후에 보상이 주어질지 예측하기 어려운 경우가 이에 해당한다.", "box": ["한 사람이 복권을 여러 차례 구매하지만 몇 번째 구매에서 당첨될지는 알 수 없다."]},
  {"set": "lec", "lec": 4, "tag": "4강 연습문제", "q": "반두라의 관찰학습 과정에서 관찰한 모델의 행동을 기억할 수 있도록 언어나 심상으로 저장하는 단계는?", "opts": ["주의 과정", "파지 과정", "운동적 재현 과정", "동기 과정"], "ans": 1, "exp": "파지 과정은 관찰한 행동을 기억 속에 유지하는 단계로, 언어나 심상 등을 활용하여 모델의 행동을 부호화하고 저장하는 과정이다. 이후 운동적 재현 과정을 통해 기억한 행동을 실제로 수행한다."},
  // 강의 연습문제 5강
  {"set": "lec", "lec": 5, "tag": "5강 연습문제", "q": "다음 사례에서 나타난 인지과정으로 가장 적절한 것은?", "opts": ["처음에는 조절이, 이후에는 동화가 일어났다.", "처음에는 동화가, 이후에는 조절이 일어났다.", "처음과 이후 모두 동화가 일어났다.", "처음과 이후 모두 조절이 일어났다."], "ans": 1, "exp": "새로운 대상을 기존의 ‘개’ 도식에 맞추어 이해한 것은 동화이고, 개와 고양이의 차이를 알게 되어 기존 도식을 수정하거나 새로운 도식을 형성한 것은 조절이다.", "box": ["개만 보아 온 아동이 처음 고양이를 보고 “개”라고 불렀지만, 개와 고양이의 차이를 알게 된 뒤 고양이에 대한 새로운 도식을 형성하였다."]},
  {"set": "lec", "lec": 5, "tag": "5강 연습문제", "q": "피아제의 구체적 조작기에 나타나는 인지적 특징으로 가장 적절한 것은?", "opts": ["대상이 눈앞에서 사라져도 계속 존재한다는 것을 이해한다.", "가상적인 조건을 설정하고 여러 가능성을 체계적으로 검토한다.", "구체적인 사물이나 경험에 대해 보존개념과 가역성을 활용할 수 있다.", "사물을 하나의 두드러진 특징만을 중심으로 판단한다."], "ans": 2, "exp": "구체적 조작기에는 보존개념, 가역성, 분류와 서열화 능력이 발달한다. 다만 사고가 구체적인 사물이나 직접 경험 할 수 있는 상황에 제한된다는 특징이 있다. ①은 감각운동기, ②는 형식적 조작기, ④는 전조작기의 특징이다."},
  {"set": "lec", "lec": 5, "tag": "5강 연습문제", "q": "비고츠키의 이론에 따른 교수방법으로 가장 적절한 것은?", "opts": ["학습자가 혼자 해결할 수 있는 과제만 반복해서 제시한다.", "학습자의 현재 능력과 관계없이 동일한 도움을 계속 제공한다.", "성인이나 유능한 또래가 적절한 도움을 제공하고, 능력이 향상되면 지원을 점차 줄인다.", "발달이 완전히 끝난 뒤에 새로운 학습을 시작하도록 한다."], "ans": 2, "exp": "비계설정은 학습자가 혼자 해결하기 어려운 과제를 수행할 수 있도록 적절한 도움을 제공한 뒤, 능력이 향상됨에 따라 지원을 점차 줄이고 과제 수행의 책임을 학습자에게 넘기는 과정이다. 이는 학습자의 근접발달영역에서 이루어져야 한다."},
  // 강의 연습문제 6강
  {"set": "lec", "lec": 6, "tag": "6강 연습문제", "q": "매슬로의 욕구위계이론에 대한 설명으로 가장 적절한 것은?", "opts": ["모든 욕구는 결핍에서만 발생한다.", "자기실현 욕구는 외부의 보상이나 인정이 부족할 때 발생한다.", "결핍욕구는 충족될수록 더욱 강해지는 특성이 있다.", "성장욕구는 자신의 가능성을 발전시키고 보다 충실한 존재로 성장하려는 욕구이다."], "ans": 3, "exp": "생리적·안전·애정과 소속·자존의 욕구는 결핍을 충족하려는 결핍욕구에 해당하며, 충족되면 일시적으로 약해진다. 자기실현 욕구는 자신의 잠재력과 능력을 발전시키려는 성장욕구로, 외부의 결핍보다 인간 내부의 성장 가능성에서 비롯된다."},
  {"set": "lec", "lec": 6, "tag": "6강 연습문제", "q": "다음 사례를 로저스의 이론으로 설명할 때 가장 적절한 개념은?", "opts": ["무조건적 긍정적 존중", "가치의 조건", "경험에 대한 개방성", "유기체적 신뢰"], "ans": 1, "exp": "가치의 조건은 일정한 기준을 충족해야만 사랑과 인정을 받을 수 있다고 받아들이는 것이다. 이러한 조건이 강해지면 자신의 실제 감정과 욕구를 억압하고 타인의 기대에 맞추어 자기개념을 형성할 수 있다.", "box": ["한 학생은 속으로는 미술 활동을 좋아하지만, 부모가 “공부를 잘해야 가치 있는 사람이다” 라고 반복해서 말하자 자신의 흥미를 억누르고 성적에만 집착하게 되었다."]},
  {"set": "lec", "lec": 6, "tag": "6강 연습문제", "q": "로저스가 제시한 인간중심상담자의 핵심 태도에 해당하지 않는 것은?", "opts": ["상담자가 관계 속에서 진실하고 솔직하게 존재한다.", "내담자의 경험을 내담자의 관점에서 이해한다.", "내담자를 평가하거나 비난하지 않고 존중한다.", "상담자가 정답을 제시하고 내담자가 그대로 따르도록 지시한다."], "ans": 3, "exp": "인간중심상담은 상담자가 해결책을 직접 지시하기보다 내담자가 자신의 경험을 탐색하고 스스로 성장 하도록 돕는다. 상담자에게 요구되는 핵심 태도는 진실성 또는 일치성, 무조건적 긍정적 존중, 공감적 이해이다."},
  // 강의 연습문제 7강
  {"set": "lec", "lec": 7, "tag": "7강 연습문제", "q": "가족을 하나의 체계로 보는 관점에 대한 설명으로 가장 적절한 것은?", "opts": ["가족구성원의 행동은 다른 가족구성원과 독립적으로 이해해야 한다.", "한 가족구성원의 변화는 다른 구성원과 가족 전체에 영향을 미칠 수 있다.", "가족의 경계는 항상 명확하고 변화하지 않는다.", "가족은 외부 사회환경의 영향을 거의 받지 않는 폐쇄된 체계이다."], "ans": 1, "exp": "가족체계에서는 가족구성원이 서로 연결된 역할과 관계를 가지므로 한 구성원의 변화가 다른 구성원과 가족 전체에 영향을 미칠 수 있다고 본다. 또한 가족은 외부 환경과 상호작용하면서 경계를 조절하고 변화에 적응한다."},
  {"set": "lec", "lec": 7, "tag": "7강 연습문제", "q": "다음 중 가족 다양성에 대한 설명으로 가장 적절한 것은?", "opts": ["가족 다양성은 전통적인 가족형태가 점차 사라지는 현상을 의미한다.", "가족 다양성은 가족의 형태뿐 아니라 문화, 사회경제적 위치, 생애과정, 세대 등에 따라 가족의 모습과 경험이 달라지는 것을 포함한다.", "가족 다양성은 주로 한부모가족이나 재혼가족과 같이 가족구조가 다른 경우만을 의미한다.", "가족의 형태가 달라도 가족구성원의 역할과 관계는 대체로 동일하게 나타난다."], "ans": 1, "exp": "가족 다양성은 단순히 가족의 형태가 여러 가지라는 의미에 그치지 않는다. 강의에서는 가족을 조직적 다양성, 문화적 다양성, 계급적 다양성, 생애과정적 다양성, 코호트 다양성 등의 측면에서 살펴보며, 가족구성 방식과 역할, 경험이 다양한 조건에 따라 달라질 수 있음을 강조한다."},
  {"set": "lec", "lec": 7, "tag": "7강 연습문제", "q": "가족과 친밀한 관계의 변화에 대한 설명으로 가장 적절한 것은?", "opts": ["가족 다양성은 전통적인 가족이 사라진다는 의미이다.", "현대의 친밀한 관계에서는 개인의 선택, 평등, 상호존중과 의사소통의 중요성이 커지고 있다.", "재혼가족은 이전 가족관계가 모두 사라진 뒤 새로운 관계가 형성된다.", "친밀한 관계에서의 폭력은 일반적인 가족갈등과 본질적으로 동일하다."], "ans": 1, "exp": "현대의 친밀한 관계에서는 경제적 생존이나 전통적 의무뿐 아니라 사랑과 관계 만족, 개인의 선택과 평등, 상호존중과 의사소통이 중요해지고 있다. 한편 재혼가족은 이전 관계가 완전히 사라지는 것이 아니라 여러 관계가 이어질 수 있으며, 폭력은 상대를 지배하고 안전과 권리를 침해한다는 점에서 일반적인 갈등과 구분된다."},
  // 강의 연습문제 8강
  {"set": "lec", "lec": 8, "tag": "8강 연습문제", "q": "다음 중 사회적 범주(social category)에 해당하는 사례로 가장 적절한 것은?", "opts": ["오랜 기간 친밀한 관계를 유지해 온 친구 모임", "공동과제를 수행하기 위해 활동하는 프로젝트팀", "공연을 보기 위해 같은 장소에 일시적으로 모인 관객", "서로 직접 만나지 않더라도 ‘청소년’이라는 공통된 사회적 특성으로 묶이는 사람들"], "ans": 3, "exp": "사회적 범주는 성별, 연령, 민족, 직업 등과 같은 공통된 사회적 특성을 기준으로 묶이는 사람들의 집합으로, 구성원 간 직접적인 상호작용이 반드시 필요한 것은 아니다. 반면 관객처럼 같은 시간과 장소에 일시적으로 모인 사람들은 집합체에 해당한다."},
  {"set": "lec", "lec": 8, "tag": "8강 연습문제", "q": "다음 상황은 터크만(Tuckman)의 집단발달단계 중 어느 단계에 가장 가깝습니까?", "opts": ["형성기", "갈등기", "규범형성기", "수행기"], "ans": 1, "exp": "갈등기에는 구성원들이 자신의 의견과 욕구를 적극적으로 표현하면서 목표, 역할, 지위, 리더십과 과업수행 방식 등을 둘러싼 의견충돌이 나타난다. 이후 규범형성기에는 서로의 차이를 받아들이고 역할과 규범, 의사소통 방식이 점차 안정된다.", "box": ["새로 구성된 팀의 구성원들이 자신의 의견을 적극적으로 주장하고, 역할과 리더의 결정방식을 둘러싸고 의견 충돌이 자주 나타나고 있다."]},
  {"set": "lec", "lec": 8, "tag": "8강 연습문제", "q": "다음 설명에 해당하는 집단현상으로 가장 적절한 것은?", "opts": ["사회적 태만", "방관자 효과", "동조", "복종"], "ans": 2, "exp": "동조는 실제 또는 예상되는 집단의 압력 때문에 자신의 판단이나 행동을 집단의 기준에 맞추어 변화시키는 현상이다. 반면 복종은 권위를 가진 사람의 직접적 명령이나 요구에 따라 행동하는 것을 의미한다.", "box": ["회의에서 한 구성원은 자신의 판단으로는 제안된 방안에 문제가 있다고 생각했지만, 다른 구성원 대부분이 찬성하자 자신의 의견을 말하지 않고 다수의 의견에 따랐다."]},
  // 강의 연습문제 9강
  {"set": "lec", "lec": 9, "tag": "9강 연습문제", "q": "다음 중 관료제 조직의 특징으로 가장 적절한 것은?", "opts": ["전문성과 분권화를 중시하며 필요에 따라 유연하게 협력한다.", "명확한 위계와 규칙, 전문화된 직무를 통해 조직을 안정적으로 운영한다.", "구성원 간 비공식적 관계를 중심으로 업무를 수행한다.", "역할과 책임을 가능한 한 정하지 않고 상황에 따라 자유롭게 결정한다."], "ans": 1, "exp": "관료제는 전문화된 직무, 명확한 위계, 규칙과 비인격적 기준을 통해 조직을 안정적으로 운영하는 구조이다. 반면 애드호크라시는 새로운 문제에 대응하기 위해 전문성과 분권화, 유연한 협력을 강조한다."},
  {"set": "lec", "lec": 9, "tag": "9강 연습문제", "q": "다음 사례에 해당하는 개념으로 가장 적절한 것은?", "opts": ["역할갈등", "조직사회화", "심리적 계약", "조직풍토"], "ans": 2, "exp": "심리적 계약은 공식적인 고용계약과 달리 구성원과 조직이 서로 무엇을 제공하고 받을 것인지에 대해 개인이 형성한 주관적인 믿음과 기대를 말한다.", "box": ["한 직원은 근로계약서에는 적혀 있지 않지만, 조직이 자신의 노력에 대해 공정하게 인정하고 성장할 기회를 제공해 줄 것이라고 기대하고 있다."]},
  {"set": "lec", "lec": 9, "tag": "9강 연습문제", "q": "다음 중 심리적 안전감이 높은 조직에서 나타날 가능성이 가장 높은 행동은?", "opts": ["문제가 있어도 불이익이 두려워 침묵한다.", "상사의 판단에는 문제가 있어도 이의를 제기하지 않는다.", "실수를 숨기고 자신의 책임이 아니라고 주장한다.", "궁금한 점을 질문하고 실수나 문제점을 자유롭게 이야기한다."], "ans": 3, "exp": "심리적 안전감은 질문하거나 도움을 요청하고, 실수나 반대의견을 표현하더라도 처벌이나 모욕을 받지 않을 것이라는 공유된 믿음을 의미한다. 이러한 환경에서는 구성원의 발언과 학습행동이 촉진될 수 있다."},

  {"set": "lec", "lec": 10, "tag": "10강 연습문제", "q": "다음 중 지역사회에 대한 설명으로 가장 적절한 것은?", "opts": ["지역사회는 일정한 지역에 거주하는 주민들의 단순한 집합을 의미한다.", "지역사회는 주민 간 친밀한 관계가 형성되어 있어야만 성립한다.", "지역사회는 일정한 생활권에서 주민, 조직, 제도, 자원과 관계가 상호작용하는 사회체계이다.", "지역사회는 행정적으로 구분된 지역과 동일하며 행정구역 밖의 생활관계는 포함하지 않는다."], "ans": 2, "exp": "지역사회는 단순히 같은 지역에 사는 사람들의 집합이 아니라, 일정한 생활권을 중심으로 주민, 조직, 제도, 자원 과 관계 등이 상호작용하는 사회체계이다. 또한 행정구역과 실제 주민의 생활권이 반드시 일치하는 것은 아니다."},
  {"set": "lec", "lec": 10, "tag": "10강 연습문제", "q": "다음 사례를 가장 잘 설명하는 개념은 무엇입니까?", "opts": ["장소애착", "자원접근성", "지역정체성", "집합효능감"], "ans": 1, "exp": "지역자원이 존재하는 것과 주민이 실제로 그 자원을 이용할 수 있는 것은 다르다. 거리, 교통, 비용, 운영시간, 정보, 장애, 서비스의 질 등의 조건에 따라 자원의 실제 이용 가능성이 달라지며, 이를 지역자원의 접근성과 관련하여 설명할 수 있다.", "box": ["지역에청소년수련관이설치되어있지만, 버스노선이부족하고운영시간도 청소년의 생활시간과 맞지 않아 실제 이용하는 청소년이 많지 않다."]},
  {"set": "lec", "lec": 10, "tag": "10강 연습문제", "q": "다음 중 주민참여에 대한 설명으로 가장 적절한 것은?", "opts": ["주민참여는 지역문제를 전문가에게 맡기고 주민은 결과를 따르는 과정이다.", "주민참여는 주민이 지역의 문제를 발견하고 해결방안을 결정하며 실행과정에 관여하는 과정이다.", "주민참여는 주민의 의견을 조사하는 활동만을 의미한다.", "참여기회가 열려 있다면 주민의 실제 참여 여부와 관계없이 충분한 주민참여가 이루어진 것이다."], "ans": 1, "exp": "주민참여는 주민이 지역의 문제를 발견하고 해결방안을 결정하며 실행과정에 관여하는 것을 의미한다. 강의에서는 참여기회가 형식적으로 존재하는 것뿐 아니라 시간, 소득, 돌봄부담, 건강, 장애, 언어, 디지털 접근성 등에 따라 실제 참여 가능성이 달라질 수 있다는 점도 강조한다."},

  {"set": "lec", "lec": 11, "tag": "11강 연습문제", "q": "다음 사례에 해당하는 부모의 양육방식은?", "opts": ["권위적 양육", "권위주의적 양육", "허용적 양육", "방임적 양육"], "ans": 0, "exp": "권위적 부모는 요구와 반응성이 모두 높으며, 명확한 규칙을 제시하면서도 이유를 설명하고 자녀와 의사소통한다.", "box": ["부모는자녀에게귀가시간을정해주고그이유를설명한다. 자녀가사정을이야기하면함께 의논하지만, 최종적으로 정한 규칙은 지키도록 한다."]},
  {"set": "lec", "lec": 11, "tag": "11강 연습문제", "q": "다음 중 아동의 보호요인에 해당하는 것은?", "opts": ["반복적인 학업실패", "또래로부터의 지속적 거부", "따뜻하고 일관된 부모의 양육", "지역사회의 놀이공간 부족"], "ans": 2, "exp": "따뜻하고 일관된 양육은 위험의 부정적 영향을 완화하고 긍정적인 적응을 돕는 대표적인 가족 수준의 보호요인이다."},

  {"set": "lec", "lec": 12, "tag": "12강 연습문제", "q": "다음 중 Marcia의 정체성 지위에서 탐색과 전념이 모두 높은 상태는?", "opts": ["정체성 혼미", "정체성 유실", "정체성 유예", "정체성 성취"], "ans": 3, "exp": "정체성 성취는 여러 대안을 충분히 탐색한 후 자신의 가치와 진로 등에 대해 전념한 상태를 의미한다."},
  {"set": "lec", "lec": 12, "tag": "12강 연습문제", "q": "한 청소년이 혼자 있을 때보다 친구들이 지켜보는 상황에서 위험한 자전거 묘기를 더 자주 시도하였다. 이를 가장 잘 설명하는 것은?", "opts": ["또래가 존재하면 청소년의 모든 행동이 억제된다.", "또래는 청소년의 보상민감성과 위험선택을 증가시킬 수 있다.", "청소년의 위험행동은 오직 성격에 의해 결정된다.", "또래의 영향은 중기 아동기에만 나타난다."], "ans": 1, "exp": "청소년은 또래가 함께 있는 상황에서 보상에 대한 민감성이 높아져 일부 위험행동이 증가할 수 있지만, 또래의 영향이 항상 부정적인 것은 아니다."},
  // 강의 연습문제 13강

  {"set": "lec", "lec": 13, "tag": "13강 연습문제", "q": "“안정적인 직장이 중요하지만, 내가 의미 있다고 느끼는 일도 중요하다. 지금의 생활과 장기적인 목표를 함께 고려해 결정해야겠다.” 위 사례에 가장 잘 나타난 성인 사고의 특징은?", "opts": ["자기중심적 사고", "변증법적 사고", "물활론적 사고", "보존개념의 결여"], "ans": 1, "exp": "변증법적 사고는 서로 모순되는 두 관점 중 하나만을 선택하기보다 상황과 맥락을 고려하여 두 관점을 조정·통합하려는 사고이다."},
  // 강의 연습문제 14강
  {"set": "lec", "lec": 14, "tag": "14강 연습문제", "q": "성인 중기의 인지발달에 대한 설명으로 가장 적절한 것은?", "opts": ["모든 인지능력이 동일한 시기부터 동일한 속도로 감소한다.", "유동성 지능은 유지되지만 결정성 지능은 급격하게 감소한다.", "처리속도는 저하될 수 있지만 경험과 지식에 기초한 능력은 유지되거나 발달할 수 있다.", "전문성은 인지적 노화와 관계없이 자동으로 형성된다."], "ans": 2, "exp": "성인 중기에는 처리속도 등 일부 유동성 능력이 감소할 수 있지만, 경험과 교육을 통해 축적된 결정성 지능과 특정 영역의 전문성은 유지되거나 발달할 수 있다."},
  {"set": "lec", "lec": 14, "tag": "14강 연습문제", "q": "에릭슨이 성인 중기의 주요 심리사회적 발달과제로 제시한 것은?", "opts": ["신뢰감 대 불신감", "정체성 대 역할혼란", "친밀감 대 고립", "생산성 대 침체"], "ans": 3, "exp": "에릭슨은 성인 중기의 주요 과제를 생산성 대 침체로 보았으며, 생산성은 다음 세대와 사회에 관심을 가지고 기여하려는 태도와 행동을 의미한다."},
  {"set": "lec", "lec": 14, "tag": "14강 연습문제", "q": "[52세 B씨는 직장에서 관리자로 일하면서 대학생 자녀의 학비를 지원하고 있다. 동시에 건강이 나빠진 부모의 병원 진료와 생활도 돌보고 있다.] 위 사례를 설명하는 개념으로 가장 적절한 것은?", "opts": ["성인 진입기", "샌드위치 세대", "빈 둥지", "정체성 유예"], "ans": 1, "exp": "성장한 자녀를 지원하는 동시에 노부모를 돌보는 중년층을 흔히 ‘샌드위치 세대’라고 하며, 경제적·정서적·시간적 부담이 중첩될 수 있다."},

  {"set": "lec", "lec": 15, "tag": "15강 연습문제", "q": "다음 중 성인 후기의 노화에 대한 설명으로 가장 적절한 것은?", "opts": ["연령이 같으면 신체적·인지적 기능의 수준도 대체로 비슷하다.", "노화는 주로 유전적 특성에 의해 결정되므로 환경의 영향은 크지 않다.", "건강한 노화는 질병이 전혀 없는 상태를 의미한다.", "성인 후기의 기능은 개인의 내재적 능력과 환경의 상호작용에 의해 달라질 수 있다."], "ans": 3, "exp": "성인 후기에는 개인차가 크게 나타나며, 같은 연령이라도 건강, 교육, 직업 경험, 소득, 가족관계, 주거 및 지역환경 등에 따라 기능 수준이 달라질 수 있다. WHO의 건강한 노화 관점에서도 중요한 것은 단순히 질병이 없는 상태가 아니라, 개인의 내재적 능력(intrinsic capacity)과 환경의 상호작용을 통해 자신에게 가치 있는 활동을 수행할 수 있는 기능능력(functional ability)을 유지하는 것이다."},
  {"set": "lec", "lec": 15, "tag": "15강 연습문제", "q": "[걷기가 이전보다 어려워진 김 씨는 장거리 등산을 줄이고 가까운 공원 걷기에 집중하였다. 꾸준히 근력운동을 하면서, 먼 거리를 이동할 때에는 지팡이를 사용하고 있다.] 위 사례에서 나타난 성인 후기의 적응 전략으로 가장 적절한 것은?", "opts": ["선택·최적화·보상", "사회정서적 선택성", "자아통합", "활동이론"], "ans": 0, "exp": "선택·최적화·보상(SOC) 모형에서 선택(selection)은 중요한 목표나 활동에 집중하는 것이고, 최적화 (optimization)는 선택한 활동을 잘 수행하도록 시간과 노력을 투입하는 것이며, 보상(compensation)은 감소한 능력을 다른 방법이나 도구를 통해 보완하는 것이다. 사례에서 등산 대신 공원 걷기를 선택하고, 근력운동을 지속하며, 지팡이를 사용하는 것은 세 가지 적응 전략이 함께 나타난 경우이다."},
  {"set": "lec", "lec": 15, "tag": "15강 연습문제", "q": "다음 중 성인 후기의 사회적 관계와 사회적 위험에 대한 설명으로 옳지 않은 것은?", "opts": ["사회적 관계의 수가 줄어든다고 해서 반드시 사회적 고립을 의미하는 것은 아니다.", "성인 후기에는 정서적으로 의미 있는 가까운 관계를 선택적으로 유지할 수 있다.", "외로움은 객관적으로 만나는 사람의 수만으로 판단할 수 있다.", "빈곤, 연령차별, 사회적 고립, 돌봄 공백 등은 개인의 기능과 환경의 상호작용 속에서 이해할 필요가 있다."], "ans": 2, "exp": "사회적 고립(social isolation)은 사회적 관계와 접촉이 부족한 객관적 상태인 반면, 외로움(loneliness)은 자신이 원하는 관계와 실제 관계 사이의 차이에서 나타나는 주관적 경험이다. 따라서 만나는 사람의 수가 적더라도 만족스러운 관계를 유지하면 외로움을 느끼지 않을 수 있으며, 반대로 많은 사람과 접촉해도 외로움을 경험할 수 있다. 성인 후기에는 관계의 수 자체보다 관계의 질, 정서적 친밀감, 도움의 상호성 등을 함께 살펴볼 필요가 있다."},

  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년 1학년 기말 36번", "q": "다음 중 인간행동에 대한 설명으로 잘못된 것은 무엇인가?", "opts": ["인간행동은 한쪽에서 표출되면 그에 상응한 반응을 보이면서 쌍방향적으로 교환된다.", "인간행동의 교환과정에는 당사들이 달성하고자 하는 어떤 목적과 의도, 가치와 철학이 명시적으로 존재한다.", "인간행동의 쌍방향적인 교환의 결과는 당사자와 집단의 만족과 효율성에 영향을 미친다.", "인간행동은 습관적으로 이루어지며, 심층적이고 전략적으로 이루어지는 경우는 거의 없다."], "ans": 3, "exp": "인간행동은 인간들이 개인적인 삶과 집단생활을 하는 과정에서 표출되고 반응하는 말과 행동 일체를 가리킨다. ④인간행동은 아주 심층적이고 전략적으로 이루어지는 경우도 있고, 거의 습관적인 경우도 있다."},
  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년 1학년 기말 37번", "q": "다음 중 개인이 주어진 상황과 조건을 적응해 나가는 과정에서 비교적 일관성 있게 나타나는 특유의 행동과 사고양식의 총체를 무엇이라고 하는가?", "opts": ["성격", "학습", "규범", "시민성"], "ans": 0, "exp": "인간행동의 유사 개념_인간행동은 다양한 방식의 개념화되고 고찰되었음\n▪ 마음 : 생각하고 느끼고 판단하는 작용을 하는 내면적 활동\n▪ 동기 : 인간이나 동물이 특정한 목적을 향하여 특정 행동을 유도 하는 정신적 성향\n▪ 학습 : 경험의 결과로 인해 비교적 영속적인 행동 성향을 형성하 는 과정과 그 결과\n▪ 발달 : 신체와 신경 구조, 행동, 행동 특성이 일정한 방향으로 변 화, 유형화되는 과정 성장, 기능분화 + 노화, 쇠퇴까지 포함하는 개념\n▪ 성격 : 개인이 주어진 상황과 조건에 적응해 나가는 과정에서 비 교적 일관성 있게 나타나는 특유한 행동과 사고양식의 총 체\n▪ 규범 : 행동에 대한 사회적 기대와 행동의 규칙\n▪ 도덕성 : 윤리와 비슷한 개념, 규범 보다 일반적인 기대와 규칙\n▪ 시민성 : 특정 특권을 부여하지만, 이는 시민이 수용할 것으로 기대 되는 의무에 의해 균형을 잡힘 민주사회의 구성원들에 요구되는 능력과 태도"},
  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년 1학년 기말 38번", "q": "자신의 행동과 사고의 흐름을 객관화하여 고찰할 수 있고 조절할 수 있는 인간행동의 성향을 무엇이라고 하는가?", "opts": ["제도", "자기성찰", "관습", "전략적 선택"], "ans": 1, "exp": "인간의 특유한 행동\n▪ 제도 : 특정 집단 내에서 수용된 상호작용 방식\n▪ 자기성찰 : 자신의 행동과 사고를 대상화하여 객관적으로 반성, 검토, 조 절하는 지적 작용\n▪ 관습 : 사회적으로 반복하여 행하여 이루어진 일정한 행동 유형\n▪ 전략적 선택 : 목적을 효과적으로 달성하기 위한 방법을 선택\n▪ 자유의지 : 자신의 행동을 독자적, 주체적으로 결정, 선택하려는 인간만 의 특별한 힘과 능력\n▪ 비판적 사고 : 인간의 생각, 진술, 신념 등을 재분석, 재평가, 재구성하는 사고방식과 능력"},
  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년-3학년 기말 1번", "q": "일반적으로, 생각하고 느끼며 판단하는 작용을 하는 인간의 내면적 활동 일체를 가리키는 말은 무엇인가?", "opts": ["마음", "동기", "학습", "발달"], "ans": 0, "exp": "(원문에 해설 없음)"},

  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년-하계 2번", "q": "사람들이 일과 사물을 대할 때, 자신의 마음에 떠오르는 정서적인 반응을 인식하고 긍정적인 감정과 공감을 높이는 반응을 선택적으로 표출하는 능력을 무엇이라고 하는가?", "opts": ["감성능력", "판단능력", "인지능력", "기초직업능력"], "ans": 0, "exp": "인간행동은 인간의 인지능력과 감성능력에 따라 다양한 형태를 보이며, 내용과 질에서도 차이가 나타난다.\n▪ 감성능력 (emotional intelligence) : ·일과 사물을 대할 때, 자신의 정서적 반응 을 인식하고, 긍정적인 감정과 공감을 높이는 반응을 선택적으로 표출하는 능력\n▪ 인지능력 (Cognitive intelligence) : ·일과 사물을 논리적· 분석적으로 이해하고 해석하며, 합리성과 타당성을 판단하고 평가하 는 능력 ·평가기준과 방법의 타당성 재점검·성찰· 대안모색"},
  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년-하계 3번", "q": "인간의 신체와 신경의 구조, 행동, 그리고 이 행동의 특성이 일정한 방향으로 변화되고 유형화되는 과정을 무엇이라고 하는가?", "opts": ["동기", "경험", "발달", "도덕성"], "ans": 2, "exp": "(원문에 해설 없음)"},

  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년-하계 5번", "q": "어미와 새끼 간에 존재하는 긴밀한 유대를 무엇이라고 하는가?", "opts": ["일차적 유대", "동년배 유대", "배우자 유대", "고차원적 유대"], "ans": 0, "exp": "인간과 동물의 유사성_다른 개체와 사회적 유대 형성의 경향성\n▪ 일차적 유대 : 어미와 새끼 간의 유대. 새끼에 대한 헌신과 애착\n▪ 동년배 유대 : 비슷한 또래 간의 유대. 또래와의 놀이\n▪ 배우자 유대 : 이성과의 성적인 결합. 구애활동, 양성간 역할 분담"},
  {"set": "exam", "lec": 1, "tag": "1장 기출 · 19년-하계 6번", "q": "인간만의 특유한 행동이 아닌 것은 무엇인가?", "opts": ["인간은 상징과 의미를 창조하고 학습할 수 있다.", "역할을 나누어 생활을 영위한다.", "제도와 관습을 창조하고 질적인 개선을 할 수 있다.", "비판적 사고와 자기성찰을 할 수 있다."], "ans": 1, "exp": "인간만의 특유한 행동_1.상징과 의미의 창조와 학습, 2.지식과 기술의 창조와 다각적 활용, 3.제도와 관습의 창조와 질적인 개선, 4. 비판적 사고와 자기성찰, 5.자유의지와 전략적 선택"},

  {"set": "exam", "lec": 2, "tag": "2장 기출 · 19-1학년 기말 39번", "q": "다음 중 피아제(Piaget)가 제시한 인지적 발달단계를 순서대로 나열한 것은?", "opts": ["구체적 조작기 - 전조작기 - 감각운동기 - 형식적 조작기", "전조작기 - 감각운동기 - 구체적 조작기 - 형식적 조작기", "감각운동기 - 전조작기 - 구체적 조작기 - 형식적 조작기", "구체적 조작기 - 감각운동기 - 전조작기 - 형식적 조작기"], "ans": 2, "exp": "해설) Piaget의 인지발달이론\n▪ 감각운동기: 0-2세 (sensorimotor period) : 영아가 자신의 태생적 감각과 운동을 조절함 으로써 세상의 일과 사물에 대한 지식을 얻 는 단계\n▪ 전조작기: 2-7세 (pre-operational period) : 언어와 같은 상징적 매체를 사용하여 인지하 고 사고를 하지만 아직은 자기중심과 직관적 수준에 머물 뿐, 일과 사물의 전후 관계를 논리적ㆍ객관적으로 파악하지 못하는 시기\n▪ 구체적조작기: 7-12세 (concrete operational period) : 일과 사물을 분류하고 그 전후 관계를 전체 적인 차원에서 논리적ㆍ객관적으로 파악\n▪ 형식적조작기: 12-15세 (formal operational period) : 거기에 추상적ㆍ가설적인 개념을 포함시켜 사고하고 문제 해결책을 궁리하고 일반화된 지식체계를 구축할 수 있는 조합적 사고 (combinational thinking)와 연역적 사고 (deductive thinking)를 하는 시기\n⚫발달단계는 이전 단계를 거치지 않으면 다음 단계로 이전할 수 없으며, 다음 단계로 이전한 후에는 이전 단계로 후퇴하지는 않는다"},

  {"set": "exam", "lec": 2, "tag": "2장 기출 · 19-3학년 기말 3번", "q": "후퍼 등(Hooper et al., 2009)이 제시한 인간발달의 원리에 대한 설명으로 가장 잘못된 것은?", "opts": ["인간의 발달은 서서히 그리고 순차적으로 발달한다.", "개인에 따라 발달의 속도가 다르고 그 유형도 상당한 차이를 보인다.", "인간의 발달에는 결정적 시기가 있다", "인간의 발달은 유전에 의해 결정된다."], "ans": 3, "exp": "인간발달의 원리(Hooper et al., 2009)\n▪ 점진성과 연속성 : (↔ 분절성, 불연속성), 서서히 순차적 발달 각 개체가 완전하게 기능할 때까지 계속되며 체계 적인 방식으로 이루어짐.\n▪ 개인 간 차이성 : 유전(선천적) + 환경의 차이(경험, 교육)\n▪ 분화성과 통합성 : 기능의 세분화와 분화된 기능간의 연계\n▪ 발달의 방향성 : 인간의 제반 기능의 발달은 신경발달과 신체적 기 능이 긴밀하게 연계지어 발달한다. ·신체기능: 머리에서 발끝으로 ·신경계: 중심에서 말초\n▪ 결정적 시기성 : 각 영역마다 반드시 발달시켜야 할, 그리고 가장 잘 발달시킬 수 있는 시기가 있다.\n▪ 상호연관성 : 한 영역의 발달은 다른 영역 발달에 영향\n▪ 유전과 환경의 상호작용 : ·유전에 의해 기반 형성 ·환경적 요인에 의해 구체적 형태를 갖게 됨"},

  {"set": "exam", "lec": 2, "tag": "2장 기출 · 19년 하계 8번", "q": "뉴만 등(Newman et al, 1991)은 인간발달의 개념을 분석한 후, 네 가지 기본 전제들이 포함되어 있다고 하였다. 다음 중 그들이 제시한 기본 전제에 포함되지 않는 것은 무엇인가?", "opts": ["인간의 성장과 발달은 삶의 모든 기간에 일어난다.", "인간의 발달은 시간의 흐름에 따라 지속적으로 변화된다.", "인간의 발달은 신체나 언어, 인지적인 면뿐만 아니라 사회적이고 정서적인 측면까지도 포함한다.", "인간행동은 시간적으로 나타나는 개체적인 변화만으로 이해해야 한다."], "ans": 3, "exp": "인간발달의 네 가지 기본 전제(Newman et al., 1991) ⑴ 일생에 걸쳐 진행된다. ⑵ 특정 시기마다 일회적이 아니라 지속적으로 변화된다. ⑶ 신체, 언어, 인지, 사회성, 정서를 포함하고 있으므로, 인간발달은 통합적으로 살펴보아야 한다. ⑷ 시간적으로 나타나는 개체적인 변화만이 아니라 관련된 상황과 인간관계의 맥락까지 포함하여 이해해야 한다."},
  {"set": "exam", "lec": 2, "tag": "2장 기출 · 19년 하계 9번", "q": "피아제(Piaget)는 인간의 초기 인지능력 발달과정을 4단계로 구분하여 제시하였다. 그 중 추상적ž가설적 개념을 포함시켜 사고하고 문제 해결책을 궁리하며 일반화된 지식체계를 구축할 수 있는 조합적 사고와 연역적 사고를 하는 시기를 무엇이라고 하는가?", "opts": ["감각운동기", "전조작기", "구체적 조작기", "형식적 조작기"], "ans": 3, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 2, "tag": "2장 기출 · 19년 하계 10번", "q": "에릭슨(Erikson)은 인간발달을 심리사회학적인 측면에서 연구하였으며, 인생 전체의 과정을 층 8단계로 구분하였다. 다음 중 청소년기의 도전과 위기와 관련된 것은 무엇인가?", "opts": ["기본적 신뢰 대 불신(basic trust vs. mistrust)", "주도성 대 죄의식(initiative vs. guilt)", "정체성 대 역할혼란(identity vs. role confusion)", "자아완성 대 절망(integrity vs. despair)"], "ans": 2, "exp": "Erikson의 심리사회학적 발달 8단계론\n▪ 0~1세 : 기본적 신뢰 대 불신(basic trust vs. mistrust)\n▪ 2-3세 : 자율성 대 수치와 의심(autonomy vs. shame &\n▪ doubt)\n▪ 4-5세 : 주도성 대 죄의식(initiative vs. guilo)\n▪ 6~11세 : 근면성 대 열등감(industry vs. inferiority)\n▪ 12~18세 : 정체성 대 역할혼란(identity vs. role confusion)\n▪ 20-35/40세 : 친밀감 대 고립(intimacy vs.isolation)\n▪ 40~60세 : 생산성 대 침체(generativity vs. stagnation)\n▪ 60세 이후 : 자아완성 대 절망(integrity vs. despair)"},

  {"set": "exam", "lec": 2, "tag": "2장 기출 · 17년 하계 4번", "q": "아래 사례를 통해 알 수 있는 사회화의 특징으로 가장 적절한 것은?", "opts": ["사회화는 엄격한 훈련과 반복 연습을 통해 이루어진다.", "초기 사회화는 인간의 전생애에 영향을 미친다.", "동물의 행동 원리와 인간의 행동 원리는 본질상 동일하다.", "사회화는 개인의 자유의지를 억제하는 과정이다."], "ans": 1, "exp": "‘인간을 통한 사회화(socialization)’를 통해서만 인간으로 성장할 수 있음 ⚫새로운 사회적 구성원이 사회규범 및 가치 등에 대한 인지를 발달시키고 뚜렷한 자아개념을 획득하도록 돕는 사회적 과정 ⚫가족, 또래집단, 학교, 미디어 등 다양한 기관을 통해 이루어짐 ⚫인간만의 특유한 행동을 학습함 ·지식과 기술, 제도와 관습, 비판적 사고, 자기성찰, 자유의지, 전략적 선택 ⚫일생에 걸려 계속됨", "box": ["1800년 프랑스 생세랭 근처 숲에서 한 아이가 발견되었다.", "아이는 모습은 사람이었지만 행동은 동물과 같았다. 사람들", "은 아이를 데려다 교육을 시도했으나 끝내 또래와 같은 수", "준의 행동은 습득하지 못했다."]},

  {"set": "exam", "lec": 2, "tag": "2장 기출 · 16-1학년 기말 38번", "q": "인간발달에 대한 피아제의 설명과 프로이트의 설명의 공통점은 무엇인가?", "opts": ["인간의 전 생애에 걸친 발달에 주목하였다.", "인간은 질적으로 다른 단계를 거쳐서 발달한다고 보았다.", "인간의 사고능력을 중심으로 발달 시기를 구분하였다", "인간을 환경에 의해 결정되는 존재로 보았다."], "ans": 1, "exp": "피아제와 프로이트는 ‘인간발달은 질적으로 다른 단계를 거쳐서 발달한다’고 보았다."},
  {"set": "exam", "lec": 2, "tag": "2장 기출 · 16-3학년 기말 38번", "q": "사회·문화적 요인이 행동 형성에 영향을 미친 사례로 적절한 것은?", "opts": ["같은 집단에 속한 개인들은 규범과 가치 기준을 공유한다.", "열대지역 거주민과 온대지역 거주민의 식문화가 다르다.", "개인의 혈액형을 가지고 성격적 특징을 예상할 수 있다.", "같은 상황에 대해서도 사람들마다 해석이 다르다."], "ans": 0, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 2, "tag": "2장 기출 · 16-3학년 기말 39번", "q": "정의와 자율 원리에 입각한 도덕적 행동을 기르는 데 효과적인 학교 환경은?", "opts": ["학습자의 요구를 무조건적으로 수용한다.", "위협과 처벌을 통해 일탈행위를 규제한다.", "학습자에게 반성적 사고의 기회를 제공한다.", "관행과 권위자의 명령에 순응하도록 한다."], "ans": 2, "exp": "정의와 자율 원리의 도덕적 행동을 기르는 효과적인 학교 환경은 설득형이다. ⚫ 학교에서의 사회적 상호작용에 따른 학생의 도덕적 행동 형성 모형\n▪ 사회화 주체의 태도 : 형성될 수 있는 도덕적 행동\n▪ 행위의 통제, 지시, 조장 방식 : 요구·의사에의 대응 방식\n▪ 방 임 형 : ·방임 ·무관심 : ·무조건 수용 ·동정적 허용 : 자기만족 원리 의 도덕\n▪ 권 위 형 : ·일방적강요 ·물리적 강제나 보상 또는 그 위협과 예고 ·물질이나 특권의 박 탈 : ·일방적 억제 ·권위적 묵살 ·관례답습적 대응 ·인습과 권위자 우선 원칙 : 인습 및 권위 원리의 도덕\n▪ 설 득 형 : ·합리적 이유 설명 ·상황 이해와 자율적 판단 촉구 ·반성적 사고기회 제 공 : ·합리성·타당성 중 시 ·자율적 억제 종용 ·개체 간 합의 존중 ·공정성 우선 원칙 : 정의와 자율 원 리의 도덕"},

  {"set": "exam", "lec": 3, "tag": "3장 기출 · 19-1학년 기말 41번", "q": "다음 중 사고력이나 인지능력과 같은 인간의 역량 발달에 관련되는 행동을 연구하는 학문 분야는?", "opts": ["교육학", "경제학", "사회학", "사회복지학"], "ans": 0, "exp": "인간 행동을 예측하고 조절하려는 학문\n▪ 정 치 학 : ⚫권력에 관한 인간 행동 연구 ·사회 내 모순과 대립을 권력에 의해 통합하는 것\n▪ 경 제 학 : ⚫생산과 소비와 관련된 인간 행동 연구 ·자원의 희소성과 Marginal thinking(한계적 생각) ·행동경제학: 선택 가능한 대안들이 가진 상대적 비용과 이윤을 고려하여 자신의 행동을 결정함\n▪ 사 회 학 : ⚫인간의 사회적 행동을 예측·조절하는데 관심 ·사회적 지위·역할 또는 개인적 판단과 의지에 따라 타 인과 상호작용하면서 보이는 행동이 어떻게 형성·유지되 고, 어떤 자극과 조건에 의해 변화되는지 연구 ·오랜 역사를 거치면서 정형화된 사회제도와 사회구조의 특성 연구\n▪ 사 회 복 지 학 : ⚫삶의 질 향상을 위한 대응방식 연구 ·인간의 욕구와 이해관계는 본성적인가 사회적인가, 그것 책임은 사회에 있는가 개인에 있는가 등\n▪ 심 리 학 : ⚫성격, 적성, 지능과 같은 인간의 심리적 특성과 그 변화 매커니즘 연구 ·인간행동은 심리적 특성이 발현되는 행동을 말함.\n▪ 교 육 학 : ⚫사고력, 인지능력과 같은 인간의 역량 발달과 관련된 행 동 연구\n▪ 청 소 년학 : ⚫청소년기 인간의 제반 행동의 발달과 일상적 삶을 예측 하고 조절하는 방법에 관심 ·청소년의 심리적·사회적 특성과 그에 영향을 미치는 요소, 청소년의 권리와 장래 직업 생활을 위한 대책과 과 제 등"},
  {"set": "exam", "lec": 3, "tag": "3장 기출 · 19-1학년 기말 42번", "q": "인간의 행동이 어떻게 형성되는가에 관한 견해는 외부의 자극에 의해 달라진다는 결정론과 인간의 주관적 판단과 선택적인 대응에 의해 달라진다는 자율론으로 나눌 수 있다. 다음 중 자율론과 관련된 학자는?", "opts": ["돌라드와 밀러", "스키너", "왓슨", "반두라"], "ans": 3, "exp": "인간행동에 관한 이론_자율론반두라(Bandura), 로저스(Rogers), 미드(Mead)는 상황결과에 관한 판단에 의해 인간의 행동이 달라진다고 하였다.\n▪ 자율론: 인간은 수동적 존재가 아닌 자율적 존재임\n▪ ⚫인간의 행동은 주체의 판단과 선택에 의해 좌우 ⚫상황관찰력, 자기성찰력, 의미창조능력, 의지 등 강조 ·인간만 가지고 있는 주체적 반응기제: 주관성(subjectivity)\n▪ 관 련 연 구 : Rogers : 인간의 의지, 자각, 선택 능력, 삶의 주관성 강조\n▪ Bandura : 인간은 스스로 보고 관찰한 것을 모방하기도 하며, 외부자극에 대한 자신의 반응에 책임을 질 수도 있고 통제할 수도 있음\n▪ Mead : 인간은 의미를 창조하고 해석하며, 새로운 의미를 부 여하기도 하는 주체적 자아(I)를 지닌 존재"},
  {"set": "exam", "lec": 3, "tag": "3장 기출 · 19-3학년 기말 5번", "q": "인간행동에 관한 이론 중 '인간의 행동은 상황이나 조건에 관계 없이 아주 비슷하고 안정적으로 나타난다'는 견해를 무엇이라고 하는가?", "opts": ["유전론", "일반적 특성론", "결정론", "특수적 반응론"], "ans": 1, "exp": "인간행동에 관한 이론_일반적 특성론\n▪ ⚫일반적 특성론: 한번 습득된 인간행동은 상황이나 조건과 무관하 게 일관성을 가짐(•앎과 행동의 일관성)\n▪ 관 련 연 구 : Mackinon (1938) : ⚫평소 행동과 특정 행동의 상관성 ·남에게 피해를 끼친 뒤 느끼는 죄악감과 평소 도 덕적 행동\n▪ Hoffman (1977) : ·피해를 끼친 뒤 느끼는 죄악감과 도덕적 이유 설 명 방식\n▪ 인지발달론 : 인지구조의 변화 → 인식과 행동의 변화"},

  {"set": "exam", "lec": 3, "tag": "3장 기출 · 17-1학년 기말 43번", "q": "인간행동에 대한 관점 중, \"인간은 외부자극에 대하여 주관적으로 판단하고 선택적으로 대응한다.\"는 진술과 관련이 있는 것은?", "opts": ["반응론", "환경론", "결정론", "자율론"], "ans": 3, "exp": "인간행동에 대한 쟁점\n▪ 유 전 론 : 인간행동은 타고나는 것\n▪ Galton (1869) : [유전적 천재, 그 법칙과 결과] ·다윈의 진화론 기반 가문 연구: 신체, 소질, 정신 능력 유전됨\n▪ Goddard (1912) : 칼리카크가(家)-정신지체의 유전에 관한 연구 ·명문 출신 부인의 자녀 vs. 작부 출신 정부 의 자녀\n▪ Sheldon : 범죄 성향과 체형 간 상관관계 연구\n▪ Shields(1962) Wilson(1975) Nichols(1978) : 지능 차, 학업성취도 → 일란성 쌍둥이 < 이 란성 쌍둥이\n▪ 환 경 론 : 인간행동은 후천적으로 길러지는 것\n▪ Mead (1935) : ⚫남성성과 여성성은 문화적인 것 ·뉴기니의 세 부족(챔불리, 아라페시, 먼더거머)\n▪ Vygotsky (1978) : ⚫사회적 상호작용 및 경험의 내면화 ·지능이라는 개념 자체가 사회와 문화에 의해 만 들어진 개념\n▪ Honzik et al.(1948) : ⚫지능의 상관 연구 ·2세와 18세: 0.31, 12세와 18세: 0.76\n▪ Gray et al.(1963) : 집중교육을 통한 지능 점수 향상\n▪ Kagan (2011) : 인간행동 중 유전자에 의한 것은 10%\n▪ 결 정 론 : 인간행동은 강화요인(reinforcer)에 의해 결정 •강화요인: 반사적 반응을 일으키는 외적 자극 •관련 연구: 행동주의 심리학\n▪ Watson : 인간을 대상으로 하는 행동 변화 실험에 성공\n▪ Dollard & Miller : 강한 공포 학습 → 학습된 공포 발현\n▪ Skinner : •강화 조건의 조절을 통해 특정 유형의 인간행동 형 성 가능 ·타인의 선을 위한 행동을 유발시킬 수 있는 조건 을 강화하면 유토피아도 만들 수 있음\n▪ 자 율 론 : 인간은 수동적 존재가 아닌 자율적 존재임 ⚫인간의 행동은 주체의 판단과 선택에 의해 좌우 ⚫상황관찰력, 자기성찰력, 의미창조능력, 의지 등 강조 ·인간만 가지고 있는 주체적 반응기제: 주관성(subjectivity)\n▪ Rogers : 인간의 의지, 자각, 선택 능력, 삶의 주관성 강조\n▪ Bandura : 인간은 스스로 보고 관찰한 것을 모방하기도 하며, 외부자극에 대한 자신의 반응에 책임을 질 수도 있고 통제할 수도 있음\n▪ Mead : 인간은 의미를 창조하고 해석하며, 새로운 의미를 부 여하기도 하는 주체적 자아(I)를 지닌 존재\n▪ 일 반 적 특 성 론 : 한번 습득된 인간행동은 상황이나 조건과 무관하게 일관성을 가 짐(·앎과 행동의 일관성)\n▪ Mackinon (1938) : ⚫평소 행동과 특정 행동의 상관성 ·남에게 피해를 끼친 뒤 느끼는 죄악감과 평소 도덕적 행동\n▪ Hoffman (1977) : 피해를 끼친 뒤 느끼는 죄악감과 도덕적 이유 설 명 방식\n▪ 인지발달론 : 인지구조의 변화 → 인식과 행동의 변화\n▪ 특 수 적 반 응 론 : 인간 행동은 상황이나 조건에 의해 좌우됨\n▪ Hartshorne & May : ⚫아이들의 정직성은 항상 발현? ·아동의 정직성은 너무 간단히 무너짐 ·그것이 발현될 만한 충분 여건과 상황이 중요 함\n▪ Milgram : ⚫사람은 왜 불합리한 권위 앞에 복종하는가? ·평범한 성인도 권위에 굴복하여 비도덕적으로 행동함\n▪ Asch (1952) : •인간 행동은 동조 압력에 의해 쉽게 변화됨"},

  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-1학년 기말 44번", "q": "다음 중 프로이트(Freud)가 말한 자아(自我, ego)의 설명으로 잘못된 것은 무엇인가?", "opts": ["자아는 초자아로부터 발달한다.", "인간의 성격 가운데 겉으로 드러나고 현실 속에서 반응을 보인다.", "실제적이며 가치를 가지지 않고 오로지 현실을 고려하여 효과적인 것을 찾는다.", "현재뿐만 아니라 미래를 생각하며 장기적으로 추리하면서 반응을 보인다는 점에서 이차 과정에 따른다고 볼 수 있다."], "ans": 0, "exp": "자아는 원초아로부터 발달하며, 초자아는 자아로부터 발달한다.\n▪ 자아 ego : ⚫상대적으로 조직적이고 구체적인 정신구조 ·성격 중 겉으로 드러나는 부분 ⚫원초아와 현실 간의 갈등이 자아를 발달하게 함 ·자아는 원초아로부터 발달하는 것으로 가정 ⚫현실원칙(reality principle)에 따라 작용 ·현실을 고려하고 효과적인 것을 찾음으로써 본능적 추동을 지연시킴 ⚫기억, 지각, 인지, 미래 추론과 반응 ·이차 과정(secondary process) ⚫성격의 집행자, 경영자 ·성격의 조직적·합리적·현실지향적인 체계"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-1학년 기말 45번", "q": "다음 중 프로이트(Freuc)가 제시한 인간의 성격발달단계를 순서대로 나열한 것은 무엇인가?", "opts": ["구강기 - 항문기 - 남근기 - 생식기 - 잠복기", "구강기 - 항문기 - 남근기 - 잠복기 - 생식기", "구강기 - 항문기 - 잠복기 - 남근기 - 생식기", "구강기 - 항문기 - 잠복기 - 생식기 - 남근기"], "ans": 1, "exp": "(원문 문제에는 ①로 표시되어 있으나 정답표와 해설 내용에 따라 ②로 바로잡음)\n프로이트의 성격 발달단계\n▪ 구강기 : 출생-1세 : 입을 통한 성적 만족, 어머니에 대한 우호적 태도 와 파괴적 태도를 동시에 갖는 시기\n▪ 항문기 : 1~3세 : 배설과 보유 조절, 자신에 대한 어느 정도의 통제 가 이루어짐, 점차 자아가 발달\n▪ 남근기 : 3~6세 : 같은 성을 가진 부모를 싫어하는 경향이 나타남(오 이디푸스:남, 엘렉트라 콤플렉스:여), 원초아와 자 아, 초자아가 매우 역동적으로 작용하는 시기\n▪ 잠복기 : 6~12 ,13세 : 원초아는 약해지고 자아와 초자아가 강력해지는 시 기, 욕구충족의 대상이 동성으로 향함\n▪ 생식기 : 12~성인 기 이전 : 성적 만족의 대상이 이성이 된다는 것이 큰 특징이\n▪ 며 심한 생리적 변화, 격동적 단계"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-1학년 기말 46번", "q": "아들러(Adler)에 따르면, 생활양식이 어떻게 발달 되었느냐에 따라 인생의 장애물을 극복하고 문제를 해결하여 인생의 목표를 구성하는 방식이 달라진다. 아들러는 이러한 생활양식이 언제쯤 결정된다고 하였는가?", "opts": ["0~1세", "1~2세", "4~5세", "11~13세"], "ans": 2, "exp": "아들러는 4,5세경에 생활양식이 결정된다고 보았다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-1학년 기말 47번", "q": "융(Jung)은 인간의 원형과 본성이 있는 그대로 표현되지는 않는다고 보았다. 그중 겉으로 드러나고 외부세계로 표출되는 자아를 무엇이라고 하는가?", "opts": ["페르소나", "그림자", "원형", "아니마"], "ans": 0, "exp": "융의 주요개념\n▪ 정신 : 그 범위를 넓게 확장, 자율적이고 독자적인 실체\n▪ 리비도 : 생물학적, 성적, 사회적, 문화적, 창조적인 모든 형태의 활 동에 에너지를 제공하는 전반적인 생명력\n▪ 무의식 : 개인적 무의식과 집단적 무의식이 존재 ·집단 무의식: 융의 독창적인 개념으로 모든 인류가 공통 적으로 지니고 있는 것으로 보았다. 인류 조상 대대로의 경 험의 축적된 침전물.\n▪ 원형 : 대부분의 사람이 가지고 있는 조상 대대로부터 경험했던 심 상, 집단무의식의 구조적 요소\n▪ 콤플렉스 : 특수한 종류의 감정으로 이루어진 무의식 속 관념 덩어리\n▪ 아니마 아니무스 : 인간에게는 남성 호르몬과 여성 호르몬이 동시에 분비되어 양성적인 성질을 가진다. ·아니마: 남성에서 발견되는 여성적인 면 ·아니무스: 여성에게 발견되는 남성적인 면\n▪ 그림자 : 의식에 이면에 무시되고 도외시되는 마음의 측면\n▪ 페르소나 : 겉으로 드러나고 외부세계로 표출되는 자아, 가면이고 사회 적 요구에 대한 반응이며 인습적 역할\n▪ 자기 (self) : 의식과 무의식 모두의 중심, 몬능, 자아, 또 다른 원형을 통합하고 통제, 자아에게 무의식의 존재를 알리거나 수많은 원형을 성격에 통합하고자 시도함\n▪ 대극과 보상 : 본능과 무의식, 원형들 간의 관계와 그 반응방식 ·대극: 존재하는 모든 본능과 원형들이 서로 반대되고 대 립되는 속성 ·보상: 의식의 일방성이 통용되지 않고 다른 방식으로 대 치, 작용하는 것"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-3학년 기말 6번", "q": "프로이트(Freud)는 정신의 구성요소로 원초아(id), 자아 (ego), 초자아(superego)를 제시하였다. 그가 제시한 정신구조에 대한 설명으로 잘못된 것은?", "opts": ["원초아에는 성적 및 공격적 본능이 깃들어 있다.", "인간의 성격 가운데 겉으로 드러나고 현실 속에서 반응을 보이는 것이 자아이다.", "원초아로부터 자아가 발달하는 것과 마찬가지로 초자아는 자아로부터 발달한다.", "세 가지 구조는 각각 고정되어 있고, 어느 것이 강해지면 다른 것이 약해지는 관계에 있는 것은 아니다."], "ans": 3, "exp": "④세가지 구조는 일생에 걸쳐서 발달하며 각각 고정되어 있지 않고, 어느 것이 강해지면 다른 것이 약해지는 관계에 있다. 프로이트의 정신구조에서 결정적인 집행자는 자아이다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-3학년 기말 7번", "q": "프로이트(Freud)가 제시한 성격발달단계 중 잠복기(latent stage)에 대한 설명은?", "opts": ["자아와 초자아가 강력해지고 원초아는 상대적으로 약해지는 시기이다.", "억제되었던 성적ㆍ공격적 충동이 자아와 자아 방어를 압도할 정도로 강해진다.", "자기와 다른 성을 가진 부모의 사랑을 갈망하고 같은 성을 가진 부모를 싫어한다.", "입을 통하여 성적 만족을 느끼는 시기이다."], "ans": 0, "exp": "①은 잠복기, ②는 생식기, ③은 남근기, ④는 구강기에 대한 설명이다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-3학년 기말 8번", "q": "아들러(Adler)의 개인심리학 이론의 전제와 기본 가정으로 잘못된 것은 무엇인가?", "opts": ["인간은 통일되고 자아일치 된 성격구조를 가지고 있다.", "인간은 스스로 자기의 삶을 결정할 수 있다.", "인간은 다른 사람이 그를 어떻게 지각하느냐에 따라 행동하는 존재이다.", "인간은 사회적 관계를 맺을 수 있는 능력을 가지고 있다."], "ans": 2, "exp": "아들러는 개인이 자신을 어떻게 주관적으로 지각하느냐에 따라 행동이 결정된다고 하였다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-3학년 기말 9번", "q": "아들러(Adler)가 제시한 우월성 추구'에 대한 설명으로 가장 적합한 것은?", "opts": ["우월성 추구는 인간이 자신의 약점 또는 약한 상태를 지각하는 것이다.", "우월성 추구의 목표는 긍정적인 경향과 부정적인 경향이 모두 가능하다.", "우월성 추구는 이상적인 공동사회의 목표를 달성하고자 사회에 공헌하려는 본능이다.", "우월성 추구는 성격의 통일성, 개성, 문제해결에 맞서는 방법, 삶에 공헌하려는 소망이다."], "ans": 1, "exp": "아들러의 개인심리학_주요개념\n▪ 우 월 성 추 구 : ⚫우월을 향한 노력은 인간에게 공통된 기본적 동기임 ·열등감을 보상하려는 욕구에서 발생 ·자아완성 또는 자아실현을 추구하는 선천적인 동기 ⚫인간행동을 추동하는 주요 요인은 우월추구 동기 ⚫우월의 목표는 긍정적, 부정적인 경향을 취할 수 있음 ·긍정적 경향: 사회적 관심이나 다른 사람의 행복을 지향 (→ 이타적 목표) ·부정적 경향: 개인적인 우월성을 추구하는 자기존중, 권력, 개 인적인 허세(→ 이기적 목표)"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-3학년 기말 10번", "q": "융(Jung)의 이론 중 '여성에게 발견되는 남성적인 면'을 무엇이라고 하는가?", "opts": ["그림자", "콤플렉스", "아니무스", "페르소나"], "ans": 2, "exp": "아니마와 아니무스(ß 집단 무의식)\n▪ 생물학적, 심리적으로 양성을 가짐\n▪ 유전적인 성차와 사회화로 상대성에 대한 억압, 약화\n▪ 아니마(anima) : 아니무스(animus)\n▪ 무의식 속에 존재하는 남자의 여성적인 면 : 무의식 속에 존재하는 여자의 남성적인 면\n▪ 다른 성의 본성을 억압·경시하면, 창조성·전체성을 잃음"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19-3학년 기말 11번", "q": "융(Jung)이 제시한 '자아(ego)와 '자기(self)'에 대한 설명으로 가장 옳은 것은?", "opts": ["자기는 의식 세계의 중심이다.", "자신이 의식하지 못하턴 콤플렉스나 원형을 의식하게 되면자아와 자기가 점점 멀어진다.", "자아가 자기의 신호나 자극을 무시해도 자기에 대한 이해가 가능하다.", "자기는 자아에게 부단히 무의식의 존재를 알리기도 하고 수 많은 원형을 성격에 통합시키고자 시도한다."], "ans": 3, "exp": "융의 분석심리학_주요 개념\n▪ 자 기 (self) : ⚫중심성, 전체성, 의미를 무의식적으로 추구하는 원형 ·자기(self)는 전체 정신의 중심, ·자기는 무의식의 존재를 자아에게 알림으로써 자기와 의 식을 일치시키려 함\n▪ 자 아 (ego) : ⚫의식의 개성화(individuation) 과정에서 생기는 것 ·자아(ego)는 의식의 중심 ·개성화: 개인의식이 다른 사람으로부터 분리되는 과정 ⚫의식적인 지각, 기억, 사고, 감정으로 이루어짐 ·자아가 의식하지 못하던 콤플렉스나 원형을 의식하면, 의 식의 세계가 확장되어 자아와 자기가 보다 가까워 짐"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 19년 하계 15번", "q": "자신이 의식하지 못하는 무의식이라는 비합리적인 힘이 마음의 주인이라고 주장한 심리학자는 누구인가?", "opts": ["프로이트(Freud)", "왓슨(Watson)", "스키너(Skimner)", "매슬로(Maslow)"], "ans": 0, "exp": "자신이 의식하지 못하는 무의식이라는 비합리적인 힘이 마음의 주인이라고 주장한 심리학자는 프로이트이다."},

  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16-3학년 기말 45번", "q": "융의 이론에서 주요 개념에 대한 설명이 틀린 것은?", "opts": ["페르소나: 있는 그대로의 자아의 모습", "아니무스: 여성에게 나타나는 남성적 특성", "원형: 대를 이어져 내려온 보편적 심상", "그림자: 인간의 어둡고 사악한 측면"], "ans": 0, "exp": "페르소나는 겉으로 드러나고 외부세계로 표출되는 자아이다. 페르소나는 가면이고 사회적 요구에 대한 반응이며 인습적 역할이다. 페르소나는 진정한 자기가 아니며 남들에게 좋은 인상을 주거나 자신을 은폐하기 위해 만든 공적인 얼굴이다."},

  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 하계 3번", "q": "성격발달에 대한 프로이트의 설명으로 옳은 것은?", "opts": ["한번 형성된 성격은 변화하지 않는다.", "도덕성 발달을 위해 체벌이 효과적이다.", "리비도의 충족 부위에 따라 발달단계를 구분할 수 있다.", "초자아, 자아, 원초아의 순서로 발달한다."], "ans": 2, "exp": "프로이트는 발달단계를 성적 만족 부위에 따라 구강기, 항문기, 남근기, 잠복기, 생식기 등으로 구분하였다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 하계 4번", "q": "인간의 성격발달을 설명하는 프로이트 이론과 아들러 이론의 공통점은?", "opts": ["인간의 본성은 도덕적이라고 보았다", "발달 초기의 가족의 영향을 중시하였다.", "인간은 환경에 의해 만들어지는 존재라고 보았다.", "인지능력 수준에 따라 성격발달 과정을 구분하였다."], "ans": 1, "exp": "프로이트는 성격 형성에 있어서 어린 시절 경험, 특히 가족 내 상호 작용의 역할을 강조했다. 그는 성격발달 단계(구강, 항문, 남근 단계 등) 동안의 갈등과 경험이 나중에 인생의 성격 특성과 행동의 발달에 큰 영향을 미친다고 했다. 아들러도 초기 가족 역학의 영향을 강조했지만 사회적 경험과 관계에 더 광범위하게 초점을 맞췄다. 아들러는 어린이의 사회적 환경, 특히 가족 분위기와 부모 및 형제자매와의 관계가 어린이의 독특한 생활 방식(또는 성격) 발달에 큰 영향을 미친다고 믿었다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 하계 5번", "q": "인간행동발달에 대한 융의 설명은?", "opts": ["인간은 백지상태로 태어난다.", "성적 본능이 인간 행동의 원천적인 에너지이다.", "실험을 통해 인간 행동의 발달 법칙을 발견할 수 있다.", "성격의 원형들은 대극 관계를 구성한다."], "ans": 3, "exp": "칼 융(Carl Jung)은 개인의 정신과 행동에 영향을 미치는 보편적이고 상징적인 패턴과 이미지인 원형의 개념을 제안했다. 원형은 대부분의 사람이 가지고 있는 조상 대대로부터 경험했던 심상, 집단무의식의 구조적 요소를 나타내며 등장인물, 상징, 꿈과 신화의 주제 등 다양한 형태로 나타날 수 있다. 융은 정반대의 원리 또는 극성의 원리라고 부르는 정신 내의 반대 개념 남성적 측면과 여성적 측면, 의식적, 무의식적 요소는 보완적이며 심리적 균형과 성장에 필요하다. 이 아이디어는 개인심리학을 넘어 집단무의식의 더 넓은 원형적 주제와 역동성을 포함하도록 확장됩니다. ④는 성격 원형이 반대 관계와 어떻게 관련되는지에 대한 Jung의 관점을 반영하며, 인간 행동 발달이론의 근본적인 측면을 강조한다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 대체 16번", "q": "프로이트의 자유연상법에 대한 설명이 옳은 것은?", "opts": ["무조건반응을 조건화시키는 방법이다.", "학습한 행동을 실제로 재현되도록 하는 방법이다.", "인간의 무의식을 탐구하기 위한 방법이다.", "개인의 이상적 자아를 발달시키는 방법이다."], "ans": 2, "exp": ": 자유연상법은 검열이나 판단 없이 사람이 마음에 떠오르는 생각, 감정, 이미지를 자유롭게 표현하도록 하는 것으로 인간의 무의식을 탐색하는 방법이며 프로이트의 정신분석적 접근방식의 핵심이다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 대체 17번", "q": "프로이트 이론에서 성격 발달단계를 구분하는 기준은?", "opts": ["대뇌의 정보 처리 속도", "성욕을 충족시키는 신체 부위", "생물학적 연령", "동일시의 대상"], "ans": 1, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 대체 18번", "q": "프로이트의 성격 발달단계 중 오이디푸스 콤플렉스의 극복을 통해 초자아의 발달이 이루어지는 시기는?", "opts": ["남근기", "구강기", "항문기", "잠복기"], "ans": 0, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 대체 19번", "q": "프로이트 성격 발달단계 중 생식기의 특징은?", "opts": ["욕구의 만족을 지연시키는 법을 배우게 된다.", "성적 욕구 재활성화에 대한 반작용으로 금욕주의나 지성화 경향이 강해진다.", "이성의 부모를 연모하는 한편 동성의 부모에게 적대감과 경쟁심을 느낀다.", "이성에겐 거의 무관심하며 동성 또래와의 관계에 몰두한다."], "ans": 1, "exp": "①은 항문기, ③은 남근기, ④는 잠복기의 특징이다."},
  {"set": "exam", "lec": 4, "tag": "4장 기출 · 16년 대체 20번", "q": "인간행동 발달에 대한 아들러의 입장은?", "opts": ["인간은 환경 자극에 반응하는 수동적 존재이다.", "인간은 사회에 공헌하려는 본능을 가지고 태어난다.", "인간 행동의 근원적인 에너지는 성적 추동이다.", "인간의 성격은 요소들로 이루어진 고정된 구조물이다"], "ans": 1, "exp": "아들러는 사회적 관심(Gemeinschaftsgefühl) 즉 사회적 연결을 위해 노력하고 사회에 긍정적으로 기여하려는 인간의 타고난 경향과 잠재력을 강조했다. 개인은 무의식적인 힘이나 본능적 충동(프로이트가 제안한 것처럼)에 의해서만 움직이는 것이 아니라 오히려 소속감과 협력에 대한 욕구에 의해 움직인다고 하였다. Adler는 인간 행동을 이끄는 주요 동기는 사회적 유용성과 중요성을 추구하는 것이라고 제안, 이는 프로이트가 리비도를 인간 행동의 기본 에너지로 강조한 것과 대조된다. 아들러는 인간의 성격을 역동적이고 초기 사회적 경험, 특히 가족 내에서 형성되는 것으로 보고 행동과 성격 발달을 안내하는 데 있어 주관적 인식, 목표, 허구적 최종주의(상상된 목표를 향한 미래 지향적 노력)의 중요성을 강조했다."},
  // 기출 5장
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-1학년 기말 48번", "q": "다음 <보기>에서 대부분의 행동주의 학자들이 주장하거나 동의하는 진술을 모두 고른 것은?", "opts": ["가, 나", "가, 다", "나, 다", "가, 나, 다"], "ans": 3, "exp": "행동주의 이론의 주요 전제 ·인간행동은 환경적 조건에 의해 형성된다. ·관찰 가능한 객관적인 자극과 조건을 통해서만 정확하게 이해할 수 있다. ·인간행동의 연구는 법칙을 발견하는 것이 목적이다. ·인간과 동물의 행동 형성 및 반응 원리는 동일하다.", "box": ["<보기>", "가. 인간행동은 환경적 조건에 의해 형성된다는 믿음을 바", "탕으로 한다.", "나. 인간행동은 관찰 가능한 객관적 자극과 조건을 통해서", "만 정확하게 이해할 수 있다.", "다. 철저한 실험과 관찰을 통하여 인간행동의 형성 원리를", "발견할 수 있다."]},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-1학년 기말 49번", "q": "행동주의 기본개념 중 유사한 자극에 대하여 동일하게 반응하는 것을 무엇이라고 하는가?", "opts": ["일반화", "변별", "조건반사", "자연회복"], "ans": 0, "exp": "행동주의 이론의 기본개념_일반화와 변별\n▪ 일 반 화 (generali zation) : ·유사한 자극을 동일한 자극으로 지각하는 것 ·자라보고 놀란 가슴, 솥뚜껑 보고 놀란다. ·개에게 물린 아이가 고양이도 무서워하는 반응\n▪ 변 별 (discrimi nation) : ·자극을 구별하여 다르게 지각, 반응하는 것 ·TV 리모컨, 특정 높이의 종소리에만 침을 흘리는 반 응 ·동물은 인간에 비하여 변별 능력이 낮아 변별이 어려 울 때 급성 신경증을 보이기도 함"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-1학년 기말 50번", "q": "공포와 괴로움을 피하려 하다가 우연히 발견한 동작을 공포와 괴로움을 피하는 수단으로 습관화한다는 점을 발견한 학자는?", "opts": ["파블로프", "로저스", "돌라드와 밀러", "로터"], "ans": 2, "exp": "돌라드와 밀러의 추동심리학 배경과 방법론적 특징돌라드와 밀러는 정신분석학을 행동주의 심리학에 통합시키는데 기여. 매개변인이라는 새로운 개념 도입 행동주의에서 배제하였던 직접 관찰할 수 없는 내적인 상태를 설명 인간행동에 대한 이해 확장. 행동주의와 학습이론을 연계·통합시킴. 습관이란 자극과 반응의 안정된 연결이라 보고 무의식의 과정, 동기, 갈등, 방어와 같은 정신분석학 개념을 행동주의 개념에 통합시킴. 프로이트의 즐거움의 원칙을 원하는 행동을 추동하는 원칙으로 발전시켰고 특정한 행동을 학습하게 하는 요소로 번안함. 공포와 괴로움을 피하려 하다가 우연히 발견한 동작을 공포와 괴로움을 피하는 수단으로 습관화한다는 점 발견하므로 행동주의 이론을 사회적 학습이론으로 연결 짓는 토대를 만듬"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-1학년 기말 51번", "q": "스키너(Skinner)는 유기체의 반응률을 증가시키고 유지시키는 방법으로 강화계획을 제시하였다. 시간이나 강도를 다양하게 조절하면서 강화하는 것을 무엇이라고 하는가?", "opts": ["연속적 강화방식", "고전적 조건화", "간헐적 강화방식", "방출행동과 반응행동"], "ans": 2, "exp": "스키너의 조작적 조건형성 주요개념_강화계획(schedules of reinforcement)\n▪ ⚫유기체의 반응률을 증가/유지시키는 방법\n▪ ⚫연속적 강화: 유기체가 반응할 때 마다 강화를 제공하는 것\n▪ ⚫간헐적 강화: 강화 방식, 시간, 강도에 변화를 주는 것\n▪ ·고정간격 계획 : ·고정비율 계획\n▪ 일정한 시간 간격에 따른 강화 : 일정한 횟수의 반응을 보였을 때 강화\n▪ ·가변간격 계획 : ·가변비율 계획\n▪ 강화를 주는 시간 간격에 변화를 주는 것 : 강화를 제공하는 반응 횟수를 변 화시킴"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-3학년 기말 12번", "q": "행동주의의 주요 전제에 대한 설명으로 잘못된 것은?", "opts": ["인간행동은 환경적 조건에 의해 형성된다.", "인간행동은 관찰 가능한 객관적 자극과 조건을 통해서만 정확하게 이해할 수 있다.", "인간행동 연구의 목적은 법칙을 발견하는 것이다.", "인간과 동물의 행동 형성 및 반응 원리는 다르다."], "ans": 3, "exp": "④ 행동의 형성과 반응의 원리는 동물이나 인간 모두 똑같다."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-3학년 기말 13번", "q": "행동주의의 기본개념 중 조건화된 반응을 체계적 절차를 이용하여 없애는 것'을 무엇이라고 하는가?", "opts": ["탈조건화", "생물학적 준비상태", "일반화", "일차 신호체계"], "ans": 0, "exp": "파블로프와 왓슨의 행동주의 주요개념\n▪ 고전적 조건화 : 원래 반사를 일으키는 자극이 아닌 자극에 대해 같은 반사 가 일어나도록 훈련하는 것 ·반사: 어떤 자극에 대해 의지의 작용 없이 일어나는 반 응 ·조건반사: 특별한 조건에서만 나오는 반사\n▪ 일차와 이차 신호체계 : 조건 자극을 설명 ·일차 신호체계: 미래의 사건을 준비할 수 있게 해주는 신호 또는 경고 ·이차 신호체계: 일차적 신호체계 이외에 그 신호를 조절 하고 방향지어 주는 신호, 대부분의 인간 행동은 이차적 신호체계에 의해 조절\n▪ 일반화와 변별 : ·일반화: 유사한 자극에 대하여 동일하게 반응하는 것 ·변별: 한정된 범위의 자극에만 반응하는 경향성, 변별이 일어나기 위해서는 장기간의 훈련과 차별 강화라는 방법이 있다.\n▪ 소거 : 조건화된 자극에 반응하지 않게 되는 현상\n▪ 자연회복 : 반응이 소거된 후 며칠이 지나 다시 자극을 주었을 때 반 응이 일어나는 현상\n▪ 탈조건화 : 조건화된 반응을 체계적인 절차를 이용하여 없애는 것\n▪ 체계적 둔감화 : 가장 약한 조건화부터 차례로 탈조건화하여 단계적으로 탈 조건화가 달성되는 경우\n▪ 생물학적 준비상태 : 유기체가 이전의 경험이나 선천적인 조거에 따라 자극에 대한 반응을 보이도록 조건화되어 있는 것."},

  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-3학년 기말 15번", "q": "강화물을 조작하여 어떠한 행동반응을 형성하거나 변경하는 절차를 무엇이라고 하는가?", "opts": ["고전적 조건화", "조작적 조건화", "반응행동", "방출행동"], "ans": 1, "exp": "조작적 조건화(operational conditioning)란 강화물을 조작하여 어떤 반응행동을 형성하거나 변경시키는 것이다. ·조작: 실험대상이 바라는 결과를 얻기 위해 선택적으로 환경을 조절하는 것"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-3학년 기말 16번", "q": "다음 <보기>에서 성격의 발달과 적응에 대한 스키너 (Skinner)의 견해를 모두 고른 것은?", "opts": ["가, 나", "가, 다", "나 다", "가 나, 다"], "ans": 3, "exp": "스키너의 조작적 조건형성_성격의 발달과 적응 ·행동주의 이론은 인간의 행동은 보상과 처벌이 구조화되어 있는 환경에 의하여 형성되고 변화한다는 점 강조. ·스키너는 강화된 행동이 습관화되고 습관이 성격의 일부가 된다고 봄. ·성격에 구조가 존재한다고 보지 않음. ·성격은 행동 패턴들의 집합에 불과하며, 유기체의 행동과 그 행동이 강화된 결과 사이의 독특한 관계양식일 뿐임. ·성격의 발달은 행동변화의 과정임. ·성격의 발달은 유아기 때부터 어떤환경에서 어떠한 강화를 받았느냐에 의하여 결정된다고 주장, 다만 개인마다 타고난 자극 변별능력 때문에 동일한 행동이 형성되지 않을 뿐임. ·유기체의 행동은 강화를 통하여 학습된 것이며, 부적응행동 역시 강화의 결과이며 잘못된 조건화의 산물임. ·적응과 부적응행동은 강화 또는 우연적 강화가 결합된 결과로 이해. ·부적응행동을 포함한 어떤 행동이든 바꾸려면 조건화된 강화분석 필요. ·문제행동을 발견하거나 바꾸고 싶으면 심리치료 말고 행동수정을 하라고 충고. ·불안, 좌절, 수치심 등과 같은 이상행동을 고치려면 강화조건이 어디가 잘못되었는지를 진단하고 강화조건을 변화시키라는 것", "box": ["<보기>", "가. 환경 자극에 의해 강화된 행동이 습관화되고, 습관화된", "행동들이 모여 성격을 형성한다.", "나. 성격은 행동 패턴들의 집합일 뿐이며, 성격에는 구조가", "없다.", "다. 부적응행동을 바꾸려면 조건화된 강화를 분석할 필요가", "있다."]},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19-3학년 기말 17번", "q": "스키너(Skinner)의 간헐적 강화계획 중 정해진 시간 간격을 두고 강화하는 방식을 무엇이라고 하는가?", "opts": ["고정간격 계획", "고정비율 계획", "가변간격 계획", "가변비율 계획"], "ans": 0, "exp": "간헐적 강화는 강화 방식, 시간, 강도에 변화를 주는 것으로 정해진 시간 간격을 두고 강화하는 방식은 고정간격 계획이다."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 23번", "q": "다음 중 행동주의와 관련이 먼 것은?", "opts": ["인간행동은 환경적 조건에 의해 형성된다는 믿음을 바탕으로 한다.", "자기분석법을 통해서 연구될 수 있다.", "인간행동은 관찰 가능한 객관적 자극과 조건을 통해서만 정확히 이해할 수 있다.", "‘행동의 예측과 통제'라는 행동과학의 목표와 관련되어 있다."], "ans": 1, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 24번", "q": "다음 중 '고전적 조건화'와 관련이 있는 학자는?", "opts": ["파블로프(Pavlov)", "융(Jung)", "로저스(Rogers)", "매슬로(Maslow)"], "ans": 0, "exp": "파블로프와 고전적 조건화\n▪ 단계 : 자극 : 반응\n▪ 1(조건형성 전) : 먹이(무조건 자극) : 침 흘림(무조건 반응)\n▪ 2(조건형성 전) : 메트로놈(중립자극) : 반응 없음\n▪ 3(조건형성 중) : 먹이(무조건 자극) + 메트로놈(중립자극) : 침 흘림(무조건 반응)\n▪ 4(조건형성 후) : 메트로놈(조건자극) : 침 흘림(조건반응)"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 25번", "q": "다음 중 행동주의의 기본 개념인 '강화를 가장 잘 설명한 것은 무엇인가?", "opts": ["한 개인이 외부 정보를 해석하는 인지적 틀", "한 개인의 감정과 행동을 수용하고 지지해주는 것", "무의식적 욕구를 통제하기 위한 훈련 프로그램", "어떤 행동의 발생 가능성을 높이는 외적 자극"], "ans": 3, "exp": "스키너의 조작적 조건형성 행동주의의 기본개념_반응률\n▪ 반응률(respondent ratio): 반응률을 증가시키는 것(강화)\n▪ (긍)정적 강화 : 특정한 행동을 했을 때 제공하는 보상\n▪ 부(정)적 강화 : 특정한 행동을 했을 때 불쾌함을 제거해주는 보상"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 26번", "q": "행동주의 기본개념 중 한정된 범위의 자극에만 또는 훈련 때 사용되었던 자극에만 반응하는 경향성을 무엇이라고 하는가?", "opts": ["일반화", "변별", "조건반사", "자연회복"], "ans": 1, "exp": "변별: 한정된 범위의 자극에만 반응하는 경향성이며, 변별이 일어나기 위해서는 장기간의 훈련과 차별 강화라는 방법이 있다."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 27번", "q": "돌라드와 밀러(Dollard & Miler)의 이론에서 핵심은 추동, 단서, 반응, 보상의 4대 기본 요인이다. 이 중 유기체가 어떤 반응을 할지, 언제, 어디서 할지를 결정하는 내·외적 자극을 가리켜 무엇이라고 하는가?", "opts": ["추동", "단서", "반응", "보상"], "ans": 1, "exp": "돌라드와 밀러의 추동심리학_4대 기본 요인\n▪ 추동 : 유기체가 행동하도록 계속해서 자극하는 내적인 힘\n▪ 단서 : 유기체가 어떤 반응을 어떻게 할지를 결정하는 자극\n▪ 반응 : 유기체가 특정 자극에 따라 나타나는 행동 일체\n▪ 보상 : 어떤 반응의 발생 확률을 증가시키는 모든 것"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 28번", "q": "돌라드와 밀러(Dollard & Miler)는 갈등 상황에서 관찰되는 원칙을 제시하였는데, 그들이 제시한 원칙으로 잘못된 것은 무엇인가?", "opts": ["두 개의 반응이 경쟁하는 경우에는 언제나 더 강한 것이 이긴다.", "하나의 부정적인 목표를 피하려는 경향은 그 목표에 가까워질수록 강해진다.", "하나의 긍정적인 목표에 접근하려는 경향은 그 목표에 가까워질수록 약해진다.", "추동의 강도가 높아질 때에는 하나의 목표에 접근하거나 회피하려는 경향이 강해진다."], "ans": 2, "exp": "돌라드와 밀러의 추동심리학 성격의 발달과 적응_갈등상황에서 관찰되는 다섯 가지 원칙 ·하나의 긍정적인 목표에 접근하려는 경향은 그 목표에 가까워질수록 강해진다. ·하나의 부정적인 목표를 피하려는 경향은 그 목표에 가까워질수록 강해진다. ·긍정적인 목표에 가까워질 때 접근 경향이 강해지는 것보다는 부정적인 목표에 가까워질 때 회피하는 경향이 더욱 커진다. ·추동의 강도가 높아질 때는 하나의 목표에 접근하거나 회피하려는 경향이 강해진다. ·두 개의 반응이 경쟁하는 경우에는 언제나 더 강한 것이 이긴다."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 29번", "q": "다음 중 행동주의 학자인 스키너(Skinner)의 이론적 관심사와 관련이 가장 큰 것은?", "opts": ["고착된 욕구의 의식화", "행동의 법칙 발견", "인간 지능의 향상", "유전이 인간발달에 미치는 영향"], "ans": 1, "exp": "행동주의는 스키너에 의해 절정을 이룸. 모든 인간행동은 법칙적으로 결정되고, 예측이 가능하며, 통제될 수 있다고 보았다. 스키너가 행동을 이해하는 데 가장 강조한 것은 경험적인 접근방법이다. 철저한 인과관계적 법칙을 발견하는 것, 경험적인 접근방법을 강조, 인간 행동에서 환경이 지니는 중요성을 인식시키는데 기여함."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 하계 30번", "q": "스키너(Skinner)는 유기체의 반응률을 증가시키고 유지 시키는 방법으로 강화계획을 제시하였다. 시간과 강도를 다양하게 조정하면서 강화하는 것을 무엇이라고 하는가?", "opts": ["간헐적 강화방식", "연속적 강화방식", "이차적 강화물", "반응행동"], "ans": 0, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 대체 23번", "q": "다음 중 행동주의가 지향하는 학문의 목적으로 가장 관련이 깊은 것은 무엇인가?", "opts": ["자아와 유기체의 균형 잡힌 상호작용 촉진", "인간행동의 예측과 통제", "정신결정 현상과 무의식 파악", "자신에 대한 신뢰 향상"], "ans": 1, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 19년 대체 24번", "q": "행동주의의 기본개념 중 반응이 소거된 후 며칠이 지난 뒤 다시 종소리를 들려주면 다시 침 분비가 일어날 수 있는데 이를 무엇이라고 하는가?", "opts": ["소거", "자연회복", "변별", "생물학적 준비상태"], "ans": 1, "exp": "파블로프와 왓슨의 행동주의 기본개념_소거와 자연 회복\n▪ 소 거 (extinction) : ·조건화된 자극에 반응하지 않게 되는 현상 ·종소리가 나도 먹이를 계속 제공하지 않으면 침이\n▪ 분비되지 않게 됨\n▪ 자연 회복 (spontaneous recovery) : ·소거 후, 종소리를 들려주면 다시 침을 분비할 수 있음"},

  {"set": "exam", "lec": 5, "tag": "5장 기출 · 18-1학년 기말 50번", "q": "다음 중 인간 행동의 예측과 통제에 관심이 많았던 행동주의 학자는 누구인가?", "opts": ["프로이트(Freud)", "왓슨(Watson)", "융(Jung)", "매슬로(Maslow)"], "ans": 1, "exp": "인간행동의 예측과 통제에 관심이 많았던 행동주의 학자는 왓슨의 실험과 행동주의 파블로프와 왓슨, 돌라드와 밀러, 스키너 등이다. 왓슨의 실험과 행동주의 _‘소년 앨버트의 공포조건화 실험’ ⚫인간을 대상으로 한 실험연구 실시 ·아기 + 흰쥐 → 편안 ·(아기 + 흰쥐) + 굉음 → 공포 (※ 반복) ·아기 + 흰쥐 → 공포 ⚫인간 행동의 법칙성 신봉 ·반응을 통해 자극을 설명할 수 있고, 자극을 보고 반응을 예측할 수 있다. ⚫인간은 ‘백지상태(tabular rasa)’로 태어나 만들어짐 ·환경의 조절을 통해 원하는 행동을 형성 가능"},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 18-1학년 기말 51번", "q": "다음 중 행동주의 이론의 개념인 '강화'를 가장 잘 설명한 것은 무엇인가?", "opts": ["한 개인이 외부 정보를 해석하는 인지적 들이다.", "무의식적 욕구를 통제하기 위한 훈련 프로그램이다.", "어떤 행동의 발생 가능성을 높이는 외적 자극이다.", "한 개인의 감정과 행동을 수용하고 지지해주는 것이다."], "ans": 2, "exp": "(원문에 해설 없음)"},

  {"set": "exam", "lec": 5, "tag": "5장 기출 · 18-1학년 기말 54번", "q": "다음 중 고정간격 강화계획의 예는 무엇인가?", "opts": ["50분 수업 후 10분의 휴식시간을 갖는 것", "주사위를 던져 6이 나올 때 마다 사탕을 주는 것", "100점을 맞으면 용돈을 주는 것", "구매금액 10,000원 마다 100원씩 적립해 주는 것"], "ans": 0, "exp": "①:의 휴식 시간은 수업에 얼마나 많은 노력을 쏟았는지에 관계없이 고정된 시간 간격(50분마다)으로 제공된다. 이는 해당 시간 내에 실제로 수행된 작업량에 관계없이 근로자가 매 작업 시간에 대해 급여를 받는 방식과 유사하다. ② 주사위를 던질 때 6이 나올 때마다 사탕을 주는 것은 예측할 수 없는 수의 반응(주사위 굴림) 후에 강화(사탕)가 제공되는 가변비율 강화 일정의 예. ③ 100점 누적 후 용돈을 받는 것은 고정비율 강화 스케줄의 예이며, 특정 횟수의 응답(100점 달성) 후에 강화(용돈)가 제공된다. ④ 구매금액 1만원당 100원 적립은 가변간격 강화계획의 예시로, 예측할 수 없는 시간이 경과한 후(매회 1만원 적립) 강화(100원 적립)가 제공된다."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 18-3학년 기말 16번", "q": "다음 중 인간 행동의 예측과 통제에 관심이 많았던 행동주의 학자로서, '소년 앨버트의 공포 조건화 실험'을 수행한 사람은 누구인가?", "opts": ["프로이트(Freud)", "왓슨(Watson)", "매슬로(Maslow)", "융(Jung)"], "ans": 1, "exp": "(원문에 해설 없음)"},

  {"set": "exam", "lec": 5, "tag": "5장 기출 · 18년 하계 15번", "q": "다음 중 인간행동에 대한 행동주의 이론에 부합하는 진술은?", "opts": ["인간은 자아실현의 본능을 지니고 있다.", "인간행동은 유전적 조건에 의해 형성된다.", "인간과 동물의 행동 형성 원리는 서로 동일하다.", "인간행동의 기본 특징은 유아기에 완성된다."], "ans": 2, "exp": "①은 단순한 환경적 영향을 넘어 내재적 동기와 성장 가능성을 제시한다는 점에서 행동주의보다는 인문학적, 실존주의적 이론에 더 부합한다. ②는 행동주의가 강조하는 환경 결정론과 대조되는 생물학적 또는 유전적 결정론적 관점을 제시한다. ④는 미리 정해진 특성보다는 환경 상호작용을 통한 지속적인 학습과 적응에 중점을 두는 행동주의와 직접적으로 일치하지 않는다."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 18년 하계 16번", "q": "다음 중 \"파블로프의 실험에서 개가 메트로놈 소리만 들어도 침을 흘리는 상황\"을 지칭하는 개념은?", "opts": ["무조건반응", "조건반응", "매개상황", "반응서열"], "ans": 1, "exp": "메트로놈, 불빛, 벨 소리와 같이 무조건반응과 짝지어 제시되는 자극을 조건자극, 조건자극에 대해 침을 흘리는 것을 조건반응이라 한다."},
  {"set": "exam", "lec": 5, "tag": "5장 기출 · 18년 하계 17번", "q": "다음 중 가장 약한 조건화부터 순서대로 탈조건화 시키는 것\"을 가리키는 행동주의의 개념은?", "opts": ["소거", "변별", "일반화", "체계적 둔감화"], "ans": 3, "exp": "탈조건화와 체계적 둔감화(systematic desensitization)\n▪ 탈조 건화 : ⚫기존 조건자극 + 조건반응의 연합을 체계적 절차를 통해 해체하는 것 ·토끼를 무서워하는 아이: 토끼 + 과자 ·알코올 중독자: 술 + 약(메스껍고 구토)\n▪ 체계 적 둔감 화 : ⚫특정 부적응행동을 완화시키기 위해, 강도가 약한 자극부터 차례로 탈조건화시켜 나가는 방법 ·불안으로 인한 경직 근육의 이완 치료 ·고소공포증, 공황장애, 불리불안 치료"},

  {"set": "exam", "lec": 5, "tag": "5장 기출 · 16년 하계 9번", "q": "'종을 치면 침을 흘리도록 만드는 것'과 가장 가까운 행동주의 이론의 개념은?", "opts": ["변별", "체계적 둔감화", "고전적 조건화", "조작적 조건화"], "ans": 2, "exp": "고전적 조건화: Ivan Pavlov가 창시한 이 개념은 중립 자극(예: 종소리)과 무조건 자극(예: 음식)을 결합하여 자연스럽게 반사 반응(예: 침흘림)을 유발하는 것을 포함한다. 반복된 페어링을 통해 중성자극(종소리)은 원래의 무조건자극(음식)이 없더라도 조건반응(침흘림)을 이끌어내는 조건자극이 된다."},

  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-1학년 기말 52번", "q": "로터(Rotter)에 따르면, 다음 중 외적 통제 성향이 강한 사람이 중요하게 생각하는 것은 무엇인가?", "opts": ["노력", "성격", "능력", "운명"], "ans": 3, "exp": "강화의 통제소재(locus of control)\n▪ 강화물을 얻는 일들을 내가 통제할 수 있는 것으로 보는지, 통제 불가능한 것으로 보는지를 구분하는 개념\n▪ 내적 통제를 믿는 사람 : 노력, 성격, 능력 중시\n▪ 외적 통제를 믿는 사람 : 운명, 환경, 제도 중시"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-1학년 기말 53번", "q": "반두라(Bandura)가 제시한 관찰학습의 단계 중 '모방할 행동을 정확하게 기억하고 그 기억이 유지되는 것'과 관련된 것은 무엇인가?", "opts": ["주의과정", "파지과정", "재현과정", "동기과정"], "ans": 1, "exp": "관찰학습의 과정\n▪ 주의과정 : 학습자가 모델의 행동에 집중하고 지각하는 과정\n▪ 파지과정 : 모방할 행동을 정확하게 기억하고 그 기억이 유지되는 것\n▪ 재현과정 : 모방대상 행동이 구체적인 행동을 나타나게 되는 것\n▪ 동기과정 : 습득된 행동들이 실제상황에서 재현되도록 하는 심리적· 실제적 동기가 형성되는 것"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-1학년 기말 54번", "q": "반두라(Bandura)의 사회적 학습이론에서 '자기조절'의 의미는 무엇인가?", "opts": ["행동을 성공적으로 수행할 수 있다는 신념", "도덕적으로 옳은 일을 하고 있다는 믿음", "상대가 자신에게 호감을 지니고 있다는 판단", "외적 환경을 자신의 내적 표준에 의거하여 분석하고 판단하며, 적절한 대응방식을 모색하는 능력"], "ans": 3, "exp": "반두라의 사회적 학습이론 주요개념\n▪ 모방의 경향성 : ·모방은 학습모델의 특성에 따라 달라진다. ·모방은 학습자의 특성에 따라 달라진다. ·좀 더 많은 보상을 받는다면 모방 경향이 높게 나타난 다.\n▪ 삼원적 상호결정론 : 사람, 행동, 환경 사람은 내적인 특성을 활용하여 환경을 창조하고 변화시키면서 영향을 받고 반응한다.\n▪ 관찰학습과 학습모델 : 관찰만으로 학습이 이루어질 수 있으며, 그 중 학습 대상 으로 인지한 것만을 학습한다. 이때 그 학습의 대상이 학 습모델이며 인간은 학습 모델을 모방하면서 행동한다.\n▪ 자기조절 : 외적 환경을 스스로 분석하고 판단하는 내적인 표준, 인 간 스스로의 조절 작용\n▪ 자기효능 (신념) : 주어진 행동을 성공적으로 수행할 수 있다는 인간의 신념 성취경험, 대리경험, 언어적 설득, 정서적 각성, 네 가지 요인을 통하여 형성된다."},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-1학년 기말 55번", "q": "다음 중 반두라(Bandura)가 제시한 자기효능에 영향을 미치는 요인이 아닌 것은?", "opts": ["성취경험", "대리경험", "집단 무의식", "정서적 각성"], "ans": 2, "exp": "자기효능의 형성요인: ·성취 경험,·대리 경험,·언어적 격려, ·정서적 각성"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-3학년 기말 18번", "q": "다음 중 사회학습이론의 견해와 가장 거리가 먼 것은?", "opts": ["외적 자극은 유기체가 직접 경험하지 않아도 행동을 형성하고 변화시킬 수 있다.", "성적, 공격적 충동은 인간의 기본적 심리로 볼 수 있다.", "외적 자극뿐만 아니라 인간의 내적 특성도 인간행동의 형성과 변화에 영향을 미치는 주요 인자가 될 수 있다.", "상황에 따라서는 외적 자극도 인간행동의 후속적 결정인자가 될 수 있다."], "ans": 1, "exp": "②는 프로이트의 정신분석 이론의 견해이다. 프로이트 이론은 성적, 공격적 충동을 포함한 무의식적 충동을 인간 행동의 근본적인 동기로 강조한다. 사회 학습 이론은 무의식적인 추진력보다는 인지 과정, 관찰학습, 사회적 요인이 행동에 미치는 영향에 더 중점을 둔다."},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-3학년 기말 19번", "q": "로터(Rotter)에 따르면, 같은 시기, 같은 상황에서 선택해야 할 다양한 기대에 직면했을 때 사람들은 자신이 선호하는 기대를 선택한다고 하는데, 이를 무엇이라고 하는가?", "opts": ["대인신뢰", "상호작용", "강화가치", "통제소재"], "ans": 2, "exp": "로터의 사회적 학습이론 주요개념\n▪ 행동의 잠재 강도 : ·특정 상황에서 특별한 목표를 달성하기 위해 어떤 행동이 나타날 가능성 ·어떤 행동의 잠재가능성은 상황에 따라 달라짐\n▪ 기대 : 같은 목표라도 성취할 가능성이 크고 작은지에 대한 기대가 더 영향력을 발휘 즉, (목표의 우월성 < 목표의 달성 가능성)\n▪ 특수한 기대 : 개별 사안에 대한 기대\n▪ 일반화된 기대 : 다양한 상황에서 적용될 수 있는 평균으로서 의 기대\n▪ 강화 가치 : 같은 시기, 같은 상황에서 선택해야 할 다양한 기대에 직면했 을 때 사람들은 자신이 선호하는 기대를 선택, 강화물에 대한 선호도로 상대적인 것\n▪ 심리적 상황과 통제 소재 : 심 리 적 상황 : 개인의 자극에 대한 지각 및 반응에 영향을 미치는 심리적 맥락\n▪ 통제소재 : 내적(자기 자신), 외적(타인이나 운명) 통제 소재\n▪ 대인 신뢰 : 남의 말을 믿는 정도\n▪ 욕구잠 재강도 : ·특정 욕구를 충족시키는 일정한 행동들의 발생 잠재 강도 ·일정 행동들이 목표달성을 가능하게 할 것이라는 기대 X 목표를 구성하는 각 목표들의 욕구 가치(need value)"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-3학년 기말 20번", "q": "다음 중 반두라(Bandura)가 정립한 이론에 대한 설명으로 가장 적합하지 않은 것은?", "opts": ["인간의 행동은 사회적으로 학습된다.", "인간은 강화와 같은 특별한 학습환경에 접하였을 때만 학습한다.", "인간의 사고나 행위는 근본적으로 그 사회의 전통이나 문화로부터 기원한다.", "인간의 학습에서 사회적 기원과 행위 주체로서의 인간 자신의 역할을 중요하게 취급하였다."], "ans": 1, "exp": "반두라와 로터는 인간의 행동은 강화와 기대 둘 다에 의하여 학습된다고 믿음. ‘학습된다’는 말은 학습의 주체가 강화와 같은 특별한 학습환경에 접하였을 때, 선택적으로 학습하는 경우만을 의미하지 않으며, 특별한 환경에 처하지 않고도 학습되는 경우(간접 경험)까지 포함한다."},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-3학년 기말 21번", "q": "다음 중 반두라(Bandura)가 제시한 관찰학습의 단계가 순서대로 나열된 것은?", "opts": ["주의과정 - 파지과정 - 재현과정 - 동기과정", "주의과정 - 재현과정 - 파지과정 – 동기과정", "주의과정 – 동기과정 - 파지과정 - 재현과정", "주의과정 – 파지과정 - 동기과정 - 재현과정"], "ans": 0, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19-3학년 기말 22번", "q": "다음 중 반두라(Bandura)가 제시한 성격 형성기제로 가장 적합하지 않은 것은?", "opts": ["관찰학습", "대리강화", "자기조절", "출생순위"], "ans": 3, "exp": "반두라는 성격은 관찰학습, 대리강화, 자기조절, 자기효능 등의 기제에 의하여 형성된다고 하였다. 성격은 발달되는 것이 아니라 학습되는 것이며, 스스로 세운 표준이 변화되는 것이다. 반두라는 성격을 발달시키는 기제는 관찰을 통한 사회적 학습이라고 생각하였다."},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19년 하계 31번", "q": "행동주의는 사회과학 전반에 걸쳐 큰 영향을 미쳤지만, 주요한 의문과 결함도 동시에 지적받는다. 다음 중 행동주의에 대한 비판적 질문으로 타당하지 않은 것은?", "opts": ["관찰하기 어렵다고 하여 지식화를 포기하거나 외면할 필요가 없지 않을까?", "인간행동에 대한 이해를 동물에 대한 실험결과에 의존하는 것이 얼마나 정확할까?", "인간의 행동이란 아주 다양하고 복잡한 인간관계를 통하여 형성되고 변화된다는 점을 경시하지 않는가?", "인간의 행동은 인간이 의식할 수 없는 정신적인 에너지에 의해 결정된다는 것이 얼마나 타당할까?"], "ans": 3, "exp": "행동주의 이론은 1920~40년대 활성화된 사회과학의 접근방법으로 정신분석 이론에 반대하며 정신은 관찰 가능하지 않기에 존재한다고 보기 어렵다고 주장함"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19년 하계 32번", "q": "사회적 학습이론의 관점으로 옳지 않은 것은?", "opts": ["인간은 직접적인 자극에만 반응하는 존재이다.", "외적 자극뿐만 아니라 인간의 내적 특성도 인간행동의 형성과 변화에 영향을 미친다.", "상황에 따라서는 외적 자극도 인간행동의 후속적 결정인자가 될 수 있다.", "외적 자극은 유기체가 직접 경험하지 않아도 행동을 형성하고 변화시킬 수 있다."], "ans": 0, "exp": "사회적 학습이론에서는 대리경험이 학습의 결정요인이 되며, 유기체가 모델을 모방하거나 하지 않음으로써 학습이 이루어진다고 설명한다."},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19년 하계 33번", "q": "로터(Rotter)에 따르면, 다음 중 외적 통제 성향이 강한 사람이 중요하게 생각하는 것은 무엇인가?", "opts": ["성격", "능력", "노력", "운명"], "ans": 3, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19년 하계 34번", "q": "로터(Rotter)는 인간 행동 발생 가능성은 단순히 더 나은 목표 때문에 생겨나는 것만은 아니라고 보았다. 연봉이 높은 직장과 낮은 직장이 있을 때, 사람들은 단순히 연봉이 높은 직장을 택하는 것이 아니라 자신이 고용될 것이라는 기대에 따라 선택하는 것이 그 예이다. 이와 관련하여, 로터(Rotter) 가 제시한 개념과 관련된 것은 무엇인가?", "opts": ["행동의 잠재강도", "고전적 조건화", "기대-가치 모델", "대인신뢰"], "ans": 2, "exp": "로터의 사회적 학습이론 주요개념_기대가치 모델 (expectancy-value model)\n▪ 기 대 가 치 모 델 : ⚫어떤 행동이 발생하느냐 하지 않느냐는 그 행동을 통해 목표 를 달성할 수 있는 가능성(기대)에 의해 결정됨. ·연봉이 높은 직장에의 지원 여부는 연봉 수준 자체만이 아니 라 합격 가능성에 대한 기대에 의해 결정됨. ⚫특수한 기대: 개별사안에 대한 기대 ⚫일반화된 기대: 다양한 상황에서 적용될 수 있는 기대 ·과거의 경험에 의해 형성, 새로운 상황에서 행동예측의 근거"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 19년 하계 35번", "q": "다음 중 관찰학습이 이루어질 가능성이 비교적 높은 상황은 무엇인가?", "opts": ["학습자의 주의 집중력이 저하되어 있다.", "학습모델이 낯선 사람이다", "학습모델이 평소 학습자가 선망하던 사람이다.", "해당 행동을 할 경우 그에 대한 처벌이 예상된다."], "ans": 2, "exp": "①관찰을 통한 학습에는 모델의 행동에 대한 관심이 중요하기 때문에 학습자의 주의력과 집중도가 감소하면 관찰학습이 일어날 가능성이 낮다. ②학습모델이 관찰자에게 익숙하지 않은 경우에도 관찰학습이 발생할 수 있지만 친숙함과 감탄은 효과적인 관찰학습의 가능성을 높인다. ④행동에 대해 예상되는 처벌은 예상되는 부정적인 결과로 인해 행동 모방을 방해하기 때문에 관찰을 통한 학습을 ​방해할 수 있다."},

  {"set": "exam", "lec": 6, "tag": "6장 기출 · 16년 하계 11번", "q": "인간행동에 대한 사회적 학습이론의 설명은?", "opts": ["동일한 자극은 늘 같은 반응을 일으킨다.", "인간의 의식은 외적 자극을 매개하고 조절한다.", "동물의 행동과 인간의 행동은 본질적으로 같다.", "인간행동은 보편적인 발달단계를 거쳐 발달한다."], "ans": 1, "exp": "사회적 학습이론 ·외적자극뿐만 아니라 내적특성도 주요 인자 ·S(외적자극) → O(유기체적 반응기제) → R(인간행동의 형성과 변화) ·내적 특성이 외적 자극을 매개함. 동일 자극도 반응행동이 달라짐 ·외적 자극이 행동의 후행 결정 인자로 작용할 수 있음(S⇔O) ·행동 이후의 후속 자극(보상)을 평가하여 보상인지 처벌인지에 따라 선택적으로 학습 ·행동은 간접 경험을 통해서도 학습 가능 ·대리경험, 모방"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 16년 하계 12번", "q": "로터의 '기대-가치(expectancy-value) 모델'을 통해 알 수 있는 인간 행동의 특성은?", "opts": ["인간은 타인보다 우월해지려는 욕구를 지니고 있다.", "인간은 자아실현을 위해 행동하는 존재이다.", "미래 성취에 대한 기대가 행동 수행 여부에 영향을 미친다.", "인간은 물질적인 보상이 실제로 주어져야 행동한다."], "ans": 2, "exp": "기대가치 모델(expectancy-value model) ⚫어떤 행동이 발생하느냐 하지 않느냐는 그 행동을 통해 목표를 달성할 수 있는 가능성(기대)에 의해 결정됨 ·연봉이 높은 직장에의 지원 여부는 연봉 수준 자체만이 아니라 합격 가능성에 대한 기대에 의해 결정됨 ⚫특수한 기대: 개별 사안에 대한 기대 ⚫일반화된 기대: 다양한 상황에서 적용될 수 있는 기대 ·과거의 경험에 의해 형성, 새로운 상황에서 행동예측의 근거"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 16년 하계 13번", "q": "관찰학습 과정 중 모방대상을 기억하여 유지하는 단계는?", "opts": ["파지과정", "주의과정", "재현과정", "동기과정"], "ans": 0, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 6, "tag": "6장 기출 · 16년 하계 14번", "q": "인간행동의 관찰학습을 통해 알 수 있는 것은?", "opts": ["직접적인 강화물이 주어질 때 행동을 학습하게 된다.", "자기효능감이 높을수록 해당 행동을 수행할 가능성이 높다.", "인간의 인지와 동기는 행동학습과 무관하다.", "인간행동의 특성은 영유아기에 결정된다."], "ans": 1, "exp": "관찰학습의 과정 및 영향 요인\n▪ 단계 : 의미 : 영향요인\n▪ 주의 과정 : 모방할 대상 주목 : ▪관찰 자극의 특성 ·대상자의 특성과 학습자의 특성의 일치 정도 ·학습자의 정서적 가치와의 일치 여부 ·학습자에게 유익한 결과의 여부 ▪관찰자의 특성 ·대상 파악 능력 ·관찰자의 각성 수준 ·관찰자의 과거의 강화 경험\n▪ 파지 과정 : 모방할 행동 기억 유지 : ▪관찰 행동을 재생할 수 있도록 언어나 기호로 기억, 회상하는 능력\n▪ 재현 과정 : 모방대상의 행동을 구체적으로 나타내 는 과정 : ▪학습자의 재현 능력 ▪자기 행동에 대한 정교화 능력 ▪자기 행동을 정교화하려는 노력\n▪ 동기 과정 : 습득한 행동이 실제 상황에서 수행되도 록 하는 동기화 : ▪직접적인 보상 ▪대리강화 ▪수행해 보고 싶은 자기 욕구"},

  {"set": "exam", "lec": 7, "tag": "7장 기출 · 19-1학년 기말 56번", "q": "매슬로(Maslow)가 제시한 다섯 가지 욕구 중 '현재나 미래에 대한 예측성, 확실성, 안정성에 대한 욕구'와 관련된 것은?", "opts": ["생리적 욕구", "소속감과 사랑에 대한 욕구", "자아실현의 욕구", "안전에 대한 욕구"], "ans": 3, "exp": "매슬로의 욕구단계론\n▪ 생 리 적 욕구 : 결핍욕구 (외부로부 터 충족) : 가장 기본적이고 강력한 욕구\n▪ 안 전 의 욕구 : 안정과 보호, 질서, 현재나 미래에 대한 예측 이나 보장에 대한 욕구\n▪ 애 정 의 욕구 : 소속감과 사랑에 대한 욕구\n▪ 자아존중 의 욕구 : 존경, 지위, 명예 같은 타인을 비롯하여 자기 자신으로부터의 존중에 대한 욕구\n▪ 자아실현 의 욕구 : 성장욕구 (자아실현) : 성장 욕구이자 존재의 욕구로서 자신의 잠재 력을 인식하고 그것을 성취하고자 하는 욕구"},
  {"set": "exam", "lec": 7, "tag": "7장 기출 · 19-1학년 기말 57번", "q": "다음 <보기>에서 로저스(Rogers)의 자아개념 (self-concept)에 대한 설명으로 올바른 것을 모두 고른 것은?", "opts": ["가, 나", "가, 다", "나, 다", "가, 나, 다"], "ans": 1, "exp": "자기개념(self-concept) ⚫유기체의 경험으로 형성된 현상적 공간 가운데 ‘나’와 관련된 지각이나 부여된 가치들로 구성된 부분 ⚫나는 ~한 사람이다.’라는 자기에 대한 관점(self-image) ·현재의 나’라는 존재의 인식 ·내가 할 수 있는 것’이라는 기능적 인식 ·지각과 행동에 영향 ⚫일관성 있고 조직화 된 구조의 형태로 안정성을 지님 ·현상에 따라 끊임없이 변화하며 형성되는 유동적인 것 ⚫자기는 ‘이상적(ideal) 자기’와 ‘실제(real) 자기’로 구분 ·부적응 행동의 원인: 이상적 자기와 실제 자기의 불일치", "box": ["<보기>", "가. '나'와 관련된 지각이나 거기에 부여된 가치들로 구성된", "다.", "나. '자아'와 '자아개념'은 전혀 다른 의미로 사용된다.", "다. '자아'는 고정된 실체가 아니라 현상의 변화에 따라 끊", "임없이 변화하며 형성되는 유동적인 것이다."]},
  {"set": "exam", "lec": 7, "tag": "7장 기출 · 19-1학년 기말 58번", "q": "다음 중 로저스(Rogers)가 부적응 행동의 발생 원인으로 지적한 것은 무엇인가?", "opts": ["뇌기능의 이상", "부모의 실직", "반사회적 행위를 허용하는 사회적 분위기", "이상적 자아와 실제 자아 사이의 괴리"], "ans": 3, "exp": "부적응 행동의 원인 ⚫주관적 자기개념과 경험의 불일치 ·경험을 부인하거나 왜곡하여 자기를 방어함 ·불일치가 큰 경우 자기 붕괴"},
  {"set": "exam", "lec": 7, "tag": "7장 기출 · 19-1학년 기말 59번", "q": "로저스(Rogers)에 따르면, 인간은 불안과 위험에서 벗어나기위해 특정경험을 회피하거나 그것을 왜곡. 부정하게 되는데, 이를 무엇이라고 하는가?", "opts": ["유기체", "방어", "실현화경향", "공격"], "ans": 1, "exp": "⚫방어: 불안에서 벗어나기 위해 경험을 왜곡하거나 부정하는 것 •자기개념과 맞지 않는 행위들을 하고도 그것을 자신이 하지 않았다고 믿거나, 합리화 등을 통해 왜곡하여 지각하는 것"},
  {"set": "exam", "lec": 7, "tag": "7장 기출 · 19-1학년 기말 60번", "q": "로저스(Rogers)가 제시한 '충분히 기능하는 사람'의 특징이 아닌 것은?", "opts": ["자신에 대한 신뢰", "과거나 미래에 대한 집착", "자유의식", "창조성"], "ans": 1, "exp": "로저스의 ‘완전하게 기능하는 사람’의 특징\n▪ 완 전 하 게 기 능 하 는 사 람 의 특 징 : 경험에 대한 개방성(openness to experience) ·경험을 억압하거나 왜곡하지 않고 있는 그대로 수용 ·특정 경험에 대해 스스로를 방어할 필요가 없음\n▪ 실존적인 삶(existential living)에 충실 ·매 순간 충만하게 살며, 과거나 미래에 집착하지 않음\n▪ 자기 자신에 대한 신뢰(trust in one’s own organism) ·실존적 상황에서 가장 만족스러운 행동에 도달하는 방법 ·해야 할 것과 하지 말아야 할 것을 결정하는 기준으로 자기의 유기체적 경험을 기반으로 함\n▪ 자유로움(sense of freedom) ·억제나 금기 없이 생각과 행동 과정의 대안들 사이에서 자유롭게 선택할 수 있음 ·자신의 삶을 통제하고, 결정할 수 있는 힘이 있다고 생각하는 것\n▪ 창조성(creativity) ·자기 실존 영역에서 독창적인 사고력과 창조적 삶으로 스스로를 표현함 ·사회문화적 구속에 동조하거나 수동적으로 적응하지 않음"},
  {"set": "exam", "lec": 7, "tag": "7장 기출 · 19-3학년 기말 23번", "q": "매슬로(Mas|ow)의 이론에 대한 설명으로 가장 적합하지 않은 것은?", "opts": ["인간의 본성의 일부는 보편적이지만, 일부는 개인마다 고유한 특성을 지닌다.", "인간의 본성은 악하거나 중립적이다.", "인간이 타고난 본성대로 살면 정신적으로 건강하고 행복할 수 있다.", "인간의 욕구 중 상당 부분은 타인과 관계를 맺음으로써 충족될 수 있다."], "ans": 1, "exp": "매슬로의 기본적 시각과 특징\n▪ 기 본 적 시 각 : 인간의 문제해결 능력, 주체성에 주목 ·정신분석학의 비관적이고 결정론적 시각 비판 ·행동주의의 협소한 기계적 인간관 비판 ·인간의 건강하고 긍정적인 측면에 주목\n▪ 인간은 잠재력을 발달·성장시키려는 본능적 경향을 지님\n▪ 과 특 징 : ·자신의 삶을 변화시킬 수 있는 의지와 능력을 가지고 있음 ·잠재력을 살리지 못하기 때문에 정신적으로 성숙되지 못하거 나 건강하지 못함 ·인간발달의 가장 높은 단계인 자기실현의 중요성 강조\n▪ 인간 본성의 일부는 보편적이고, 일부는 개인마다 고유함 ·욕구, 정서, 잠재능력 등으로 이루어져 있음 ·인간 본성은 유전적으로 결정됨\n▪ 본성은 선하거나 중립적임 ·본성대로 살면, 정신적으로 건강하고 행복할 수 있음 ·본성을 억압 또는 부인하면, 심리적 장애를 야기함"},
  {"set": "exam", "lec": 7, "tag": "7장 기출 · 19-3학년 기말 24번", "q": "로저스(Rogers)는 유기체가 자신을 충족시키고, 보존·향상시키려는 경향성을 지닌다고 보았는데, 이를 무엇이라고 하는가?", "opts": ["자아개념", "불안과 방어", "실현화 경향", "가치조건"], "ans": 2, "exp": "유기체의 실현화경향은 인간을 비롯한 모든 생명체가 생득적으로 지닌 성숙의 잠재력이다. 로저스는 인간이 실현경향성의 일종인 자아실현 경향성을 지니고 태어나는 진취적인 존재라고 주장했다. 인간의 궁극적인 동기는 자신을 유지하고 향상시키기 위해 모든 잠재능력을 개발하는 자아실현으로 귀결된다고 하였다. 실현화경향은 유기체가 겪는 체험의 긍정성과 부정성을 평가하는 준거가 된다. 유기체를 향상시키는 것으로 지각되는 체험은 긍정적 가치를 부여받게 되고, 그렇지 못한 체험은 부정적 가치를 부여받는다. 이러한 평가과정을 유기체적 평가과정이라고 한다."},
