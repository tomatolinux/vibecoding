  {"set": "exam", "lec": 8, "tag": "8장 기출 · 19-1학년 기말 62번", "q": "에릭슨(Erikson)에 따르면, 아동기(6~ 12세)가 되면 자신의 유용성과 유능성을 추구하며 완전하게 잘 적응하도록 노력하는 경향이 나타난다. 이와 관련된 성격특질은 무엇인가?", "opts": ["신뢰감", "자아완성", "생산성", "근면성"], "ans": 3, "exp": "근면성((industry): 6세~12세 잠복기. 자기의 유용성과 유능성 추구, 완전하게 잘 적응하도록 노력하는 경향이 나타남. 어떤 성과를 달성했을 때 주위의 인정을 받을 수 있음을 알게 되어 목표달성을 위해 노력하게 됨, 근면성의 발달은 자신을 필요로 하는 세계에 적절히 부응하여 자신을 적응시키는 것이라 할 수 있음. 일에 주의를 집중하여 열심히 일을 해서 완수하는 기쁨을 맛보아, 유용성과 유능성을 추구하게 되는 것이며, 이때 일하고 만들어 내는 것에 적응이 안되고, 주의집중이 제대로 안 되면 열등감이 형성되기 쉽다."},
  {"set": "exam", "lec": 8, "tag": "8장 기출 · 19-1학년 기말 63번", "q": "의미치료 (logotherapy)의 창시자이자, 우리가 살아가는 주된 동기는 자아를 찾는 것이 아니라 '의미를 찾는 것'이라고 제시한 학자는?", "opts": ["프랭클", "왓슨", "스키너", "프로이트"], "ans": 0, "exp": "프랭클의 ‘의미 추구의 의지(will to meaning)’ ⚫삶의 목표는 인간 내부에 어떤 상태*를 이루는 것이 아니라 삶 자체에서 의미를 부여하여 외부의 목표를 달성하는 것 (* 자아실현, 행복, 정체성 등) ⚫자아를 찾는 것이 아니라 의미를 찾는 것 ·정말 중요한 것은 ‘우리가 삶으로부터 무엇을 기대하는가’가 아니라 삶이 우리로부터 무엇을 기대하는가’ 하는 것 ·인생이란 궁극적으로 이런 질문에 대한 올바른 답을 찾고, 개개인 앞에 놓여진 과제를 수행해 나가기 위한 책임을 떠맡는 것을 의미함 ·자신의 짐을 짊어지는 방식을 결정하는 것은 그에게서만 주어진 독자적인 기회임"},
  {"set": "exam", "lec": 8, "tag": "8장 기출 · 19-3학년 기말 26번", "q": "건전한 인간이 된다는 것은 '자기 자신을 초월하여 어떤 사람 혹은 어떤 일과 관계 맺는 것을 의미한다고 주장한 학자는?", "opts": ["프랭클", "왓슨", "스키너", "프로이트"], "ans": 0, "exp": "프랭클: 자아초월의 인간, 의미치료의 창시, 내인생의 의미를 찾는 것이 중요(의미 추구의 의지)"},
  {"set": "exam", "lec": 8, "tag": "8장 기출 · 19년 하계 41번", "q": "'의미추구의 의지(wil to meaning)'가 중요하다고 강조하는 의미치료(logotherapy)의 창시자는?", "opts": ["프랭클(Frankl)", "프로이트(Freud)", "파블로프(Pavlov)", "왓슨(Watson)"], "ans": 0, "exp": "(원문에 해설 없음)"},
  {"set": "exam", "lec": 8, "tag": "8장 기출 · 18-1학년 기말 62번", "q": "자아의 형성과정을 연구한 에릭슨(Erikson)에 따르면, 청소년기 또는 청년기가 되면 타고 난 역량, 주어진 기회, 해야 할 소임, 자신의 삶의 방식, 그리고 인간의 기본욕구들을 적절히 통합하는 자아인식이 발달하면서 ( 이것 )이 성장한다고 하였다. 이것은 무엇인가?", "opts": ["자아정체성", "자아통일", "자주성", "주도성"], "ans": 0, "exp": "자아정체감은 청소년기 또는 청년기가 되면 타고 난 역량, 주어진 기회, 해야 할 소임, 자신의 삶의 방식, 그리고 인간의 기본욕구들을 적절히 통합하는 자아인식이 발달하면서 성장한다. 자아정체감은 내적 동일성과 지속성, 명료한 자기인식, 자기확신 등을 특징으로 한다. 건강한 성격의 핵심이며, 정신건강에 크게 영향을 미친다. 자아정체감이 제대로 발달되지 못할 때 역할혼미 상태가 되며, 이는 성역할 혼란, 장래직업에 대한 혼란 등을 초래한다."},
  {"set": "exam", "lec": 8, "tag": "8장 기출 · 18-1학년 기말 63번", "q": "다음 중 모든 인간은 미래를 위해 발전하고 성숙하고자 하는 본능적인 욕구를 지닌다고 주장한 학자는 누구인가?", "opts": ["파블로프", "왓슨", "매슬로", "프로이트"], "ans": 2, "exp": "매슬로는 인간의 잠재력을 매우 중요시 하였으며, 모든 인간은 미래를 위해 발전하고 성숙하고자 하는 본능적인 욕구를 지니고 있다고 주장하였다."},
  {"set": "exam", "lec": 8, "tag": "8장 기출 · 18-3학년 기말 27번", "q": "자아의 형성과정을 연구한 에릭슨(Erikson)에 따르면, (이것)은 출생 후 1년간의 어머니와의 관계에서 형성되며, 타인을 합리적으로 믿고, 자기 자신에 대해서 자신감을 갖는 특질이다. 이것은 무엇인가?", "opts": ["신뢰감", "자아통일", "자아정체감", "주도성"], "ans": 0, "exp": "에릭슨의 건강한 성격을 구성하는 8가지 성격특질\n▪ 신 뢰 감 : ·타인을 합리적으로 믿고, 또 자기 자신에 대해서 자신감을 갖 는 특질. ·출생 후 1년간의 어머니와의 관계에서 형성되는 것.\n▪ 자 주 성 : ·1세에서 3세 ·자기 자신의 통제가 자주적으로 이루어짐. ·자존심의 상실 없이 자기통제가 의지대로 이루어지는 상태 자 _ 주성과 자부심 갖게 됨. ·자기통제가 제대로 안 되고 자의식이 강하게 나타나면 자기통 _ 제의 상실감, ·부모의 지나친 통제 의심과 수치심 형성됨. _\n▪ 주 도 성 : ·3세에서 5세 ·독립적으로 힘 있게 활발히 움직이고, 자기 자신을 큰 존재로 생각하고, 성차를 알며, 자기 장래의 가능성 있는 소임을 알아서 어떤 소임부터 먼저 해야 할 것인가를 탐지하고, 이를 해내는 경향성. ·자신의 소임을 수행하는 과정에서 실패를 거듭하면, 죄책감. 불안감, 은둔성이 생기게 됨.\n▪ 근 면 성 : ·6세에서 12세 잠복기. ·자기의 유용성과 유능성을 추구, 완전하게 잘 작용하도록 노 력하는 경향이 나타남. ·근면성의 발달은 자신을 필요로 하는 세계에 자신을 적용시키 는 것. 일하고 만들어 내는 것에 적응이 안 되고, 주의집중이 제대로 안 되면 열등감이 형성되기 쉬움.\n▪ 자 아 정 체 감 : ·에릭슨은 자아정체감을 내적 동일성, 지속성, 명료한 자기인 식, 자기확신 등을 특징으로 함. ·건강한 성격의 핵심은 자아정체감이며, 정신건강에 크게 영향 을 미친다고 봄. 자아정체감 발달 못함 역할혼미 상태 → 성역할 혼란, 장래 직 _ 업에 대한 혼란 등을 초래함.\n▪ 친 밀 성 : ·자아정체감이 확고해지고 성적 발달이 성인 수준으로 이루어 지면, 타인이나 이성에 대한 참된 친밀감이 발달하기 시작. ·자기 자신에 자신 無 대인 간의 친밀관계를 회피하려 함. _ ·자기 자신에 자신 有 우정, 사랑, 헌신, 화해, 희생과 같은 _ 친밀한 관계 맺기에 적극적임. ·자기 자신에 자신 無 성적 결함 有 이성이나 타인과의 격리 _ 감이 생겨 자기 자신에만 몰두하는 경향이 생김.\n▪ 생 산 성 : ·자녀의 출산과 양육, 그리고 직업 활동에 몰두하는 경향으로 서, 성인으로서의 책임을 다하는 특질을 말함.\n▪ 자 아 통 일 : ·자기와 자기인생의 역정을 있는 그대로 받아들임. ·자기와 자기인생을 의미있는 것으로 포용. 자기와 세계, 역사 를 조화롭게 통합 참된 자기를 완성하려는 것. ·부모세대로서 후손에게 기여하고자 하는 것. ·인생을 자기 자신의 책임하에 살아왔음을 받아들이는 것."},

  {"set": "exam", "lec": 8, "tag": "8장 기출 · 16년 하계 20번", "q": "에릭슨이 말하는 건강한 성격의 특질 중, 가장 초기에 발달하는 것은?", "opts": ["자주성", "신뢰감", "친밀성", "생산성"], "ans": 1, "exp": "에릭슨의 여덟 개의 성격 특질\n▪ Older adult (65-) : 자아통합 대 절망(ego integrity vs. despair)\n▪ M i d d l e - a g e adult(40-65) : 생산성 대 침체성(generativity vs. stagnation)\n▪ Young adult (18-40) : 친밀감 대 고립감(intimacy vs. isolation)\n▪ Teenager (12-18) : 정체성 대 혼돈(identity vs. role confusion)\n▪ Grade-schooler (6-11) : 근면성 대 열등감(industry vs. inferiority)\n▪ P r e - s c h o o l e r (3-6) : 주도성 대 죄의식 (initiative vs. guilt)\n▪ Toddler (2-3) : 자율성 대 수치심과 의심(autonomy vs. shame & doubt)\n▪ Infant (0-1) : 신뢰감 대 불신감 (trust vs. mistrust)"},

  {"set": "exam", "lec": 8, "tag": "8장 기출 · 16년 하계 22번", "q": "프랭클이 제시하는 이상적인 인간상인 '자아초월의 인간' 의 모습에 가장 가까운 것은?", "opts": ["사익을 좇지 않고 자기 행복을 위해 현신한다.", "자신에게만 몰두하지 않고 자아 외부의 목표를 추구한다.", "사회의 규범에 연연해하지 않고 자기 욕구에 솔직하다.", "이타적인 욕구를 억누르고 쾌락 원칙에 따라 행동한다. 건전한 성격 정리▪ 프 로 이 트 : 자아가 조화를 이룬 성격 정신적으로 건강한 사람 _▪ ⚫사랑할 수 있는 능력과 생산적인 일을 할 수 있는 사람 ⚫자아(ego)가 강건하여 욕구와 욕구 간의 갈등, 충동과 도덕 간의 갈등을 잘 해결하는 사람 ⚫정신적으로 건강한 사람의 특징 ·부당한 죄책감이나 사회적 비난에 좌우되지 않음 ·자기감정을 억압하지 하고 자기표현에 솔직함▪ 융 : 정신기능들이 조화를 이룬 성격 건강한 성격 _▪ ⚫사고, 감정, 감각, 직관의 네 가지 기능이 균형 있게 조화를 이루며, 조절이 가능한 성격 ·네 가지 기능이 불균형하다 하더라도 주 기능과 보조기능을 명료하게 인식하고 있어 상황에 따라 적절히 조절, 적응할 수 있는 성격 ⚫‘사회적인 나’와 ‘내면의 나’ 사이의 차이를 인식하고 ‘내면의 나’에게 관심을 갖고 존중·보호하는 성격 ·건강하지 못한 사람: ‘내면의 나’를 무시하고 억압, 파괴▪ 에 릭 슨 : 특질들이 조화를 이룬 성격 성격 발달 이론 _▪ ⚫각 발달단계마다 고유하게 나타나는 내적 또는 심리적 갈등 (고민)이 존재 ⚫갈등을 해결하는 과정을 통해서 성격 발달 ⚫건강한 성격 ·여덟 발달 단계를 거치며 획득한 건전한 성격 특질들이 서로 조화를 이룬 성격 ·내적 조화, 올바른 판단, 과제 수행 능력, 환경을 적극적으로 극복하는 능력 등을 갖춘 사람▪ 로 저 스 : 성장심리학과 건전한 성격 완전히 기능하는 인간 _▪ ⚫자아실현에의 경향성은 생득적이며 평생 지속 ⚫자신의 독특한 심리적 특성과 의미를 개발한 인간 ·경험에 대한 개방성, 실존적인 삶, 자신에 대한 신뢰, 자유의 식, 창조성 (↔ 방어적인 인간)▪ 매 슬 로 : 성장심리학과 건전한 성격 자아실현의 인간 _▪ ⚫발전하고 성숙하고자 하는 본능적 욕구를 가진 존재 ·성장과 소망을 충족하기 위해 최선을 다하는 존재 ·과거의 상처, 불행을 극복하고 자아실현하려는 존재 ⚫자아실현을 촉진하는 바람직한 양육 환경: 한계 내에서의 자 유 (freedom within limits)▪ 올 포 트 : 성숙한 인간 성숙한 인격을 지닌 사람의 일곱 가지 경향성 _▪ ⚫자아의식을 확대해 간다. ⚫타인들과 따뜻한 관계를 유지한다. ⚫정서적으로 안정되어 있다. ⚫현실을 왜곡하지 않고 있는 그대로 지각한다. ⚫하는 일에 몰두하여 과업지향적으로 행동한다. ⚫자기자신을 객관적으로 이해하려고 노력한다. ⚫통일된 인생철학을 지니고 있다.▪ 프 랭 클 : 자아초월의 인간 의미 추구의 의지(will to meaning) _▪ ⚫삶의 목표는 인간 내부에 어떤 상태*를 이루는 것이 아니라 삶 자체에서 의미를 부여하여 외부의 목표를 달성하는 것 (* 자 아실현, 행복, 정체성 등) ⚫자아를 찾는 것이 아니라 의미를 찾는 것▪ ·정말 중요한 것은 ‘우리가 삶으로부터 무엇을 기대하는가’ 가 아니라 ‘삶이 우리로부터 무엇을 기대하는가’ 하는 것 ·인생이란 궁극적으로 이런 질문에 대한 올바른 답을 찾고, 개 개인 앞에 놓여진 과제를 수행해 나가기 위한 책임을 떠맡는 것 을 의미함 ·자신의 짐을 짊어지는 방식을 결정하는 것은 그에게서만 주어 진 독자적인 기회임"], "ans": 1, "exp": "(원문에 해설 없음)"},

  {"set": "exam", "lec": 9, "tag": "9장 기출 · 19-3학년 기말 28번", "q": "충격적인 경험과 스트레스를 계속 겪으면 발생하는 심리적 반응으로, 무감동, 무기력, 자포자기에 빠진 상태를 무엇이라고 하는가?", "opts": ["재앙증후군", "무력감", "갈등", "일반적응증후군"], "ans": 1, "exp": "스트레스에 대한 반응\n▪ 재 앙 증 후 군 : ⚫충격으로 인한 일시적인 정서 혼란 상태 ·증상: 어리둥절, 자기통제 불능, 망연자실, 불안 등 ⚫단계: 쇼크 → 암시 → 회복 ·무감각해지거나 반응이 일시적으로 정지 ·주위의 지시나 명령에 수동적으로 따름 ·자기통제력을 어느 정도 회복하였으나 불안감, 강박적 행동, 수면 문제 등이 나타나는 단계\n▪ 무 력 감 : ⚫충격적인 경험을 반복적으로 겪으면서 무감동, 무기력, 자포자 기에 빠진 상태 ·예) 수용소의 포로, 전쟁고아, 노예 등 ⚫반복되는 좌절 경험, 상황·환경에 대한 통제 불가능 인식\n▪ 우 울 감 : ⚫스트레스 사건으로 인해 나타나는 울적한 정서 ⚫대표적인 원인: 애정 대상의 상실 ·사별, 이별, 배신, 신체적 고립, 절망감 등 ⚫상실 대상에 대한 적개심, 정서적 불안정, 죄책감, 자기경멸, 공격성, 자살행동 등으로 악화 가능"},

  {"set": "exam", "lec": 9, "tag": "9장 기출 · 19년 하계 43번", "q": "스트레스의 일반적인 발생 원인은 상황적 원인과 심리적 원인의 두 가지로 구분할 수 있다. 다음 중 스트레스 원인 중 심리적 원인은 무엇인가?", "opts": ["천재지변이나 돌발사고", "결핍감", "복잡한 인간관계", "힘든 선택"], "ans": 1, "exp": "스트레스의 발생원인: 상황적 원인,심리적 원인(결핍감, 압박감, 욕구좌절, 갈등, 개인요인)\n▪ 스 트 레 스 의 심 리 적 발 생 원 인 : 결 핍 감 : ⚫개인의 욕구를 만족시킬 수 있는 수단이 박탈되거나 제거된 상태라는 느낌 ⚫결핍의 원인 ·신체적 고립: 집단·장소로부터 격리 → 기본 욕구충족 차 단, 심리불안 ·심리적 고립: 정서적 유대의 결여 상태 예) 사별, 학교에서의 따돌림, 독거 노인의 고독 등 ·사회적·직업적 고립: 역할·일로부터 고립 → 자존감과 존 재가치에 위기 예) 실직자의 불안, 정년퇴직자의 우울 등\n▪ 압 박 감 : ⚫특정한 행동표준을 준수해야 한다거나 급속한 변화에 적응해 야 할 때 느끼는 심리적 부담감 ⚫내적 압박감: 자신을 목표수준으로 끌어 올리려 할 때 느끼 는 압박감 ·달성 가능한 목표 수준인 경우 → 건설적, 생산적 ·능력에 비해 과도한 목표 수준의 경우 → 부정적 ⚫외적 압박감: 남과의 경쟁, 변화에 적응해야 한다는 부담, 타인의 기대로 인한 압박감\n▪ 욕 구 좌 절 : ⚫어떤 목표를 달성하고자 하였으나 방해물로 인하여 저지되었 을 때 경험하는 심리 상태 ⚫욕구좌절의 원인 ·시간 부족 및 통제 불가능 예) 일정 지연, 지각 등 ·자원의 부족 ·중요한 사람의 상실 ·목표 달성의 실패 혹은 경쟁에서의 패배 ·삶에 대한 무기력감으로 인해 느끼는 삶의 무의미함\n▪ 갈 등 : ⚫서로 모순되거나 양립할 수 없는 동기, 태도, 가치, 목표 등 이 동시에 유발되는 것 ⚫갈등의 분류 ·접근-접근 갈등 ·회피-회피 갈등 ·접근-회피 갈등 ·이중-접근 회피 갈등: 접근-회피 갈등을 보이는 두 개의 목\n▪ 표 중 하나를 선택해야 하는 경우 예) 아버지는 야구를, 어머니는 피아노를\n▪ 개 인 적 요 인 : ⚫상황에 대한 인지적 평가 ·상황에 대한 객관적 사실보다 주관적 평가가 스트레스 정도 에 영향 ⚫스트레스 대응에 필요한 지식 및 기술 보유 여부 ⚫대응 능력에 대한 자신감 정도 ⚫스트레스 상황에 대한 예측 가능성 ⚫스트레스 상황에 대한 통제 가능성 ⚫사회적 지원"},

  {"set": "exam", "lec": 10, "tag": "10장 기출 · 19-1학년 기말 65번", "q": "합리화의 방어기제 중 '자신의 현 상태를 과대포장하는 것'과 관련된 것은?", "opts": ["신 포도 기제", "달콤한 레몬 기제", "망상", "투사"], "ans": 1, "exp": "방어적 적응_기만형 방어기제\n▪ 기 만 형 방 어 기 제 : 합 리 화 : 인정할 수 없는 실제 이유 대신 그럴듯한 이유를 대는 것\n▪ 신 포 도 기 제 : ·목표 달성이 어려울 때 해당 목표의 가치를 평가절 하 ·‘공부 잘해 봤자 아무 소용 없더라.’\n▪ 달콤한 레 몬 기제 : ·자신의 현재 상태를 과대 포장하는 것 ·팀장에서 내려온 뒤, ‘책임이 없으니 너무 좋다’\n▪ 망상 : ·자신의 능력에 대해 허구적 신념을 가짐으로써 실패 의 원인을 합리화함 ·‘나의 재능을 시기해서 나를 탈락 시킨거야.’\n▪ 투 사 : ⚫자신이 무의식에 품고 있는 공격적 계획과 충동을 남의 것이 라 믿고 남에게 던져 버리는 정신기제 ·용납될 수 없는 자신의 생각이나 욕구를 남에게 덧씌우거나, 책임을 타인에게 돌림으로써 자기열등감, 불안감,분노로부터 탈 피하려는 것 ·자신이 누구를 미워할 때 그가 자신을 몹시 미워하기 때문에 자신도 그를 미워한다는 경우 ·자신의 실수에 남의 탓을 하는 것 ⚫투사의 부작용 ·대인관계에 악영향 ·피해망상, 관계망상으로 악화\n▪ 전 위 : 전이, 대치, displacement ⚫욕구를 충족시킬 수 있는 대상이 위협적이거나 접근이 불가 능할 때 다른 대상을 통해서 긴장을 완화시키는 것 ·‘동에서 뺨 맞고 서에서 화풀이 한다’ ·어머니로부터 혼 난 어린이가 애완견에게 화풀이 ⚫전위의 특수한 경우 ·대상을 자기 자신으로 돌리는 경우 → 자기멸시와 우울증을 초래\n▪ 억 압 : ⚫방어기제 중 가장 원시적이고 일차적 ⚫욕망의 대상이 죄의식이나 수치, 싫증, 고통을 불러 일으키는 경우, 욕망 자체가 의식에 떠오르지 못하게 억누르는 것 ·숙제하기 싫은 초등학생의 알림장 잃어버리기 ·치과 예약을 망각하는 것 ⚫그러나 억압된 감정이나 긴장은 완전히 사라지는 것이 아니 라 꿈, 사고, 실수의 형태로 드러남"},

  {"set": "exam", "lec": 10, "tag": "10장 기출 · 19-3학년 기말 31번", "q": "회피형 방어기제 중 불안을 없애기 위해서, 오히려 불안의 원인이 되는 사람과 똑같이 되려는 것을 무엇이라고 하는가?", "opts": ["공상", "퇴행", "거부", "동일시"], "ans": 3, "exp": "방어적 적응_회피형 방어기제\n▪ 회 피 형 방 어 기 제 : 공 상 : ⚫현실에서는 충족시킬 수 없는 욕구를 상상의 세계에서 충족 시키고자 하는 것\n▪ 순기능 : ·정신적, 정서적 휴식 제공 ·긴장 해소, 재충전 ·사회적으로 해롭지 않은 쾌락 제공\n▪ 부작용 : ·자주 사용하다 보면 중독되어 실제 현실을 기피\n▪ 퇴 행 : ⚫위협적이거나 불안한 상황에 직면했을 때 생의 초기에 만족했던 행동방식에 의지하여 상황을 모면하려 는 방법 ·동생이 태어난 후 부모의 관심을 빼앗긴 아이가 대소변을 가리지 못하게 되는 것\n▪ 거 부 : ⚫고통스러운 상황이나 위협적인 정보 자체를 부정함으로써 일시적인 심리적 안정을 찾는 행동 ·불치병을 진단받은 사람이 진단결과를 인정하지 않는 것 ⚫순기능 ·상황을 극복할 수 있는 동기나 에너지를 제공해 주기도 함\n▪ 동 일 시 : ⚫자기자신은 실현할 수 없는 만족을 다른 사람이나 집단을 통해 대리적으로 추구하는 것 ·조상, 동창, 동향 사람의 명예를 자신의 것인 것처럼 여김 ⚫불안을 없애기 위해서 오히려 불안의 원인이 되는 사람과 똑같이 되려는 것 ·오이디푸스적 갈등을 겪는 유아가 아버지와 동일시하는 것 ⚫역기능 ·동일시 대상에 대한 맹목적인 추종과 충성 ·다른 집단에 대한 차별 ·자기 개발 및 발전 노력에 소홀해질 가능성"},
  {"set": "exam", "lec": 10, "tag": "10장 기출 · 19년 하계 45번", "q": "자신의 용납될 수 없는 생각이나 욕구를 남에게 덧씌우거나(throwing out), 책임을 다른 사람의 탓으로 전가하여 초자아의 압력을 피하여 자기열등감, 불안감, 분노에서 탈피하려는 기제는 무엇인가?", "opts": ["합리화", "투사", "보상", "공상"], "ans": 1, "exp": "방어적 적응(방어기제)의 분류\n▪ 기만형 : 대체형 : 회피형\n▪ 합리화(변명) : 보상 : 공상\n▪ ∙신 포도: 목표의 평 가절하 ∙달콤한 레몬: 현 상 태를 과대 포장 ∙망상: 전혀 근거없는 허구의 신념으로 합리 화 : :실패를 회피하기 위하 여 대리적이며, 이차적 인 목표를 취하는 것 : :현실에서 충족시킬 수 없는 욕구를 비현실세 계에서 충족하고자 하 는 도피 형식\n▪ 투사 :책임을 다른 사람에게 전가 : 반동형성 :완전히 반대되는 감정 이나 행동으로 대체하 여 표현하는 것 : 퇴행 :정상적 수준임에도 위 협과 불안의 상황에 직면하면 생의 초기에 만족했던 행동양식에 의지하는 것\n▪ 전위(전이, 대치) :동에서 뺨 맞고 서에 서 화풀이하는 행동의 기제 : 승화 :정서적 긴장이나 원초 적 욕구를 윤리적으로 용납할 수 있는 행동 양식으로 대체(예시: 예술 작품) : 거부 :고통스러운 상황이나 위협적인 정보를 부정 하는 것\n▪ 억압 :방어기제 중에 가장 원시적인 것으로 욕망 대상이 나타나면 의식 에 떠오르지 못하게 하는 작용 : 동일시 :실제로 자기 자신은 실현할 수 없는 만족 을 애착대상이 되어 있는 다른 사람의 행 동을 통해서 충족하는 것"},

  {"set": "exam", "lec": 11, "tag": "11장 기출 · 19-1학년 기말 66번", "q": "다음 중 사회적으로 통용되는 행동의 표준이나 기준으로부터 두드러지게 일탈 된 행동을 부적응으로 규정하는 것과 관련된 것은?", "opts": ["평균으로부터의 일탈", "이상으로부터 일탈", "사회적 기준으로부터의 일탈", "행동의 역기능성"], "ans": 2, "exp": "부적응행동의 준거 사회적 기준으로부터의 일탈\n▪ 부 적 응 행 동 의 준 거 : 평 균 으 로 부 터 의 일 탈 : 통계적 평균에서 동 떨어져 있는 행동을 부적응행동으로 규 정 : ⚫특정 상황에서 일반적 행동으로부터 벗어 난 극단적 행동 ⚫객관적이고 동일한 척도를 기준으로 판단\n▪ 개념의 한계 : ⚫바람직한 행동도 부적응 행동으로 규 정 ·남다른 이타심, 자기희생적 행위, 탁 월한 재능 ⚫특정 사회의 평균적 행위자체가 비도 덕적, 비윤리적일 수 있음\n▪ 이 상 으 로 부 터 의 일 탈 : 바람직한 행동의 표 준을 정해 놓고, 이 에 이르지 못한 행 동을 부적응행동으 로 규정 : ⚫행동의 표준을 제공\n▪ 개념의 한계 : ⚫‘이상적인 것‘에 대한 절대적인 기준 마련 불가능 ·다양한 가치 기준 ⚫행동 표준 역시 변화하므로 이견 및 혼란이 초래될 수 있음\n▪ 주 관 적 인 고 통 : 개인이 주관적으로 느끼는 고통을 기준 으로 부적응행동을 판단 : ⚫당사자의 주관적 경험을 존중 ·회사(동료)에 대한 불만과 고통\n▪ 개념의 한계 : ⚫주관적 고통이 없는 상태가 오히려 부적응 행동인 경우도 있음 ·가족의 죽음에도 무감각, 범죄를 저 지르고도 당당 ⚫개인의 행동이 지녀야 할 사회적 책 임성을 간과한 정의\n▪ 사 회 적 기 준 으 로 부 터 의 일 탈 : 구성원들 사이에 통 용되고 있는 사회적 규범으로부터 일탈 된 행동을 부적응행 동으로 규정 : ⚫개인의 사회화와 문화적 적응성의 중 요성 강조 ·소속 문화권에 얼마나 수용될 수 있 는지를 중요하게 여김\n▪ 개념의 한계 : ⚫옳다고 여기는 신념을 지키기 위해 사회규범을 어기는 경우 이를 일탈행위 로 규정하는 데 논란의 여지 ·종교적 신념에 따라 징병을 거부하 는 경우 ⚫사회적 규범이 문화에 따라 다르고 시간에 따라 변화함\n▪ → 규정에 어려움이 따름\n▪ 행 동 의 역 기 능 성 : 개인이나 사회에 문제를 유발하거나 행복과 복리수준을 저해하는 행위를 부적응행동으로 규정\n▪ 부적응행동의 세 가 지 조건 : ⚫개인이 사회구성원으로서의 역할을 효과적으로 수행하지 못하는 행동(예: 약물 중독, 알코올 의존증) ⚫개인의 욕구를 충족시켜주지 못하는 행동 ⚫타인의 복리를 저해시키는 행동(예: 각종 범죄 행위)\n▪ 개념의 한계 : ⚫기준은 있으나 불분명함: 모든 행동 은 적응적 측면과 부적응적 측면을 가지고 있음"},
  {"set": "exam", "lec": 11, "tag": "11장 기출 · 19-1학년 기말 67번", "q": "환자를 여러 시간 동안 두려워하는 상황(조건자극)에 머물게 하여 처음에 경험했던 고통(무조건적 반응)이 일어나지 않는 것을 스스로 확인하게 함으로써 공포증과 같은 부적응행동이 사라지도록 하는 행동주의 치료법은 무엇인가?", "opts": ["혐오적 조건화", "홍수법", "모델링", "자기분석법"], "ans": 1, "exp": "행동주의적 모형_행동주의적 치료법\n▪ 행 동 주 의 적 치 료 법 : 혐오적 조건화 : ·쾌감을 주었던 자극이 불쾌한 반응을 일으키도록 하 는 기법 ·알코올 의존증 환자에게 구토유발성분을 섞은 술을 제공\n▪ 홍수법 : ·여러 시간 동안 환자를 두려워하는 상황에 머물게 함 으로써 해당 상황이 무해함을 자각하게 하는 것(※ 노 출치료)\n▪ 체계적 둔감화 : ·‘평온함과 불안을 동시에 느낄 수 없다.’ ·강도가 약한 자극에서 강한 자극의 순서로 단계적으 로 노출하면서, 자극에 익숙하게 하여 강한 자극에서도 반응하지 않게 하는 방법\n▪ 선택적 긍정적 강화 : ·원하는 행동이 일어날 때 긍정적 강화를 체계적으로 제공하여 해당 행동의 발생 빈도를 증가시키는 방법\n▪ 선택적 처벌 : ·문제 행동이 나타날 때마다 처벌이나 보상의 철회를 적용하여 해당 행동의 발생 빈도를 감소시키는 것\n▪ 모델링 or모방 : ·직접 경험을 통하지 않고 모델이 받는 강화나 처벌을 통해 간접적으로 적응적 행동을 학습하는 방법"},

  {"set": "exam", "lec": 11, "tag": "11장 기출 · 18년 하계 37번", "q": "다음 중 생리학적 모형에서 설명하는 부적응행동의 원인은?", "opts": ["파괴적 사회관계", "호르몬의 불균형", "왜곡된 현실 인식", "부정적 강화 경험"], "ans": 1, "exp": "부적응행동모형_생리학적 모형\n▪ 생 : 부적응 : ⚫신체의 한 부분이 제대로 작동하지 못하여 나타나는\n▪ 리 학 적 모 형 : 행동의 정의 : 역기능 ·일종의 질병으로 간주 ·의학적 모형, 질병모형\n▪ 부적응 행동의 원인 : ⚫세균, 유전적 요인, 호르몬 분비의 불균형, 생화학 물 질의 이상, 뇌의 역기능 ·정신분열증: 도파민 과다 ·우울증: 뇌의 기능 결함\n▪ 부적응 행동의 치료 : ⚫생화화적 요인의 정상화를 위해 화학적 치료나 약품사 용 ⚫특정 부적응 치료의 효과와 부작용 ·리튬: 조울증 효과, 심장·소화기·중추신경 부작용 ·전기충격치료(ECT): 우울증 효과, 기억상실 부작용\n▪ 모형에 대 한 비판 : ⚫마음이나 정신의 문제를 생물학적 원인으로 환원 ·인간의 자율성 간과, 사회문화적 영향 간과 ⚫치료과정을 전문가가 주도 ·환자 당사자의 자율성, 의지, 책임을 경시"},
  {"set": "exam", "lec": 11, "tag": "11장 기출 · 18년 하계 38번", "q": "부적응 행동을 하는 사람을 있는 그대로 수용하고 긍정적으로 존중해 주는 것이 문제해결에 도움이 된다고 보는 입장은?", "opts": ["인지적 모형", "정서학습 모형", "행동주의 모형", "인본주의 모형"], "ans": 3, "exp": "부적응행동모형_인본주의모형\n▪ 인 본 주 의 모 형 : 기본 특징 : ·인간의 자유의지, 존엄성, 주관적 인식을 강조 ·모든 인간은 자아실현을 추구한다고 가정\n▪ 부적 응행 동의 원인 : ·자아실현이나 발전의 경향성과 같은 선천적 동기 충족이 저지당할 때(Maslow) ·자기실현과 향상 욕구의 좌절 경험을 자기구조 속에 받 아들이지 못하고 자기개념과 경험 사이에 불일치가 발생할 때(Rogers)\n▪ 인본 주의 적 치료 기법 : 공감적 이해 : ·상담자가 내담자의 주관적 세계에 공감해 줌 으로써 내담자의 자기 개념을 확장시키는 방법\n▪ 무조건적 긍정적 존중 : ·수용과 인정의 경험을 통해 내담자의 방어를 감소시키고 경험과 자기개념의 불일치를 해소 하도록 하는 방법\n▪ 내담자의 진실성 : ·감정과 생각을 솔직하게 드러내게 하여 내담 자의 긍정적 변화를 촉진하는 방법\n▪ 게스탈트 치료기법 : ·자신의 지금-여기에서의 경험을 충분히 느끼 고 수용토록 하여 내적 자각을 확장하고 통합 하도록 돕는 방법\n▪ 실존주의 적 치료기법 : ·자아실현 동기, 자유의지, 책임감을 인정하고 존중함으로써 부적응적 행동의 변화를 촉진시 키는 방법"},
  {"set": "exam", "lec": 11, "tag": "11장 기출 · 18년 하계 39번", "q": "잘못된 인식과정을 부적응행동의 원인으로 간주하여 왜곡된 인식을 바꿈으로써 부적응행동을 치유하려는 모형은?", "opts": ["인지적 모형", "행동주의 모형", "생리학적 모형", "인본주의 모형"], "ans": 0, "exp": "부적응행동모형_인지적모형\n▪ 인 지 : 부적응 행동의 : ⚫잘못된 사고(생각)가 부적응행동을 초래 ·인지내용(기대, 믿음, 기억)이 행동유발\n▪ 적 모 형 : 원인 : ·‘나는 무가치한 존재이다.’는 생각 → 우울증\n▪ 부적응 행동의 치료 : ⚫왜곡된 사고를 바꾸는 것 ·왜곡된 인식이나 신념과 사고를 찾아내고 논박하여 부 정적 사고의 개선을 이끌어 냄\n▪ 부적응 행동을 유발 하는 사고의 내용 : 기 대 : ⚫미래에 일어날 사건을 예측하는 인지 ·미래에 대한 부정적 기대 → 우울증\n▪ 평 가 : ⚫자신의 행동이나 자신에게 일어난 일에 대한 평가 ·자신의 영역이 침범 당했다는 평가 → 분노\n▪ 귀 인 : ⚫사건이나 행동의 원인을 어디에 돌리는가에 관한 사고 ·스스로에게 부정적 귀인 → 낮은 자아개념 및 우 울증 초래\n▪ 신 념 : ⚫일관성과 지속성을 가진 인지적 과정 ·비합리적인 신념은 심리적 장애를 유발: 완벽주의 적 신념, 흑백논리적 사고는 좌절감 초래 ·‘모든 사람으로부터 사랑과 인정을 받아야 한 다.’\n▪ 인지적 모형의 의의 : ⚫외부 전문가가 개인을 ‘치료’하는 것이 아니라, 당 사자 스스로가 자신의 행동을 분석하고 평가하도록 요구 ⚫주체적, 자율적으로 보다 더 나은 행동 방식을 개발하 도록 도움을 주려 함"},

  {"set": "exam", "lec": 11, "tag": "11장 기출 · 17-1학년 기말 62번", "q": "\"부적응행동에 대한 심리역동적 모형에서는 ( )을 부적응 행동의 주요인으로 간주한다.\" ( )안에 들어갈 말은?", "opts": ["환경", "신체적 결함", "불안", "왜곡된 인식"], "ans": 2, "exp": "부적응행동모형_정신분석모형\n▪ 정 신 분 석 모 형 : 부적응 행동의 원인 : ⚫인간 내부에 존재하는 힘, 욕망, 동기들 간의 갈등으 로 발생한 불안, 열등감, 분노가 부적응 행동을 유발 ·원초아, 자아, 초자아 간 갈등(※ 프로이트) ·특히, 어린시절에 억압된 욕구가 무의식 속에 계속 남아있다가 성인기에 부적응 행동으로 표출 ·정신역동모형, 심리역동모형\n▪ 치료 원리 : ⚫무의식적인 갈등을 해소하는 것이 핵심 ·특히, 초기 아동기에 형성된 무의식적 갈등 해소 ·편안하고 안전한 분위기 속에서 자유연상 등을 통해 환자 스스로 억압되어 있는 갈등을 각성하고 해소하도록 유도\n▪ 부적응 행동의 치료 단계 : 방어기제 의 분석 : ·자유연상법을 통해 무의식적인 갈등을 파악 하도록 유도\n▪ 전이와 해석 : ·잊혀졌던 아동기 기억과 억압된 무의식적 환상을 드러냄\n▪ (※환자가 비정상적일 정도로 강렬한 정서 표 출) ·치료자가 무의식적인 갈등의 의미를 환자에게 설명함\n▪ 훈습 : ·무의식상의 갈등과 불안 해소를 반복, 정교 화, 확장하는 과정\n▪ 정신 분석 모형의 의의 : ⚫의식되지 않는 복잡한 내면세계가 존재한다고 가정함 으로써 인간행동분석에 시야를 확장시켜줌 ⚫행동에 대한 개인 책임성의 문제를 간과"},

  {"set": "exam", "lec": 11, "tag": "11장 기출 · 17-3학년 기말 62번", "q": "DSM-Ⅳ의 분류에서 공포증, 공황장애, 강박장애, 외상 후 스트레스 장애, 급성 스트레스 장애 등이 포함되는 부적응행동의 범주는?", "opts": ["해리성 장애", "인지장애", "불안장애", "성격장애"], "ans": 2, "exp": "부적응행동분류 및 진단\n▪ 부 적 응 행 동 분 류 : 신경 발달 장애 : ⚫지적 장애 ⚫의사소통 장애 ⚫자폐 스펙트럼 장애 ⚫주의력결핍 및 과잉활동장애(ADHD) ·부모의 교육, 행동치료와 약물 치료의 병행 ⚫특정 학습 장애 ·학습 부진, 학습 지진, 학습 장애 ⚫운동장애-틱 장애 계열: 운동틱, 음성틱 ·긴장하면 더 잦아지기 때문에 관심을 덜 기울여야 함 ·자신의 의지와는 다르게 이루어짐 → 자존감 저하\n▪ 불안 장애 : 범불안 장애 : 특정한 상황뿐만 아니라 항상 불안함\n▪ 특정공 포증 : 특정한 상황·대상·장소에 대해 공포감을 느낌\n▪ 광장공 포증 : 탁 트인 곳에서 불안함\n▪ 공황장 애 : ⚫갑자기 공황발작을 느낌 ·언제 발작이 일어날까에 대한 불안함으로 인해 광장공포증을 동반하기도 함\n▪ 사회불 안장애 : 부정적인 피드백에 대한 과도한 불안감\n▪ 분리불 안장애 : 애착 대상과 떨어지지 못함\n▪ 선택적 무언증 : 특정한 장소에서만 말을 못함\n▪ 강박 및 관련 장애 : ⚫예후가 좋지 않으며 치료를 제때에 못 받으면 정신분열 병이 나타날 수 있음 ⚫순수 불안이라기보다 한 대상(관련 대상)에 집착하고 충 동 제어가 힘듦 ·흔히 나타나는 강박 행동: 씻는 것, 확인하는 것 ⚫신체 기형 장애: 내 몸의 일부가 기형처럼 느껴지는 장 애 ⚫저장장애: 수집광 ·주변 사람들과 겪는 스트레스로 인한 고통을 느낌 ⚫발모광 ⚫피부 벗기기 장애\n▪ 성격 장애 : 어린 시절부터 점진적 형성, 성인기에 진단됨\n▪ A 군 성격 장애 : 기이하고 괴상한 행동특성\n▪ 편집성 : 타인의 의도를 적대적으로 해석하는 불신, 의심\n▪ 분열성 : 감정표현이 없고, 대인관계 기피. 은둔적 성격\n▪ 분열형 : 친밀한 인간관계를 불편해하며, 인지적·지각적 왜곡. 심한 사회적 불안을 느끼며 마술적 사고, 기이한 신념에 집착\n▪ B 군 성격 장애 : 극적·감정적이며, 변화 많은 행동이 주된 특성\n▪ 반사회성 : 사회적 규범이나 타인의 권리 무시하는 행동 거짓말·사기·폭력적인 행동 → 후회 ·죄책 감을 느끼지 못함\n▪ 연극성 : 과도하고 극적인 감정표현으로 타인의 관심과 주의를 끄는 행동\n▪ 경계선 : 자기자신이 어떤 사람인지에 대한 개념이 없고 만성적으로 공허감, 분노감을 느끼고, 매우 충동 적 행동을 나타냄 → 대인관계, 자기상, 감정 등이 매우 불안함\n▪ 자기애성 : 자신을 대단히 중요한 사람이라는 자기상을 지 님\n▪ C 군 성격 장애 : 불안과 두려움을 지속적으로 경험하는 특징\n▪ 회피성 : 타인으로부터 부정적 평가를 받는 것에 대해 과도 하게 예민, 대인관계 회피\n▪ 의존성 : ·타인으로부터 보살핌을 받고자 하는 과도한 욕 구로 타인에게 지나치게 순종적이고 굴종적인 행 동을 통해 의존 ·마마보이\n▪ 강박성 : ·질서정연함, 완벽함, 자기통제, 절약에 과도하게 집착하며 지나치게 꼼꼼하고 완고하며 사소한 것 에 집착 ·일 중독·완벽주의\n▪ 심리 평가 기법 : ·부적응행동과 관련된 인지, 정서, 성격, 행동의 여러 요 인을 파악하기 위한 임상면접, 심리검사, 행동평가, 인지평 가 등 ·성격검사, 지능검사, 행동관찰, 면접과 자기보고식 척도\n▪ 생물 : ·두뇌 및 신경계의 기능을 직접 관찰하거나 추론\n▪ 학적 평가 기법 : ·뇌영상 촬영법, 신경화학적 평가, 신경심리학적 평가"},

  {"set": "exam", "lec": 12, "tag": "12장 기출 · 19-1학년 기말 68번", "q": "다음 아동기 또래집단에 대한 설명 중 가장 잘못된 것은 무엇인가?", "opts": ["학교생활과 더불어 교우관계는 점점 확대된다.", "학년이 올라감에 따라 놀이나 작업을 위한 수단으로서의 집합이 아니라 관계 자체를 목적으로 선택한 친구집단으로 성격이 구체화 된다.", "또래집단은 모델, 강화자, 준거로서 역할을 한다.", "또래 사이에서 인기를 끄는 성격적 특성은 나이나 성별, 계층에 관계없이 동일하다."], "ans": 3, "exp": "④또래 사이에서 인기를 끄는 성격 특성은 나이나 성별, 계층에 따라 다르다. 우호적, 사교적, 참여적 성격 인기가 높으며, 수줍음, 소심함, 무관심한 성격은 인기가 낮다."},
  {"set": "exam", "lec": 12, "tag": "12장 기출 · 19년 하계 48번", "q": "학령기 아동에게서 나타나는 ADHD(attention deficit hyperactivity disorder)의 증상에 대한 설명 중 올바른 것은?", "opts": ["다른 친구나 형제와 어울리지 못한다.", "모든 일에 순종적이고, 안정적인 행동패턴을 보인다.", "초기 발병단계에서 수면과 식사습관이 눈에 띄게 이상한 점이 나타나는 것은 아니다.", "충동을 통제할 수는 없지만 부모나 교사의 명령에는 순종하는 경향이 있다."], "ans": 0, "exp": "주의력결핍 및 과잉행동장애(ADHD)의 문제의 핵심은 과잉활동 자체가 아니라 주어진 과제에 주의를 집중하지 못하고 목표와 무관한 과잉활동에 빠져드는 것이다."},

  {"set": "exam", "lec": 13, "tag": "13장 기출 · 18년 하계 43번", "q": "집단따돌림의 해결책으로 가장 적절한 것은?", "opts": ["또래들 간의 긴밀한 상호작용을 차단한다.", "교사의 적극적 개입은 가급적 피해야 한다.", "가해자에 대해서도 치료와 상담을 실시한다.", "자발적 신고만을 조심스럽게 다루도록 한다."], "ans": 2, "exp": "청소년기 부적응행동_집단따돌림_해결책\n▪ 집 단 따 돌 림 : 개 념 및 행 동 적 특징 : ⚫두 명 이상이 집단을 이루어 특정인을 그가 속한 집단 에서 소외시켜, 구성원으로서의 역할을 수행하는데 제약 을 가하거나 인격적으로 무시 혹은 음해하는 일체의 언 어적·신체적 행위 ·은밀한 배척행위에서 공공연한 폭력까지 포함 ·신체적 가혹행위, 심리적·언어적 폭력도 포함\n▪ ⚫괴롭힘 행동의 예 ·싫어하는 별명 부르기, 말로 놀리기, 무시하기, 빈정거 리기, 물건 빼앗기, 엉뚱한 소문 내기, 때리기\n▪ 부작용 : ⚫피해자 측면 ·사회적 지지망 상실과 소외감으로 인한 정서적 충격 ⚫가해자 및 방조자 측면 ·양심의 가책이나 패배감 ⚫청소년 교육 일반 측면 ·청소년들의 도덕성 발달과 가치관 형성에 부정적 영 향 ·바람직한 청소년 문화 형성 저해\n▪ 피 해 학생의 특징 : ·내성적이며, 자기주장을 잘하지 못하는 학생 ·외모나 목소리가 특이한 학생 ·습관적인 거짓말, 말과 행동의 불일치 ·또래집단의 문화에 어울리지 못하는 학생 ·잘난 척, 똑똑한 척하거나 이기적인 태도 ·부끄러움을 많이 타거나 과민한 반응 ·교사가 편애하는 학생 ·교사의 관심과 애정을 독점하려는 학생\n▪ 집 단 따돌림 유발요 인: 피 해 자 측면, 개인적 요인 : ·사회적인 표준과 거리가 먼 태도와 행동 ·공상이나 잡념 등 자신만의 세계에 몰입하는 태도 ·상황에 맞지 않은 부적절하거나 엉뚱한 행동 ·무기력하고 소극적인 회피 행동 ·공격적 행동이나 거친 반응 ·청결하지 못한 용모 ·불명확하거나 빠른 말투 ·타인에 대한 경계와 피해의식 ·이해나 공감 능력 부족\n▪ 집 단 따돌림 유발요 인: 환 경 적 요인 : ⚫지나치게 처벌적인 양육태도 ·공격성, 약육강식의 논리 내면화 ⚫경쟁과 긴장관계를 조장하는 학교 ·친구를 동반자가 아니라 경쟁자로 인식\n▪ 집 단 따돌림 요 인 종합 : ⚫공감능력과 감수성 미숙 ·타인의 고통이나 죄의식에 둔감 ⚫교사의 틀에 맞지 않으면 문제아로 규정하는 학생 관 리 체계 ·집단 기준에 맞지 않은 특정 학생을 반복적으로 훈 계·처벌 → 교사가 따돌림을 모델링하는 부정적 결과 초래 ⚫개성을 인정하지 않는 획일적이고 규격화된 교육 풍토 ⚫기존 규범이나 다수의 의견에 순응하는 인간만을 요구 하는 사회 분위기 ·모난 돌이 정 맞는다.\n▪ 해결책 : ⚫집단따돌림 발생 시, 피해자, 가해자, 방관자를 모두 대상으로 지도 ·또래들 간 긴밀한 상호작용을 위한 집단활동 활성화 ⚫앞장서서 따돌리는 가해자 요인에 대한 보다 적극적인 연구와 개입 필요 ⚫피해자가 안심하고 도움을 구할 수 있는 시스템 구축\n▪ ⚫흥미 위주의 언론 보도를 자제하고 함께 해결방안을 고민하는 분위기 조성 ⚫시민의식, 바람직한 가치관과 태도 교육 실시 ·和而不同 (차이 존중, 상호 배려)"},

  {"set": "exam", "lec": 15, "tag": "15장 기출 · 17-3학년 기말 70번", "q": "우울증의 심리적 치료법 중 내담자의 생활 속에서 긍정적 강화의 비율을 높임으로써 우울증을 치료하려는 방법은?", "opts": ["행동치료", "정신역동적 치료", "인지치료", "인본주의적 치료"], "ans": 0, "exp": "중년기 부적응행동_우울증의 심리적 치료방법\n▪ 우 울 증 의 심 리 적 치 료 방 법 : 인지 치료 : ⚫부정적 사고, 인지적 오류, 이상주의적 신념, 완벽주의 적 신념(언제나, 모두, 반드시)을 변화시키는 방법 ⚫부정적 사고를 검토하여 이를 합리적 사고로 대체\n▪ 정신 역동적 치료 : 정신역동적 치료 ⚫자존감 향상, 초자아 조정, 자아 강화를 통해 치료 ⚫대인관계의 패턴과 무의식적인 좌절을 분석하여 억압 하고 있는 분노의 감정을 인식·조절하도록 유도\n▪ 행동 치료 : ⚫긍정적 강화의 비율을 증가시키는 방법 ·즐거움을 재경험할 수 있는 활동을 증가시킴 ·구체적인 기법: 자기생활 관찰기법, 점진적 과제기법, 사회적 기술 훈련, 자기주장 훈련 등\n▪ 인본 주의적 치료 : ⚫내담자의 왜곡된 사고를 내담자의 주관적 진술로 존중 ·내담자의 경험을 평가하거나 변화시키려 하기보다는 그 자체를 수용하고 존중·공감\n▪ 약물 치료 : ⚫뇌의 신경전달물질에 영향을 미치는 화학 물질을 직접 투입하는 방식\n▪ 전기 충격 치료 : ⚫머리에 일정한 전압의 전류를 연결하여 신경을 직접 자극하는 방식\n▪ 광선 치료 : ⚫적은 양의 자외선을 포함한 빛에 노출시키는 방법 ·계절성 우울증에 적용"},

// ==============================
// STATE
// ==============================
let questions = [];
let currentIdx = 0;
let answers = {};       // idx → chosen option (0-based)
let bookmarks = new Set(JSON.parse(localStorage.getItem('hbse_bm') || '[]'));
let wrongSet = new Set(JSON.parse(localStorage.getItem('hbse_wrong') || '[]'));
let graded = false;
let currentMode = '';
let expandView = false;

// ── TIMER ──
let timerInterval = null;
let timerSeconds = 20 * 60;

function startTimer() {
  clearInterval(timerInterval);
  timerSeconds = 20 * 60;
  updateTimerDisplay();
  const box = document.getElementById('timer-box');
  box.style.display = 'flex';
  document.getElementById('sa-timer').classList.remove('hidden');
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      alert('⏰ 시험 시간이 종료되었습니다!');
      gradeQuiz();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  document.getElementById('timer-box').style.display = 'none';
  document.getElementById('sa-timer').classList.add('hidden');
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  const txt = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el = document.getElementById('timer-display');
  el.textContent = txt;
  el.className = timerSeconds <= 60 ? 'timer-danger' : '';
  const st = document.getElementById('sa-timer');
  st.textContent = '⏱ ' + txt;
  st.classList.toggle('timer-danger', timerSeconds <= 60);
}

// ── EXPAND / COLLAPSE VIEW ──
function toggleExpandView() {
  expandView = !expandView;
  const btn = document.getElementById('expand-btn');
  const quizScreen = document.getElementById('quiz-screen');
  const expandScreen = document.getElementById('expand-all-screen');

  if (expandView) {
    btn.textContent = '⊟';
    btn.title = '한 문제씩 보기';
    quizScreen.classList.add('hidden');
    expandScreen.style.display = 'block';
    renderExpandAll();
  } else {
    btn.textContent = '⇅';
    btn.title = '전체 문제 보기';
    expandScreen.style.display = 'none';
    quizScreen.classList.remove('hidden');
    renderQuestion();
  }
}

function renderExpandAll() {
  const screen = document.getElementById('expand-all-screen');
  screen.innerHTML = '';
  const nums = ['①','②','③','④','⑤'];
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'all-q-card';
    card.id = `all-q-${i}`;

    const numDiv = document.createElement('div');
    numDiv.className = 'q-num';
    numDiv.textContent = `${i + 1} / ${questions.length} 번 문제 · ${q.tag}`;
    card.appendChild(numDiv);

    const textDiv = document.createElement('div');
    textDiv.className = 'q-text';
    textDiv.textContent = q.q;
    card.appendChild(textDiv);

    if (q.box && q.box.length) {
      const boxDiv = document.createElement('div');
      boxDiv.className = 'q-box';
      q.box.forEach(t => { const d = document.createElement('div'); d.textContent = t; boxDiv.appendChild(d); });
      card.appendChild(boxDiv);
    }

    const optsDiv = document.createElement('div');
    optsDiv.className = 'options';
    q.opts.forEach((opt, oi) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<span class="num">${nums[oi]}</span><span>${escHtml(opt)}</span>`;
      if (graded || answers[i] !== undefined) {
        markOption(div, oi, q.ans, answers[i]);
      } else {
        div.onclick = () => {
          answers[i] = oi;
          const y = card.getBoundingClientRect().top;
          renderExpandAll(); renderGrid(); updateProgress();
          // 다시 그린 뒤에도 보던 위치 유지
          const nc = document.getElementById(`all-q-${i}`);
          if (nc) document.getElementById('main').scrollTop += nc.getBoundingClientRect().top - y;
        };
      }
      optsDiv.appendChild(div);
    });
    card.appendChild(optsDiv);

    if (graded || answers[i] !== undefined) {
      const expDiv = document.createElement('div');
      expDiv.className = 'explanation show';
      expDiv.innerHTML = feedbackHtml(q, answers[i]) + `<div class="exp-label">💡 해설</div><div>${escHtml(q.exp)}</div>`;
      card.appendChild(expDiv);
    }

    screen.appendChild(card);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function saveBookmarks() {
  localStorage.setItem('hbse_bm', JSON.stringify([...bookmarks]));
}
function saveWrong() {
  localStorage.setItem('hbse_wrong', JSON.stringify([...wrongSet]));
}

// ==============================
// NAVIGATION
// ==============================
function showStart() {
  document.body.classList.remove('quiz-on');
  document.getElementById('start-screen').classList.remove('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('expand-all-screen').style.display = 'none';
  document.getElementById('sidebar').classList.add('hidden');
  document.getElementById('mode-tag').textContent = '모드 선택 중';
  document.getElementById('progress-text').textContent = '';
  document.getElementById('expand-btn').style.display = 'none';
  setHeaderBtns(false, false, false);
  stopTimer();
  graded = false;
  answers = {};
  questions = [];
  currentIdx = 0;
  expandView = false;
}

function setHeaderBtns(grade, retry, home) {
  document.getElementById('btn-header-grade').style.display = grade ? 'inline-block' : 'none';
  document.getElementById('btn-header-retry').style.display = retry ? 'inline-block' : 'none';
  document.getElementById('btn-header-home').style.display = home ? 'inline-block' : 'none';
  document.getElementById('sa-grade').style.display = grade ? '' : 'none';
  document.getElementById('sa-retry').style.display = retry ? '' : 'none';
  document.getElementById('sa-home').style.display = home ? '' : 'none';
  document.getElementById('sa-expand').style.display = grade ? '' : 'none';
}

function retryQuiz() {
  if (!confirm('다시 풀기 하면 현재 답이 초기화됩니다. 계속하시겠습니까?')) return;
  startQuiz(currentMode);
}

function startQuiz(mode) {
  currentMode = mode;
  graded = false;
  answers = {};
  currentIdx = 0;
  expandView = false;
  let useTimer = false;

  if (mode === 'random') {
    questions = shuffle([...ALL_QUESTIONS]).slice(0, 30);
    document.getElementById('mode-tag').textContent = '랜덤 30문제';
    useTimer = true;  // 랜덤만 20분 타이머
  } else if (mode === 'all') {
    questions = [...ALL_QUESTIONS];
    document.getElementById('mode-tag').textContent = `전체 ${questions.length}문제`;
    useTimer = false; // 전체 문제는 시간제한 없음
  } else if (mode === 'lecture') {
    questions = ALL_QUESTIONS.filter(q => q.set === 'lec');
    document.getElementById('mode-tag').textContent = `강의 연습문제 ${questions.length}문제`;
  } else if (mode === 'exam') {
    questions = ALL_QUESTIONS.filter(q => q.set === 'exam');
    document.getElementById('mode-tag').textContent = `기출 ${questions.length}문제`;
  } else if (mode === 'chap') {
    const c = Number(document.getElementById('chap-select').value);
    questions = ALL_QUESTIONS.filter(q => q.set === 'exam' && q.lec === c);
    document.getElementById('mode-tag').textContent = `${c}장 기출 ${questions.length}문제`;
  } else if (mode === 'bookmark') {
    const bmIds = [...bookmarks];
    questions = ALL_QUESTIONS.filter((_, i) => bmIds.includes(i));
    if (questions.length === 0) { alert('📌 책갈피된 문제가 없습니다.'); return; }
    document.getElementById('mode-tag').textContent = `책갈피 ${questions.length}문제`;
    useTimer = false;
  } else if (mode === 'wrong') {
    questions = [...wrongSet].map(i => ALL_QUESTIONS[i]).filter(Boolean);
    if (questions.length === 0) { alert('✅ 틀린 문제가 없습니다!'); return; }
    document.getElementById('mode-tag').textContent = `오답 ${questions.length}문제`;
    useTimer = false;
  }

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('expand-all-screen').style.display = 'none';
  document.getElementById('quiz-screen').classList.remove('hidden');
  document.getElementById('sidebar').classList.remove('hidden');
  document.body.classList.add('quiz-on');
  document.getElementById('expand-btn').style.display = 'flex';
  document.getElementById('expand-btn').textContent = '⇅';
  setHeaderBtns(true, true, true);

  if (useTimer) {
    startTimer();
  } else {
    stopTimer();
  }

  renderQuestion();
  renderGrid();
}

function navigate(dir) {
  const newIdx = currentIdx + dir;
  if (newIdx < 0 || newIdx >= questions.length) return;
  currentIdx = newIdx;
  renderQuestion();
  renderGrid();
}

function goToQuestion(i) {
  if (expandView) {
    const card = document.getElementById(`all-q-${i}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    currentIdx = i;
    renderGrid();
    return;
  }
  currentIdx = i;
  renderQuestion();
  renderGrid();
}

// ==============================
// RENDER QUESTION
// ==============================
function renderQuestion() {
  const q = questions[currentIdx];
  if (!q) return;

  const origIdx = ALL_QUESTIONS.indexOf(q);
  const label = document.getElementById('q-num-label');
  label.textContent = `${currentIdx + 1} / ${questions.length} 번 문제 · ${q.tag}`;

  document.getElementById('q-text').textContent = q.q;
  const boxEl = document.getElementById('q-box');
  if (q.box && q.box.length) {
    boxEl.innerHTML = '';
    q.box.forEach(t => { const d = document.createElement('div'); d.textContent = t; boxEl.appendChild(d); });
    boxEl.classList.remove('hidden');
  } else {
    boxEl.classList.add('hidden');
  }
  document.getElementById('q-text').style.fontWeight = '600';

  const optsCont = document.getElementById('options');
  optsCont.innerHTML = '';

  const nums = ['①','②','③','④','⑤'];
  q.opts.forEach((opt, oi) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="num">${nums[oi]}</span><span>${escHtml(opt)}</span>`;

    if (graded || answers[currentIdx] !== undefined) {
      markOption(div, oi, q.ans, answers[currentIdx]);
    } else {
      div.onclick = () => selectOption(oi);
    }
    optsCont.appendChild(div);
  });

  // Explanation
  const expEl = document.getElementById('explanation');
  const expText = document.getElementById('exp-text');
  if (graded || answers[currentIdx] !== undefined) {
    expEl.classList.remove('hidden');
    expEl.classList.add('show');
    document.getElementById('exp-feedback').innerHTML = feedbackHtml(q, answers[currentIdx]);
    expText.textContent = q.exp;
  } else {
    expEl.classList.remove('show');
  }

  // Bookmark btn
  const bmBtn = document.getElementById('bm-btn');
  if (bookmarks.has(origIdx)) {
    bmBtn.classList.add('bookmarked');
    bmBtn.textContent = '🔖 책갈피됨';
  } else {
    bmBtn.classList.remove('bookmarked');
    bmBtn.textContent = '🔖 책갈피';
  }

  // prev/next
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').textContent = currentIdx === questions.length - 1 ? '완료' : '다음 ▶';

  // progress
  updateProgress();

}

function selectOption(oi) {
  if (graded || answers[currentIdx] !== undefined) return;   // 한 번 고르면 바로 채점, 변경 불가
  answers[currentIdx] = oi;
  renderQuestion();
  renderGrid();
}

// 정답/오답 표시 (고른 답이 틀리면 빨강, 정답은 항상 초록)
function markOption(div, oi, ans, chosen) {
  div.classList.add('locked');
  if (oi === ans) div.classList.add('correct');
  else if (chosen === oi) div.classList.add('wrong');
}

function feedbackHtml(q, chosen) {
  const nums = ['①','②','③','④','⑤'];
  if (chosen === undefined) return `<div class="feedback ng">미응답 · 정답 ${nums[q.ans]}</div>`;
  if (chosen === q.ans) return `<div class="feedback ok">⭕ 정답입니다</div>`;
  return `<div class="feedback ng">❌ 오답입니다 · 정답 ${nums[q.ans]}</div>`;
}

function updateProgress() {
  const answered = Object.keys(answers).length;
  const right = questions.filter((q, i) => answers[i] === q.ans).length;
  document.getElementById('progress-text').textContent =
    `${answered} / ${questions.length} 문제 응답 · 정답 ${right}`;
}

function toggleBookmark() {
  const q = questions[currentIdx];
  const origIdx = ALL_QUESTIONS.indexOf(q);
  if (bookmarks.has(origIdx)) bookmarks.delete(origIdx);
  else bookmarks.add(origIdx);
  saveBookmarks();
  renderQuestion();
  renderGrid();
}

// ==============================
// RENDER GRID
// ==============================
function renderGrid() {
  const grid = document.getElementById('q-grid');
  grid.innerHTML = '';
  const nums = ['①','②','③','④','⑤'];
  questions.forEach((q, i) => {
    const origIdx = ALL_QUESTIONS.indexOf(q);
    const div = document.createElement('div');
    div.className = 'q-dot';

    const numEl = document.createElement('span');
    numEl.className = 'dot-num';
    numEl.textContent = i + 1;
    div.appendChild(numEl);

    if (answers[i] !== undefined) {
      const ansEl = document.createElement('span');
      ansEl.className = 'dot-ans';
      ansEl.textContent = nums[answers[i]];
      div.appendChild(ansEl);
    }

    div.onclick = () => goToQuestion(i);

    if (i === currentIdx) div.classList.add('current');
    if (bookmarks.has(origIdx)) div.classList.add('bookmarked-dot');
    if (answers[i] === q.ans) div.classList.add('correct-dot');
    else if (answers[i] !== undefined) div.classList.add('wrong-dot');
    grid.appendChild(div);
  });
}

// ==============================
// GRADE
// ==============================
function gradeQuiz() {
  graded = true;
  stopTimer();
  document.getElementById('expand-btn').style.display = 'none';
  document.getElementById('expand-all-screen').style.display = 'none';
  expandView = false;
  let correct = 0, wrong = 0;
  const newWrong = new Set();
  questions.forEach((q, i) => {
    const origIdx = ALL_QUESTIONS.indexOf(q);
    if (answers[i] === q.ans) { correct++; wrongSet.delete(origIdx); }
    else { wrong++; newWrong.add(origIdx); wrongSet.add(origIdx); }
  });
  saveWrong();

  const unanswered = questions.length - Object.keys(answers).length;
  const score = Math.round((correct / questions.length) * 100);

  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('res-score').textContent = `${score}점`;
  document.getElementById('res-sub').textContent = `총 ${questions.length}문제 중 ${correct}문제 정답`;
  document.getElementById('res-c').textContent = correct;
  // wrong 에는 이미 미응답이 포함되어 있음 (정답이 아니면 모두 오답으로 셈)
  document.getElementById('res-w').textContent = wrong;
  document.getElementById('res-b').textContent = bookmarks.size;
  setHeaderBtns(false, false, true);

  renderGrid();
  document.getElementById('main').scrollTop = 0;
}

// ==============================
// PHONE MODE
// ==============================
// 저장된 선택이 없으면 화면이 작은 기기(폰)에서 자동으로 켬
function initPhoneMode() {
  let saved = null;
  try { saved = localStorage.getItem('hbse_phone'); } catch (e) {}
  const small = window.matchMedia('(max-width: 900px), (max-height: 500px)').matches;
  setPhoneMode(saved === null ? small : saved === '1');
}
function setPhoneMode(on) {
  document.body.classList.toggle('phone', on);
  document.getElementById('btn-phone').textContent = on ? '🖥 PC 모드' : '📱 폰 모드';
}
function togglePhoneMode() {
  const on = !document.body.classList.contains('phone');
  setPhoneMode(on);
  try { localStorage.setItem('hbse_phone', on ? '1' : '0'); } catch (e) {}
}
initPhoneMode();

// ==============================
// UTILS
// ==============================
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
